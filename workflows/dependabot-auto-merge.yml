---
name: Dependabot Auto-Merge

on:
  # zizmor: ignore[dangerous-triggers] — Dependabot PRs get a read-only token under
  # `pull_request`, so pull_request_target is required to approve and merge them.
  # Gated to actor == dependabot[bot]; the caller only dispatches the reusable
  # workflow — no PR-code checkout or exec.
  pull_request_target:

permissions: {}

jobs:
  call:
    if: github.actor == 'dependabot[bot]'
    # No `secrets:` — least privilege. The reusable uses only the automatic
    # GITHUB_TOKEN, so passing repository secrets would over-provision it.
    uses: f5-sales-demo/docs-control/.github/workflows/dependabot-auto-merge.yml@55b795c4614d55f79907812d6ee9b058181ee3d8
    permissions:
      contents: write # merge the validated Dependabot update
      pull-requests: write # approve and enable auto-merge
