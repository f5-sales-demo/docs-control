---
name: Configuration Source Pages Deploy
on:
  push:
    branches: [main]
    paths:
      - 'terraform/scenarios.tf.json'
      - 'examples/bot-defense.json'
      - 'scripts/prepare_snippets.py'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    if: github.repository == 'f5-sales-demo/custom-responses'
    uses: f5-sales-demo/docs-control/.github/workflows/github-pages-deploy.yml@a0e40f0e5643fce004547f321f4a6e8a98bcbea1
    with:
      builder-image: ghcr.io/f5-sales-demo/docs-builder@sha256:72ab6ad2488d391b86d737c1375f782876cce16501f567d327db1caae0f3a7ae
      content-ref: ${{ github.sha }}
      content-path: docs
      socketless_runner_label: managed-socketless
      container_build_runner_label: managed-container-build
    permissions:
      contents: read # read exact configuration and documentation source
      packages: read # pull the governed immutable builder
      pages: write # publish the guide
      id-token: write # authenticate the Pages deployment
