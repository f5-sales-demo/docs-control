---
# Reusable workflow: translation-freshness audit (read-only).
#
# Audits the complete translated corpus only on a verified next-major
# release/vN.0.0 pull request. Routine English development and minor/patch
# releases are intentionally English-only and pass as not applicable.
#
# This check performs NO translation (no model calls). Generation happens via
# the exact-head Antigravity workflow. Repositories without English docs pass
# trivially. Called by the downstream stub .github/workflows/translation-audit.yml.
name: Translation Audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Translation freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit translation freshness
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git tag --list >"$RUNNER_TEMP/translation-tags.txt"
          decision=$(bash scripts/translation-release-policy.sh \
            --head-ref "$HEAD_REF" --tags-file "$RUNNER_TEMP/translation-tags.txt")
          printf '%s\n' "$decision"
          if ! grep -qxF 'eligible=true' <<<"$decision"; then
            echo "[i18n] translation freshness is not applicable outside the next major release"
            exit 0
          fi
          bash scripts/validate-translations.sh --all
