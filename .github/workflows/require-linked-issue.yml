---
name: Require Linked Issue

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to check.
        required: true
        type: string
      expected_head_sha:
        description: Exact head receipt for the PR branch.
        required: true
        type: string

permissions: {}

concurrency:
  group: require-linked-issue-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pull_request_number }}-${{ inputs.expected_head_sha || 'live' }}
  cancel-in-progress: true

jobs:
  check-linked-issues:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Check linked issues
    runs-on: [self-hosted, Linux, X64, "${{ github.event.repository.name }}", ubuntu-24.04]
    permissions:
      pull-requests: read # inspect and attest the current pull request
      contents: read # resolve repository metadata for linked-issue validation
    steps:
      - name: Check this pull request's linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number < 1) {
              core.setFailed("Pull request number must be a positive integer.");
              return;
            }
            if (process.env.EVENT_NAME === "pull_request" &&
                context.payload.pull_request.head.ref === "sync/manifest") {
              core.info(`PR #${number} is the trusted synthetic manifest publication branch.`);
              return;
            }
            if (process.env.EVENT_NAME === "workflow_dispatch") {
              if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_HEAD_SHA)) {
                core.setFailed("Manual linked-issue checks require exact lowercase SHA receipts.");
                return;
              }
              const pull = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pull.data.head.sha !== process.env.EXPECTED_HEAD_SHA ||
                  pull.data.head.repo?.full_name !== `${owner}/${repo}`) {
                core.setFailed("The dispatched linked-issue receipt does not match the current same-repository pull request.");
                return;
              }
              if (pull.data.head.ref === "sync/manifest") {
                core.info(`PR #${number} is the exact synthetic manifest publication; linked-issue policy is satisfied by its verified publisher receipt.`);
                return;
              }
            }
            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 1) { nodes { number } }
                  }
                }
              }`,
              { owner, repo, number },
            );
            const linked = result.repository.pullRequest.closingIssuesReferences.nodes;
            if (linked.length === 0) {
              core.setFailed("Pull request must link a GitHub issue. Add 'Closes #123' to the PR description or link an issue from the sidebar.");
            } else {
              core.info(`PR #${number} links issue #${linked[0].number}`);
            }
