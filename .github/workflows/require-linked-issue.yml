---
name: Require Linked Issue

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

concurrency:
  group: require-linked-issue-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  validate-pull-request:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ startsWith(github.event.pull_request.head.ref, 'sync/manifest-') && 'Validate manifest receipt candidate' || 'Check linked issues' }}
    runs-on: managed-socketless
    permissions:
      pull-requests: read # inspect the current pull request
      contents: read # inspect manifest candidate ancestry
    steps:
      - name: Validate pull request policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            if (pull.head?.ref?.startsWith("sync/manifest-")) {
              const match = /^sync\/manifest-([0-9a-f]{40})$/.exec(pull.head.ref);
              if (!match || pull.base.ref !== "main" || pull.base.repo.full_name !== `${owner}/${repo}`) {
                core.setFailed("Manifest candidate branch, repository, or base is invalid.");
                return;
              }
              const source = match[1];
              const head = pull.head.sha;
              if (!/^[0-9a-f]{40}$/.test(head)) {
                core.setFailed("Manifest candidate head is invalid.");
                return;
              }
              const [commit, commits, files] = await Promise.all([
                github.rest.git.getCommit({ owner, repo, commit_sha: head }),
                github.rest.pulls.listCommits({ owner, repo, pull_number: pull.number, per_page: 2 }),
                github.rest.pulls.listFiles({ owner, repo, pull_number: pull.number, per_page: 2 }),
              ]);
              const valid = commit.data.parents.length === 1 &&
                commit.data.parents[0].sha === source &&
                commits.data.length === 1 && commits.data[0].sha === head &&
                files.data.length === 1 &&
                files.data[0].filename === ".github/config/managed-files-manifest.json" &&
                files.data[0].status === "modified";
              if (!valid) {
                core.setFailed("Manifest candidate is not one exact manifest-only commit on its receipted source.");
                return;
              }
              core.info(`Manifest candidate #${pull.number} has a valid untrusted shape; protected-main attestation is still required.`);
              return;
            }
            const number = pull.number;
            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 1) { nodes { number } }
                  }
                }
              }`,
              { owner, repo, number },
            );
            const linked = result.repository.pullRequest.closingIssuesReferences.nodes;
            if (linked.length === 0) {
              core.setFailed("Pull request must link a GitHub issue. Add 'Closes #123' to the PR description or link an issue from the sidebar.");
            } else {
              core.info(`PR #${number} links issue #${linked[0].number}`);
            }
