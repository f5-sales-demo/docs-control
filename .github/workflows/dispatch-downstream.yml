---
name: Dispatch Downstream Enforcement

# Fans out downstream enforcement once the regenerated manifest has LANDED on
# main. The manifest is the source of truth sync reads; because main is
# protected, "Build Managed Files Manifest" cannot push it directly and routes
# it through an auto-merging sync/manifest PR. Triggering on that PR's merge
# (a push to main touching the manifest) — not on the build's completion —
# guarantees downstream reads the fresh manifest instead of racing the still-open
# PR and fanning out the stale one (issue #634). repo-settings.json is included
# so settings-only changes, which leave the manifest untouched, still enforce
# downstream. workflow_dispatch is kept as a manual fallback.
on:
  push:
    branches: [main]
    paths:
      - '.github/config/managed-files-manifest.json'
      - '.github/config/repo-settings.json'
      - '.github/config/docs-sites.json'
      - '.github/config/downstream-repos.json'
      - '.github/config/governed-workflow-pin.json'
      - '.github/config/governance-rollout.json'
      - '.github/workflows/dispatch-downstream.yml'
      - 'scripts/provision-governance-secrets.sh'
      - 'workflows/enforce-repo-settings.yml'
      - 'README.md.tpl'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-downstream
  # Bootstrap mutates downstream PR state. Queue newer receipts so an in-flight
  # exact transition can defer monotonically instead of being killed mid-write.
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch downstream enforcement
    runs-on: ubuntu-latest
    environment: repository-settings
    # No conclusion guard needed: dispatch now fires only when the manifest has
    # already landed on main. A bad manifest fails the sync/manifest PR's checks
    # and never merges, so it can never reach main to trigger this workflow.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dispatch enforce-repo-settings to all downstream repos
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          REPO_SETTINGS_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          REPO_SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$SOURCE_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve an exact docs-control source commit"
            exit 1
          fi

          set +e
          scripts/provision-governance-secrets.sh
          provision_rc=$?
          set -e
          case "$provision_rc" in
            0) ;;
            84)
              echo "[DEFER] GitHub API rate capacity was exhausted; scheduled recovery is active"
              exit 0
              ;;
            *)
              echo "::error::Governance repository-secret provisioning failed"
              exit "$provision_rc"
              ;;
          esac

          set +e
          scripts/preflight-downstream-dispatch.sh
          preflight_rc=$?
          set -e
          case "$preflight_rc" in
            0) ;;
            78)
              echo "[DEFER] historical receipt; enqueueing current protected main"
              gh workflow run dispatch-downstream.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main
              exit 0
              ;;
            79)
              echo "[DEFER] governed workflow pin is not ready; enqueueing exact roll-forward"
              gh workflow run update-governed-workflow-pins.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f revision="$SOURCE_SHA"
              exit 0
              ;;
            84)
              echo "[DEFER] GitHub API rate capacity was exhausted; scheduled recovery is active"
              exit 0
              ;;
            80|81|82)
              echo "[BOOTSTRAP] propagating the exact managed caller before fan-out"
              set +e
              GH_TOKEN="$REPO_SYNC_TOKEN" \
                scripts/bootstrap-downstream-callers.sh
              bootstrap_rc=$?
              set -e
              case "$bootstrap_rc" in
                0)
                  set +e
                  scripts/preflight-downstream-dispatch.sh
                  postflight_rc=$?
                  set -e
                  case "$postflight_rc" in
                    0) ;;
                    78)
                      echo "[DEFER] source advanced during bootstrap; enqueueing current protected main"
                      gh workflow run dispatch-downstream.yml \
                        --repo "$GITHUB_REPOSITORY" \
                        --ref main
                      exit 0
                      ;;
                    79)
                      echo "[DEFER] reusable implementation advanced during bootstrap; enqueueing pin recovery"
                      gh workflow run update-governed-workflow-pins.yml \
                        --repo "$GITHUB_REPOSITORY" \
                        --ref main
                      exit 0
                      ;;
                    80|81|82)
                      echo "[DEFER] bootstrap state changed; scheduled recovery remains active"
                      exit 0
                      ;;
                    *)
                      echo "::error::Post-bootstrap preflight failed"
                      exit "$postflight_rc"
                      ;;
                  esac
                  ;;
                78)
                  echo "[DEFER] source advanced during bootstrap; enqueueing current protected main"
                  gh workflow run dispatch-downstream.yml \
                    --repo "$GITHUB_REPOSITORY" \
                    --ref main
                  exit 0
                  ;;
                83)
                  echo "[DEFER] exact-caller PRs or a newer bootstrap owner remain pending; scheduled recovery is active"
                  exit 0
                  ;;
                84)
                  echo "[DEFER] GitHub API rate capacity was exhausted; scheduled recovery is active"
                  exit 0
                  ;;
                81)
                  echo "[DEFER] exact callers are installed and enforcement remains deliberately quiesced"
                  exit 0
                  ;;
                *)
                  echo "::error::Exact-caller bootstrap failed"
                  exit "$bootstrap_rc"
                  ;;
              esac
              ;;
            *)
              echo "::error::Downstream dispatch preflight failed"
              exit "$preflight_rc"
              ;;
          esac

          dispatch_one() {
            local repo="$1"
            local attempt=1
            local max=3
            local delay=2
            while true; do
              if gh workflow run enforce-repo-settings.yml \
                  --repo "$repo" \
                  -f source_sha="$SOURCE_SHA" >/dev/null 2>&1; then
                printf '[OK]   %s\n' "$repo"
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                printf '[FAIL] %s\n' "$repo"
                return 1
              fi
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          export -f dispatch_one

          mapfile -t REPO_NAMES < <(jq -r '.[]' .github/config/downstream-repos.json)
          REPOS=()
          for name in "${REPO_NAMES[@]}"; do
            REPOS+=("${GITHUB_REPOSITORY_OWNER}/${name}")
          done
          TOTAL=${#REPOS[@]}
          BATCH_SIZE=5
          # Seven gaps at the current fleet size consume 210 seconds, leaving
          # 90 seconds of the runner's five-minute budget for API work/retries.
          BATCH_DELAY=30
          echo "Dispatching enforce-repo-settings to ${TOTAL} repos (batches of ${BATCH_SIZE}, ${BATCH_DELAY}s delay)..."

          LOG=$(mktemp)
          FAIL_COUNT=0
          batch=0

          for ((i = 0; i < TOTAL; i += BATCH_SIZE)); do
            batch=$((batch + 1))
            batch_repos=("${REPOS[@]:i:BATCH_SIZE}")
            echo ""
            echo "--- Batch ${batch} (repos $((i+1))-$((i+${#batch_repos[@]})) of ${TOTAL}) ---"

            for repo in "${batch_repos[@]}"; do
              dispatch_one "$repo" >> "$LOG" 2>&1 &
            done
            wait

            # Show batch results
            cat "$LOG"

            # Count failures so far
            BATCH_FAILS=$(grep -c '^\[FAIL\]' "$LOG" || true)
            FAIL_COUNT=$((FAIL_COUNT + BATCH_FAILS))
            : > "$LOG"

            # Delay between batches (skip after last)
            remaining=$((TOTAL - i - ${#batch_repos[@]}))
            if [ "$remaining" -gt 0 ]; then
              echo "[INFO] Waiting ${BATCH_DELAY}s before next batch..."
              sleep "$BATCH_DELAY"
            fi
          done

          if [ "${FAIL_COUNT}" -gt 0 ]; then
            echo ""
            echo "::error::${FAIL_COUNT} dispatch(es) failed"
            exit 1
          fi

          echo ""
          echo "All ${TOTAL} dispatches succeeded."
