---
name: Antigravity Code Review
run-name: Antigravity review PR ${{ inputs.pr_number }} @ ${{ inputs.expected_head_sha }}

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number selected by the trusted fleet orchestrator
        required: true
        type: string
      expected_base_sha:
        description: Exact pull-request base SHA selected by the orchestrator
        required: true
        type: string
      expected_head_sha:
        description: Exact pull-request head SHA selected by the orchestrator
        required: true
        type: string
    secrets:
      ANTIGRAVITY_TOKEN:
        required: true
      GCP_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository pilot pull request number
        required: true
        type: string
      expected_base_sha:
        description: Exact pilot pull-request base SHA
        required: true
        type: string
      expected_head_sha:
        description: Exact pilot pull-request head SHA
        required: true
        type: string

permissions: {}

jobs:
  review:
    name: PR review with Antigravity
    if: vars.ANTIGRAVITY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      AGY_VERSION: "1.1.10"
      AGY_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.1.10-6423386432339968/linux-x64/cli_linux_x64.tar.gz
      AGY_SHA512: e64d4e58ede0f8440f2b3dc021f9d6d36b05f5c2f74d5a9215c1f11b20d536c8c2e020f4ce5257aa67e940e94c94d5a16d3aa6461cda18ee7f3e74d3a20ca1ac
      BASE_SHA: ${{ inputs.expected_base_sha }}
      HEAD_SHA: ${{ inputs.expected_head_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact pull-request head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const {readPrimaryRateLimit, retryGitHub} = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts/github-api-resilience.cjs'),
            );
            const pullNumber = Number(process.env.PR_NUMBER);
            const response = await retryGitHub(
              () => github.rest.pulls.get({...context.repo, pull_number: pullNumber}),
              {
                operationName: `validate review head ${process.env.HEAD_SHA}`,
                totalWaitBudgetSeconds: 420,
                readPrimaryRateLimit: () => readPrimaryRateLimit({request: github.request}),
              },
            );
            const pull = response.data;
            if (pull.head.repo.full_name !== process.env.GITHUB_REPOSITORY ||
                pull.base.sha !== process.env.BASE_SHA || pull.head.sha !== process.env.HEAD_SHA) {
              throw new Error('pull request no longer matches the exact review receipt');
            }

      - name: Fetch exact pull-request head as data
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/agy/pr-head"
          test "$(git rev-parse refs/agy/pr-head)" = "$HEAD_SHA"
          tool_dir="$RUNNER_TEMP/agy-review-tool"
          mkdir -p "$tool_dir"
          cp scripts/agy-review.sh scripts/run-with-progress.sh \
            scripts/agy-review-output.schema.json "$tool_dir/"
          chmod 0555 "$tool_dir/agy-review.sh" "$tool_dir/run-with-progress.sh"
          git checkout --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Install pinned Antigravity runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dbus-x11 libsecret-1-0 gnome-keyring python3-keyring
          archive="$RUNNER_TEMP/agy-${AGY_VERSION}.tar.gz"
          curl --fail --silent --show-error --location "$AGY_URL" --output "$archive"
          printf '%s  %s\n' "$AGY_SHA512" "$archive" | sha512sum --check --strict
          mkdir "$RUNNER_TEMP/agy-extract"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agy-extract" antigravity
          sudo install -o root -g root -m 0555 "$RUNNER_TEMP/agy-extract/antigravity" /usr/local/bin/agy
          test "$(agy --version)" = "$AGY_VERSION"

      - name: Run isolated reviewer and verifier
        id: model
        env:
          ANTIGRAVITY_TOKEN: ${{ secrets.ANTIGRAVITY_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${ANTIGRAVITY_TOKEN:-}" || {
            echo "[review] ANTIGRAVITY_TOKEN is required" >&2
            exit 1
          }
          test -n "${GCP_PROJECT_ID:-}" || {
            echo "[review] GCP_PROJECT_ID is required" >&2
            exit 1
          }
          mkdir "$RUNNER_TEMP/review-artifact"
          dbus-run-session -- bash -euo pipefail <<'INNER'
          eval "$(printf '' | gnome-keyring-daemon --unlock --daemonize)"
          export SSH_AUTH_SOCK GNOME_KEYRING_CONTROL GNOME_KEYRING_PID
          printf '%s' "${ANTIGRAVITY_TOKEN#go-keyring-base64:}" | base64 -d |
            python3 -c 'import keyring,sys; keyring.set_password("gemini", "antigravity", sys.stdin.read())'
          unset ANTIGRAVITY_TOKEN
          mkdir -p "$HOME/.gemini/antigravity-cli"
          jq -n --arg project "$GCP_PROJECT_ID" --arg workspace "$GITHUB_WORKSPACE" '{
            gcp: {project: $project, location: "global"},
            model: "Gemini 3.6 Flash (High)",
            trustedWorkspaces: [$workspace]
          }' >"$HOME/.gemini/antigravity-cli/settings.json"
          set +e
          AGY_REVIEW_SKIP_LOCAL_PII=1 \
            AGY_REVIEW_REPORT_FILE="$RUNNER_TEMP/review-artifact/report.json" \
            bash "$RUNNER_TEMP/agy-review-tool/agy-review.sh" code --base "$BASE_SHA" \
            2>&1 | tee "$RUNNER_TEMP/review.log"
          review_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$review_rc" >"$RUNNER_TEMP/review-artifact/tool-status"
          if [ ! -s "$RUNNER_TEMP/review-artifact/report.json" ]; then
            jq -n '{
              reviewer: {verdict: "needs-attention", summary: "Antigravity review did not produce a valid report.", findings: [{severity: "critical", title: "Review execution failed", body: "The isolated reviewer failed closed; inspect the workflow log.", file: ".github/workflows/antigravity-review.yml", line_start: 1, line_end: 1, confidence: 1, recommendation: "Repair and rerun the review workflow."}], next_steps: ["Inspect the workflow log."]},
              verifier: {verdict: "needs-attention", summary: "Independent verification was unavailable.", findings: [], next_steps: ["Rerun after repairing review execution."]}
            }' >"$RUNNER_TEMP/review-artifact/report.json"
          fi
          test "$(agy --version)" = "$AGY_VERSION"
          INNER
          jq --arg repository "$GITHUB_REPOSITORY" --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" --arg workflow "$GITHUB_WORKFLOW_SHA" \
            --arg version "$AGY_VERSION" --arg status "$(cat "$RUNNER_TEMP/review-artifact/tool-status")" '. + {
              receipt: {
                repository: $repository,
                base_sha: $base,
                head_sha: $head,
                workflow_sha: $workflow,
                agy_version: $version,
                model: "Gemini 3.6 Flash (High)",
                tool_status: ($status | tonumber)
              }
            }' "$RUNNER_TEMP/review-artifact/report.json" >"$RUNNER_TEMP/review-artifact/report.final.json"
          mv "$RUNNER_TEMP/review-artifact/report.final.json" "$RUNNER_TEMP/review-artifact/report.json"

      - name: Upload review receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: antigravity-review-${{ inputs.expected_head_sha }}
          path: ${{ runner.temp }}/review-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact-head review
    if: always() && vars.ANTIGRAVITY_REVIEW_ENABLED == 'true'
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # publish an exact-head review comment
    env:
      AGY_VERSION: "1.1.10"
      BASE_SHA: ${{ inputs.expected_base_sha }}
      HEAD_SHA: ${{ inputs.expected_head_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Checkout trusted retry helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_base_sha }}
          persist-credentials: false

      - name: Download review receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: antigravity-review-${{ inputs.expected_head_sha }}
          path: ${{ runner.temp }}/review-artifact

      - name: Validate receipt
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/review-artifact/report.json"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" --arg workflow "$WORKFLOW_SHA" --arg version "$AGY_VERSION" '
            .receipt.repository == $repository and
            .receipt.base_sha == $base and
            .receipt.head_sha == $head and
            .receipt.workflow_sha == $workflow and
            .receipt.agy_version == $version and
            .receipt.model == "Gemini 3.6 Flash (High)" and
            (.receipt.tool_status | type == "number") and
            (.reviewer.findings | type == "array") and
            (.verifier.findings | type == "array")
          ' "$report" >/dev/null

      - name: Validate exact current head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const {readPrimaryRateLimit, retryGitHub} = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts/github-api-resilience.cjs'),
            );
            const pullNumber = Number(process.env.PR_NUMBER);
            const response = await retryGitHub(
              () => github.rest.pulls.get({...context.repo, pull_number: pullNumber}),
              {
                operationName: `revalidate review head ${process.env.HEAD_SHA}`,
                totalWaitBudgetSeconds: 420,
                readPrimaryRateLimit: () => readPrimaryRateLimit({request: github.request}),
              },
            );
            const pull = response.data;
            if (pull.head.repo.full_name !== process.env.GITHUB_REPOSITORY ||
                pull.base.sha !== process.env.BASE_SHA || pull.head.sha !== process.env.HEAD_SHA) {
              throw new Error('pull request no longer matches the exact review receipt');
            }

      - name: Publish deduplicated review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/review-artifact/report.json
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {readPrimaryRateLimit, retryGitHub} = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts/github-api-resilience.cjs'),
            );
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            const pullNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              throw new Error('invalid pull-request number');
            }
            const findingKey = (finding) => JSON.stringify([
              finding.severity, finding.title, finding.file, finding.line_start, finding.line_end,
            ]);
            const findings = [...new Map(
              [...report.reviewer.findings, ...report.verifier.findings]
                .map((finding) => [findingKey(finding), finding]),
            ).values()];
            const marker = `<!-- antigravity-pr-review:${report.receipt.head_sha} -->`;
            const blocking = findings.filter((finding) => ['critical', 'high'].includes(finding.severity));
            const lines = [marker, '## Antigravity PR review', '', `Head: \`${report.receipt.head_sha}\``, `Model: ${report.receipt.model}`, ''];
            lines.push(blocking.length ? `Blocking findings: ${blocking.length}` : 'No critical or high findings remain.');
            for (const finding of findings) {
              lines.push('', `- **${finding.severity.toUpperCase()}** ${finding.title} — \`${finding.file}:${finding.line_start}\``, `  ${finding.body}`);
            }
            const body = lines.join('\n');
            await retryGitHub(async () => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              const previous = comments.find((comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker));
              if (previous) {
                return github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
              }
              return github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullNumber,
                body,
              });
            }, {
              operationName: `publish exact-head review ${report.receipt.head_sha}`,
              totalWaitBudgetSeconds: 420,
              readPrimaryRateLimit: () => readPrimaryRateLimit({request: github.request}),
            });

      - name: Enforce Antigravity gate
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/review-artifact/report.json"
          jq -e '
            .receipt.tool_status == 0 and
            ([.reviewer.findings[], .verifier.findings[]] |
              map(select(.severity == "critical" or .severity == "high")) |
              length == 0)
          ' "$report" >/dev/null
