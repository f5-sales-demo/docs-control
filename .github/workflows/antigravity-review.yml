---
name: Antigravity Code Review
run-name: Antigravity review PR ${{ inputs.pr_number }} @ ${{ inputs.expected_head_sha }}

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number selected by the trusted fleet orchestrator
        required: true
        type: string
      expected_base_sha:
        description: Exact pull-request base SHA selected by the orchestrator
        required: true
        type: string
      expected_head_sha:
        description: Exact pull-request head SHA selected by the orchestrator
        required: true
        type: string
    secrets:
      ANTIGRAVITY_TOKEN:
        required: true
      GCP_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      qualification_only:
        description: Run exact-target qualification without fleet enablement or publication
        required: false
        default: false
        type: boolean
      pr_number:
        description: Same-repository pilot pull request number
        required: true
        type: string
      expected_base_sha:
        description: Exact pilot pull-request base SHA
        required: true
        type: string
      expected_head_sha:
        description: Exact pilot pull-request head SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: antigravity-reusable-review-${{ github.repository }}-${{ inputs.pr_number }}-${{ inputs.expected_head_sha }}
  cancel-in-progress: true

jobs:
  review:
    name: PR review with Antigravity
    if: vars.ANTIGRAVITY_REVIEW_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && github.repository == 'f5-sales-demo/docs-control' && inputs.qualification_only)
    runs-on: managed-socketless
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      AGY_CLI_DISABLE_AUTO_UPDATE: "true"
      AGY_VERSION: "1.4.2"
      AGY_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.4.2-4835981233356800/linux-x64/cli_linux_x64.tar.gz
      AGY_SHA512: 4a393afc1369cee94e817c1b430c9128d02b12ebd4d5703ace5cd47b2333e216d673fb0097cbf7195f757b110163ba9850e9eea3fdbbaddd4b25668b82c03f05
      AGY_TOOLS_SHA: "b848d64f28057d77fccf66d61799040293f1892e"
      BASE_SHA: ${{ inputs.expected_base_sha }}
      HEAD_SHA: ${{ inputs.expected_head_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}

    steps:
      - name: Checkout immutable review tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: f5-sales-demo/docs-control
          ref: b848d64f28057d77fccf66d61799040293f1892e
          path: review-tools
          persist-credentials: false

      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_base_sha }}
          fetch-depth: 0
          path: review-target
          persist-credentials: false

      - name: Validate exact pull-request head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const {readPrimaryRateLimit, retryGitHub} = require(
              path.join(process.env.GITHUB_WORKSPACE, 'review-tools/scripts/github-api-resilience.cjs'),
            );
            const pullNumber = Number(process.env.PR_NUMBER);
            const response = await retryGitHub(
              () => github.rest.pulls.get({...context.repo, pull_number: pullNumber}),
              {
                operationName: `validate review head ${process.env.HEAD_SHA}`,
                totalWaitBudgetSeconds: 420,
                readPrimaryRateLimit: () => readPrimaryRateLimit({request: github.request}),
              },
            );
            const pull = response.data;
            if (pull.head.repo.full_name !== process.env.GITHUB_REPOSITORY ||
                pull.base.sha !== process.env.BASE_SHA || pull.head.sha !== process.env.HEAD_SHA) {
              throw new Error('pull request no longer matches the exact review receipt');
            }

      - name: Fetch exact pull-request head as data
        working-directory: review-target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/agy/pr-head"
          test "$(git rev-parse refs/agy/pr-head)" = "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Install pinned Antigravity runtime
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/agy-${AGY_VERSION}.tar.gz"
          curl --fail --silent --show-error --location "$AGY_URL" --output "$archive"
          printf '%s  %s\n' "$AGY_SHA512" "$archive" | sha512sum --check --strict
          rm -rf "$RUNNER_TEMP/agy-extract"
          mkdir -p "$RUNNER_TEMP/agy-extract"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agy-extract" antigravity
          tool_dir="$RUNNER_TEMP/agy-review-bin"
          mkdir -p "$tool_dir"
          install -m 0555 "$RUNNER_TEMP/agy-extract/antigravity" "$tool_dir/agy"
          test "$("$tool_dir/agy" --version)" = "$AGY_VERSION"
          sha512sum "$tool_dir/agy" >"$RUNNER_TEMP/agy-review-bin.sha512"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

      - name: Run isolated reviewer and verifier
        id: model
        env:
          ANTIGRAVITY_TOKEN: ${{ secrets.ANTIGRAVITY_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${ANTIGRAVITY_TOKEN:-}" || {
            echo "[review] ANTIGRAVITY_TOKEN is required" >&2
            exit 1
          }
          test -n "${GCP_PROJECT_ID:-}" || {
            echo "[review] GCP_PROJECT_ID is required" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/review-artifact/diagnostics"
          dbus-run-session -- bash -euo pipefail <<'INNER'
          rm -rf "$HOME/.local/share/keyrings"
          mkdir -p "$HOME/.local/share/keyrings"
          keyring_password=$(openssl rand -hex 32)
          eval "$(printf '%s\n' "$keyring_password" | gnome-keyring-daemon --unlock --daemonize --components=secrets)"
          unset keyring_password
          export SSH_AUTH_SOCK GNOME_KEYRING_CONTROL GNOME_KEYRING_PID
          credential_dir="$HOME/.gemini/antigravity-cli"
          mkdir -p "$credential_dir"
          case "$ANTIGRAVITY_TOKEN" in
            agy-oauth-file-base64:*)
              echo "[review] credential transport: OAuth file"
              credential_payload=${ANTIGRAVITY_TOKEN#agy-oauth-file-base64:}
              unset ANTIGRAVITY_TOKEN
              credential_tmp=$(mktemp "$credential_dir/.antigravity-oauth-token.XXXXXX")
              trap 'rm -f "$credential_tmp"' EXIT
              if ! printf '%s' "$credential_payload" | base64 -d >"$credential_tmp"; then
                echo "[review] ANTIGRAVITY_TOKEN contains invalid base64" >&2
                exit 1
              fi
              unset credential_payload
              if ! jq -e '
                (type == "object") and
                (.auth_method == "gcp") and
                (.token | type == "object") and
                (.token.refresh_token | type == "string" and length > 0)
              ' "$credential_tmp" >/dev/null; then
                echo "[review] ANTIGRAVITY_TOKEN contains an invalid GCP OAuth document" >&2
                exit 1
              fi
              chmod 0600 "$credential_tmp"
              mv "$credential_tmp" "$credential_dir/antigravity-oauth-token"
              trap - EXIT
              ;;
            go-keyring-base64:*)
              credential_payload=${ANTIGRAVITY_TOKEN#go-keyring-base64:}
              unset ANTIGRAVITY_TOKEN
              credential_tmp=$(mktemp "$credential_dir/.antigravity-oauth-token.XXXXXX")
              trap 'rm -f "$credential_tmp"' EXIT
              printf '%s' "$credential_payload" | base64 -d >"$credential_tmp"
              unset credential_payload
              if jq -e 'type == "object" and .auth_method == "gcp" and
                (.token.refresh_token | type == "string" and length > 0)' "$credential_tmp" >/dev/null 2>&1; then
                echo "[review] credential transport: legacy keyring with GCP OAuth document"
                chmod 0600 "$credential_tmp"
                mv "$credential_tmp" "$credential_dir/antigravity-oauth-token"
              else
                echo "[review] credential transport: legacy keyring"
                python3 -c 'import keyring,sys; keyring.set_password("gemini", "antigravity", sys.stdin.read())' <"$credential_tmp"
                rm -f "$credential_tmp"
              fi
              trap - EXIT
              ;;
            *)
              unset ANTIGRAVITY_TOKEN
              echo "[review] unsupported ANTIGRAVITY_TOKEN format" >&2
              exit 1
              ;;
          esac
          if [ -f "$credential_dir/antigravity-oauth-token" ]; then
            jq '{credential_shape: {has_id_token: (.id_token | type == "string" and length > 0), has_access_token: (.token.access_token | type == "string" and length > 0), has_refresh_token: (.token.refresh_token | type == "string" and length > 0), has_expiry: (.token.expiry | type == "string" and length > 0), has_project: (.project_id | type == "string" and length > 0)}}' "$credential_dir/antigravity-oauth-token"
          fi
          if [ -f "$credential_dir/antigravity-oauth-token" ]; then
            credential_tmp=$(mktemp "$credential_dir/.antigravity-oauth-token.XXXXXX")
            trap 'rm -f "$credential_tmp"' EXIT
            jq --arg project "$GCP_PROJECT_ID" '.project_id = $project | .region = "global"' \
              "$credential_dir/antigravity-oauth-token" >"$credential_tmp"
            chmod 0600 "$credential_tmp"
            mv "$credential_tmp" "$credential_dir/antigravity-oauth-token"
            trap - EXIT
          fi
          jq -n --arg project "$GCP_PROJECT_ID" --arg workspace "$GITHUB_WORKSPACE/review-target" '{
            gcp: {project: $project, location: "global"},
            trustedWorkspaces: [$workspace]
          }' >"$HOME/.gemini/antigravity-cli/settings.json"
          cd "$GITHUB_WORKSPACE/review-target"
          set +e
          AGY_REVIEW_SKIP_LOCAL_PII=1 \
            AGY_REVIEW_REPORT_FILE="$RUNNER_TEMP/review-artifact/report.json" \
            AGY_REVIEW_DIAGNOSTIC_DIR="$RUNNER_TEMP/review-artifact/diagnostics" \
            bash "$GITHUB_WORKSPACE/review-tools/scripts/agy-review.sh" code --base "$BASE_SHA" \
            2>&1 | tee "$RUNNER_TEMP/review.log"
          review_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$review_rc" >"$RUNNER_TEMP/review-artifact/tool-status"
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if [ ! -s "$RUNNER_TEMP/review-artifact/report.json" ]; then
            python3 "$GITHUB_WORKSPACE/review-tools/scripts/agy_review_catastrophe.py" \
              "$RUNNER_TEMP/review-artifact/report.json" "$BASE_SHA" "$merge_base" "$HEAD_SHA"
          fi
          INNER
          sha512sum --check --strict "$RUNNER_TEMP/agy-review-bin.sha512"
          jq --arg repository "$GITHUB_REPOSITORY" --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" --arg workflow "$GITHUB_WORKFLOW_SHA" \
            --arg version "$AGY_VERSION" --arg tools "$AGY_TOOLS_SHA" --arg status "$(cat "$RUNNER_TEMP/review-artifact/tool-status")" '. + {
              receipt: {
                repository: $repository,
                base_sha: $base,
                head_sha: $head,
                workflow_sha: $workflow,
                agy_version: $version,
                tools_sha: $tools,
                model: .model.actual_model,
                tool_status: ($status | tonumber)
              }
            }' "$RUNNER_TEMP/review-artifact/report.json" >"$RUNNER_TEMP/review-artifact/report.final.json"
          mv "$RUNNER_TEMP/review-artifact/report.final.json" "$RUNNER_TEMP/review-artifact/report.json"

      - name: Validate controlled qualification
        if: inputs.qualification_only
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/review-artifact/report.json"
          merge_base=$(git -C "$GITHUB_WORKSPACE/review-target" merge-base "$BASE_SHA" "$HEAD_SHA")
          python3 "$GITHUB_WORKSPACE/review-tools/scripts/agy_review_report.py" "$report" \
            --repository "$GITHUB_REPOSITORY" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --merge-base "$merge_base" --workflow "$GITHUB_WORKFLOW_SHA" --version "$AGY_VERSION" --tools "$AGY_TOOLS_SHA"
          python3 "$GITHUB_WORKSPACE/review-tools/scripts/agy_review_report.py" "$report" --gate

      - name: Upload review receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: antigravity-review-${{ inputs.expected_head_sha }}
          path: ${{ runner.temp }}/review-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact-head review
    if: always() && vars.ANTIGRAVITY_REVIEW_ENABLED == 'true' && !inputs.qualification_only
    needs: review
    runs-on: managed-socketless
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # publish an exact-head review comment
    env:
      AGY_VERSION: "1.4.2"
      AGY_TOOLS_SHA: "b848d64f28057d77fccf66d61799040293f1892e"
      BASE_SHA: ${{ inputs.expected_base_sha }}
      HEAD_SHA: ${{ inputs.expected_head_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Checkout immutable review tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: f5-sales-demo/docs-control
          ref: b848d64f28057d77fccf66d61799040293f1892e
          path: review-tools
          persist-credentials: false

      - name: Checkout exact target objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          path: review-target
          persist-credentials: false

      - name: Download review receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: antigravity-review-${{ inputs.expected_head_sha }}
          path: ${{ runner.temp }}/review-artifact

      - name: Validate receipt
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/review-artifact/report.json"
          merge_base=$(git -C "$GITHUB_WORKSPACE/review-target" merge-base "$BASE_SHA" "$HEAD_SHA")
          python3 "$GITHUB_WORKSPACE/review-tools/scripts/agy_review_report.py" "$report" \
            --repository "$GITHUB_REPOSITORY" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --merge-base "$merge_base" --workflow "$WORKFLOW_SHA" --version "$AGY_VERSION" --tools "$AGY_TOOLS_SHA"

      - name: Validate exact current head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const {readPrimaryRateLimit, retryGitHub} = require(
              path.join(process.env.GITHUB_WORKSPACE, 'review-tools/scripts/github-api-resilience.cjs'),
            );
            const pullNumber = Number(process.env.PR_NUMBER);
            const response = await retryGitHub(
              () => github.rest.pulls.get({...context.repo, pull_number: pullNumber}),
              {
                operationName: `revalidate review head ${process.env.HEAD_SHA}`,
                totalWaitBudgetSeconds: 420,
                readPrimaryRateLimit: () => readPrimaryRateLimit({request: github.request}),
              },
            );
            const pull = response.data;
            if (pull.head.repo.full_name !== process.env.GITHUB_REPOSITORY ||
                pull.base.sha !== process.env.BASE_SHA || pull.head.sha !== process.env.HEAD_SHA) {
              throw new Error('pull request no longer matches the exact review receipt');
            }

      - name: Publish deduplicated review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/review-artifact/report.json
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {readPrimaryRateLimit, retryGitHub} = require(
              path.join(process.env.GITHUB_WORKSPACE, 'review-tools/scripts/github-api-resilience.cjs'),
            );
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            const pullNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              throw new Error('invalid pull-request number');
            }
            const findingKey = (finding) => JSON.stringify([
              finding.severity, finding.title, finding.file, finding.line_start, finding.line_end,
            ]);
            const findings = [...new Map(
              [...report.reviewer.findings, ...report.verifier.findings]
                .map((finding) => [findingKey(finding), finding]),
            ).values()];
            const marker = `<!-- antigravity-pr-review:${report.receipt.head_sha} -->`;
            const blocking = findings.filter((finding) => ['critical', 'high'].includes(finding.severity));
            const failedAttempt = report.receipt.tool_status === 0 ? undefined :
              (report.attempt_metadata || []).filter((attempt) => attempt.class !== 'success').at(-1);
            const lines = [marker, '## Antigravity PR review', '', `Head: \`${report.receipt.head_sha}\``, `Model: ${report.model.actual_model || 'unavailable'}; effort: ${report.model.effort}`, `Fallback: ${report.model.fallback_reason || 'none'}`, ''];
            if (failedAttempt) {
              lines.push('Review execution failed — no approval was granted.', '', `Phase: ${failedAttempt.phase}`, `Retry count: ${failedAttempt.count}`, `Failure class: ${failedAttempt.class}`, '', 'Please re-run this workflow after the provider is available.');
            } else {
              lines.push(blocking.length ? `Blocking findings: ${blocking.length}` :
                (report.reviewer.verdict === 'approve' && report.verifier.verdict === 'approve' ? 'Two explicit approvals; no critical or high findings remain.' : 'Approval withheld.'));
            }
            for (const finding of findings) {
              lines.push('', `- **${finding.severity.toUpperCase()}** ${finding.title} — \`${finding.file}:${finding.line_start}\``, `  ${finding.body}`);
            }
            const body = lines.join('\n');
            await retryGitHub(async () => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              const previous = comments.find((comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker));
              if (previous) {
                return github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
              }
              return github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullNumber,
                body,
              });
            }, {
              operationName: `publish exact-head review ${report.receipt.head_sha}`,
              totalWaitBudgetSeconds: 420,
              readPrimaryRateLimit: () => readPrimaryRateLimit({request: github.request}),
            });

      - name: Enforce Antigravity gate
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/review-artifact/report.json"
          python3 "$GITHUB_WORKSPACE/review-tools/scripts/agy_review_report.py" "$report" --gate
