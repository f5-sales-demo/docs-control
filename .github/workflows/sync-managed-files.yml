---
name: Sync Managed Files

on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Exact docs-control commit receipt for every governed read.'
        required: true
        type: string
      downstream_sha:
        description: 'Exact protected-main commit receipt for the calling repository.'
        required: true
        type: string
    secrets:
      repo-sync-token:
        description: 'PAT with contents, issues, and pull-request permissions for file sync'
        required: true
      repo-settings-token:
        description: 'PAT used to enqueue the current protected-main receipt'
        required: true

permissions: {}

concurrency:
  group: sync-managed-files-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync managed files
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the exact downstream protected-main receipt
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.downstream_sha }}
          persist-credentials: false

      - name: Sync managed files
        env:
          GH_TOKEN: ${{ secrets.repo-sync-token }}
          REPO_SETTINGS_TOKEN: ${{ secrets.repo-settings-token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DOWNSTREAM_SHA: ${{ inputs.downstream_sha }}
        run: |
          set -euo pipefail

          # --- Retry helpers -------------------------------------------------
          # Ordinary transport failures use a short exponential backoff. Primary
          # limits wait for X-RateLimit-Reset (or GET /rate_limit when the header
          # is unavailable). Secondary limits never poll: honor Retry-After or
          # wait 60, 120, 240... seconds within a bounded per-operation budget.
          retry() {
            local max="$1"; shift
            local attempt=1
            local delay=2
            local max_delay=8
            local total_wait=0
            local wait_budget="${GITHUB_API_WAIT_BUDGET_SECONDS:-600}"
            local err_file out_file response_content
            err_file=$(mktemp)
            out_file=$(mktemp)
            while true; do
              # Buffer stdout per attempt. `gh api` prints its JSON error body to
              # stdout on failure, and ~23 call sites capture this function's output
              # into a variable -- several of which drive enforcement decisions. Left
              # unbuffered, a transient failure followed by a successful retry hands
              # the caller the error body concatenated with the real value, which is
              # silently wrong rather than absent (issue #805).
              : >"$out_file"
              if "$@" >"$out_file" 2>"$err_file"; then
                cat "$out_file"
                cat "$err_file" >&2
                rm -f "$err_file" "$out_file"
                return 0
              fi
              response_content=$(cat "$out_file" "$err_file")
              cat "$err_file" >&2
              : >"$err_file"
              local retry_after remaining reset now wait_s next_at kind
              retry_after=$(awk 'tolower($1) == "retry-after:" {gsub("\r", "", $2); print $2; exit}' \
                <<<"$response_content")
              remaining=$(awk 'tolower($1) == "x-ratelimit-remaining:" {gsub("\r", "", $2); print $2; exit}' \
                <<<"$response_content")
              reset=$(awk 'tolower($1) == "x-ratelimit-reset:" {gsub("\r", "", $2); print $2; exit}' \
                <<<"$response_content")
              kind=""
              if [ -n "$retry_after" ] ||
                grep -qiE '(secondary rate|abuse detection|submitted too quickly|temporarily blocked from content creation)' \
                  <<<"$response_content" || {
                    grep -qi 'HTTP 429' <<<"$response_content" && [ "${remaining:-unknown}" != 0 ]
                  }; then
                kind=secondary
                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  wait_s="$retry_after"
                else
                  wait_s=$((60 * (2 ** (attempt - 1))))
                  [ "$wait_s" -gt 600 ] && wait_s=600
                fi
              elif [ "${remaining:-unknown}" = 0 ] ||
                grep -qiE '(API rate limit exceeded|primary rate limit)' <<<"$response_content"; then
                kind=primary
                if ! [[ "$reset" =~ ^[0-9]+$ ]]; then
                  reset=$(gh api rate_limit --jq '.rate.reset' 2>/dev/null || echo 0)
                fi
                now=$(date +%s)
                wait_s=$((reset - now + 5))
                [ "$wait_s" -gt 0 ] || wait_s=60
              fi
              if [ -n "$kind" ]; then
                if [ "$attempt" -ge "$max" ] || [ $((total_wait + wait_s)) -gt "$wait_budget" ]; then
                  echo "[DEFER] $kind GitHub limit requires ${wait_s}s; retry budget exhausted" >&2
                  rm -f "$err_file" "$out_file"
                  return 84
                fi
                now=$(date +%s)
                next_at=$(python3 -c 'import datetime,sys; print(datetime.datetime.fromtimestamp(int(sys.argv[1]), datetime.timezone.utc).isoformat().replace("+00:00", "Z"))' "$((now + wait_s))")
                echo "[WAIT] $kind GitHub limit on attempt ${attempt}/${max}; waiting ${wait_s}s; next attempt ${next_at}" >&2
                sleep "$wait_s"
                total_wait=$((total_wait + wait_s))
                attempt=$((attempt + 1))
                continue
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "[ERROR] Failed after ${max} attempts: $*" >&2
                rm -f "$err_file" "$out_file"
                return 1
              fi
              echo "[WARN] Attempt ${attempt}/${max} failed -- retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
              [ "$delay" -gt "$max_delay" ] && delay="$max_delay"
            done
          }

          current_json_request() {
            local json="$1"
            shift
            require_current_source_main
            require_current_downstream_main
            local endpoint="$1" method=POST response_file error_file rc
            shift
            while [ "$#" -gt 0 ]; do
              case "$1" in
                --method) method="$2"; shift 2 ;;
                *) echo "[ERROR] Unsupported JSON request option: $1" >&2; return 2 ;;
              esac
            done
            response_file=$(mktemp)
            error_file=$(mktemp)
            set +e
            printf '%s' "$json" | gh api "$endpoint" --method "$method" --input - --include \
              >"$response_file" 2>"$error_file"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              if head -n 1 "$response_file" | grep -q '^HTTP/'; then
                awk 'body {print} /^\r?$/ {body=1}' "$response_file"
              else
                cat "$response_file"
              fi
              cat "$error_file" >&2
              rm -f "$response_file" "$error_file"
              return 0
            fi
            cat "$response_file" "$error_file" >&2
            rm -f "$response_file" "$error_file"
            return 1
          }

          retry_current_json() {
            local max="$1"
            shift
            local json="$1"
            shift
            retry "$max" current_json_request "$json" "$@"
          }

          api_value_or_404() {
            local endpoint="$1" jq_filter="$2"
            local out_file err_file rc value
            out_file=$(mktemp)
            err_file=$(mktemp)
            set +e
            gh api "$endpoint" --jq "$jq_filter" >"$out_file" 2>"$err_file"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              value=$(cat "$out_file")
              rm -f "$out_file" "$err_file"
              if [ -z "$value" ]; then
                echo "[ERROR] GitHub API returned an empty value for ${endpoint}" >&2
                return 1
              fi
              printf '%s' "$value"
              return 0
            fi
            if grep -qE '\(HTTP 404\)$' "$err_file"; then
              rm -f "$out_file" "$err_file"
              return 44
            fi
            echo "[ERROR] GitHub API read failed closed for ${endpoint}" >&2
            sed -E 's/(Request-Id:).*/\1 [redacted]/I' "$err_file" >&2
            rm -f "$out_file" "$err_file"
            return 1
          }

          # --- Exact-receipt fetch helper (canonical: tests/fixtures/fetch-governed.sh) ---
          fetch_governed() {
            local key="$1" fallback="$2" api_file decoded_file err_file
            local receipt_sha receipt_size decoded_sha decoded_size

            if ! printf '%s' "${expected_source_sha:-}" | grep -qE '^[0-9a-f]{40}$'; then
              echo "[ERROR] Could not resolve an exact docs-control source commit" >&2
              return 1
            fi
            if [[ "$fallback" == *[?#]* ]]; then
              echo "[ERROR] Governed API path already contains a query or fragment for ${key}" >&2
              return 1
            fi

            api_file=$(mktemp)
            decoded_file=$(mktemp)
            err_file=$(mktemp)
            if ! retry 3 gh api "${fallback}?ref=${expected_source_sha}" >"$api_file" 2>"$err_file"; then
              echo "[ERROR] gh api failed for ${key}:" >&2
              cat "$err_file" >&2
              rm -f "$api_file" "$decoded_file" "$err_file"
              return 1
            fi
            if ! jq -e '
              .type == "file" and .encoding == "base64" and
              (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
              (.size | type == "number" and floor == . and . >= 0) and
              (.content | type == "string") and
              (.size == 0 or (.content | length > 0))
            ' "$api_file" >/dev/null 2>&1; then
              echo "[ERROR] gh api returned an invalid content envelope for ${key}" >&2
              rm -f "$api_file" "$decoded_file" "$err_file"
              return 1
            fi
            if ! jq -r '.content' "$api_file" | tr -d '\n' | base64 -d >"$decoded_file"; then
              echo "[ERROR] gh api returned invalid base64 content for ${key}" >&2
              rm -f "$api_file" "$decoded_file" "$err_file"
              return 1
            fi
            receipt_sha=$(jq -r '.sha' "$api_file")
            receipt_size=$(jq -r '.size' "$api_file")
            decoded_sha=$(git hash-object "$decoded_file")
            decoded_size=$(wc -c <"$decoded_file" | tr -d ' ')
            if [ "$decoded_sha" != "$receipt_sha" ] || [ "$decoded_size" != "$receipt_size" ]; then
              echo "[ERROR] Decoded bytes do not match the content receipt for ${key}" >&2
              rm -f "$api_file" "$decoded_file" "$err_file"
              return 1
            fi
            cat "$decoded_file"
            rm -f "$api_file" "$decoded_file" "$err_file"
          }

          cache_managed_content() {
            local label="$1" api_path="$2" expected_sha="$3" expected_size="$4" output_file="$5"
            local temp_file canonical_sha canonical_size
            temp_file=$(mktemp)
            if ! fetch_governed "$label" "$api_path" >"$temp_file"; then
              echo "[ERROR] Could not fetch required canonical content: ${api_path}" >&2
              rm -f "$temp_file"
              return 1
            fi
            canonical_sha=$(git hash-object "$temp_file")
            canonical_size=$(wc -c <"$temp_file" | tr -d ' ')
            if [ "$canonical_sha" != "$expected_sha" ] || [ "$canonical_size" != "$expected_size" ]; then
              echo "[ERROR] Canonical blob mismatch for ${api_path}" >&2
              rm -f "$temp_file"
              return 1
            fi
            mv "$temp_file" "$output_file"
          }

          require_sha() {
            local label="$1" value="$2"
            if ! printf '%s' "$value" | grep -qE '^[0-9a-f]{40}$'; then
              echo "[ERROR] ${label} is not a commit SHA" >&2
              return 1
            fi
          }

          ensure_current_source_main() {
            local current_source_sha source_status
            if ! current_source_sha=$(retry 3 gh api \
              "repos/${GITHUB_REPOSITORY_OWNER}/docs-control/commits/main" --jq '.sha'); then
              echo "[ERROR] Could not resolve protected docs-control main" >&2
              return 1
            fi
            require_sha "protected docs-control main" "$current_source_sha" || return 1
            if [ "$expected_source_sha" = "$current_source_sha" ]; then
              return 0
            fi
            if ! source_status=$(retry 3 gh api \
              "repos/${GITHUB_REPOSITORY_OWNER}/docs-control/compare/${expected_source_sha}...${current_source_sha}" \
              --jq '.status'); then
              echo "[ERROR] Could not prove the source receipt is on protected docs-control main" >&2
              return 1
            fi
            if [ "$source_status" != "ahead" ]; then
              echo "[ERROR] Source receipt is not an approved protected-main commit" >&2
              return 1
            fi
            if ! GH_TOKEN="$REPO_SETTINGS_TOKEN" gh workflow run \
              enforce-repo-settings.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f source_sha="$current_source_sha"; then
              echo "[ERROR] Could not enqueue the current protected-main receipt" >&2
              return 1
            fi
            echo "[DEFER] Docs-control protected main advanced; enqueued its exact receipt"
            return 78
          }

          require_current_source_main() {
            local receipt_rc=0
            ensure_current_source_main || receipt_rc=$?
            case "$receipt_rc" in
              0) return 0 ;;
              78) exit 0 ;;
              *) exit 1 ;;
            esac
          }

          ensure_current_downstream_main() {
            local current_downstream_sha downstream_status
            if ! current_downstream_sha=$(retry 3 gh api \
              "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha'); then
              echo "[ERROR] Could not resolve downstream protected main" >&2
              return 1
            fi
            require_sha "downstream protected main" "$current_downstream_sha" || return 1
            if [ "$expected_downstream_sha" = "$current_downstream_sha" ]; then
              return 0
            fi
            if ! downstream_status=$(retry 3 gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${expected_downstream_sha}...${current_downstream_sha}" \
              --jq '.status'); then
              echo "[ERROR] Could not prove the downstream receipt is on protected main" >&2
              return 1
            fi
            if [ "$downstream_status" != "ahead" ]; then
              echo "[ERROR] Downstream receipt is not an approved protected-main commit" >&2
              return 1
            fi
            if ! GH_TOKEN="$REPO_SETTINGS_TOKEN" gh workflow run \
              enforce-repo-settings.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f source_sha="$expected_source_sha"; then
              echo "[ERROR] Could not enqueue current downstream protected main" >&2
              return 1
            fi
            echo "[DEFER] Downstream protected main advanced; enqueued the exact current caller"
            return 78
          }

          require_current_downstream_main() {
            local receipt_rc=0
            ensure_current_downstream_main || receipt_rc=$?
            case "$receipt_rc" in
              0) return 0 ;;
              78) exit 0 ;;
              *) exit 1 ;;
            esac
          }

          expected_source_sha="${SOURCE_SHA:-}"
          expected_downstream_sha="${DOWNSTREAM_SHA:-}"

          if ! printf '%s' "$expected_source_sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "[ERROR] Could not resolve an exact docs-control source commit" >&2
            exit 1
          fi
          require_current_source_main
          echo "[OK] Governed reads bound to source ${expected_source_sha:0:8}"

          require_sha "expected downstream receipt" "$expected_downstream_sha"
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          require_sha "checked-out downstream receipt" "$CHECKED_OUT_SHA"
          if [ "$CHECKED_OUT_SHA" != "$expected_downstream_sha" ]; then
            echo "[ERROR] Downstream checkout does not match its exact receipt" >&2
            exit 1
          fi
          require_current_downstream_main
          echo "[OK] Downstream reads bound to protected main ${expected_downstream_sha:0:8}"

          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          CONFIG_REPO="${GITHUB_REPOSITORY_OWNER}/docs-control"
          CONFIG_PATH=".github/config/repo-settings.json"
          if ! printf '%s\n%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" |
            awk '/^[1-9][0-9]*$/ { valid++ } END { exit valid != 2 }'; then
            echo "[ERROR] Workflow run ownership identifiers are invalid" >&2
            exit 1
          fi
          SYNC_BRANCH="governance/sync-managed-files-${expected_source_sha:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SYNC_WORK_DIR=$(mktemp -d "${RUNNER_TEMP:?}/sync-managed-files.XXXXXX")
          mkdir -p "${SYNC_WORK_DIR}/drift-content"

          read_sync_prs() {
            local destination="$1"
            if ! gh api "repos/${OWNER}/${REPO}/pulls?state=open&per_page=100" \
              --paginate --slurp >"$destination"; then
              echo "[ERROR] Could not inventory open sync PRs" >&2
              return 1
            fi
            if ! jq -e --arg prefix 'governance/sync-managed-files' '
              type == "array" and all(.[]; type == "array") and
              all(.[][] | select(.head.ref | startswith($prefix));
                (.number | type == "number" and floor == . and . >= 1) and
                (.head.ref | type == "string" and
                  test("^governance/sync-managed-files(-[0-9a-f]{12}-[1-9][0-9]*-[1-9][0-9]*)?$")) and
                (.head.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                (.head.repo.full_name | type == "string") and
                (.base.ref | type == "string"))
            ' "$destination" >/dev/null; then
              echo "[ERROR] Open sync PR inventory is invalid" >&2
              return 1
            fi
          }

          select_owned_sync_pr() {
            local inventory="$1" count row pr_num pr_repo pr_base pr_branch pr_head
            count=$(jq '
              [.[][] | select(.head.ref | startswith("governance/sync-managed-files"))] | length
            ' "$inventory")
            case "$count" in
              0) return 0 ;;
              1)
                row=$(jq -r '
                  .[][] | select(.head.ref | startswith("governance/sync-managed-files")) |
                  [.number, .head.repo.full_name, .base.ref, .head.ref, .head.sha] | @tsv
                ' "$inventory")
                IFS=$'\t' read -r pr_num pr_repo pr_base pr_branch pr_head <<<"$row"
                if [ "$pr_repo" != "${OWNER}/${REPO}" ] || [ "$pr_base" != "main" ]; then
                  echo "[ERROR] Open sync PR is not owned by protected ${OWNER}/${REPO} main" >&2
                  return 1
                fi
                printf '%s\t%s\t%s\n' "$pr_num" "$pr_branch" "$pr_head"
                ;;
              *)
                echo "[ERROR] Multiple open sync PRs claim governance/sync-managed-files" >&2
                return 1
                ;;
            esac
          }

          assert_sync_pr_head() {
            local pr_num="$1" expected_branch="$2" expected_sha="$3" response
            if ! printf '%s' "$pr_num" | grep -qE '^[1-9][0-9]*$'; then
              echo "[ERROR] Invalid sync PR number" >&2
              return 1
            fi
            if ! printf '%s' "$expected_branch" |
              grep -qE '^governance/sync-managed-files(-[0-9a-f]{12}-[1-9][0-9]*-[1-9][0-9]*)?$'; then
              echo "[ERROR] Invalid sync PR branch" >&2
              return 1
            fi
            require_sha "expected sync PR head" "$expected_sha" || return 1
            response=$(gh api "repos/${OWNER}/${REPO}/pulls/${pr_num}")
            if ! echo "$response" | jq -e \
              --arg repo "${OWNER}/${REPO}" \
              --arg branch "$expected_branch" \
              --arg sha "$expected_sha" '
                .state == "open" and
                .head.repo.full_name == $repo and
                .head.ref == $branch and
                .head.sha == $sha and
                .base.ref == "main"
              ' >/dev/null; then
              echo "[ERROR] Sync PR ownership or exact head changed before auto-merge" >&2
              return 1
            fi
          }

          managed_cache_path() {
            local dest_file="$1" cache_key
            cache_key=$(printf '%s' "$dest_file" | git hash-object --stdin)
            require_sha "managed cache key" "$cache_key" || return 1
            printf '%s/drift-content/%s' "$SYNC_WORK_DIR" "$cache_key"
          }

          validate_managed_routing() {
            jq -e '
              def safe_path:
                type == "string" and
                length > 0 and
                test("^[A-Za-z0-9._/-]+$") and
                (startswith("/") | not) and
                (split("/") | all(.[]; length > 0 and . != "." and . != ".."));
              type == "object" and
              (.source_repo | type == "string" and length > 0) and
              (.files | type == "array" and length > 0) and
              all(.files[];
                (.src | safe_path) and
                (.dest | safe_path) and
                ((has("only_repos") | not) or
                  (.only_repos | type == "array" and
                    all(.[]; type == "string" and test("^[A-Za-z0-9_.-]+$")) and
                    length == (unique | length)))) and
              ([.files[].dest] | length == (unique | length)) and
              (.absent_files | type == "array" and length > 0 and
                all(.[]; safe_path) and
                length == (unique | length)) and
              (([.files[].dest] + .absent_files) |
                length == (unique | length)) and
              (.skip_files | type == "object") and
              all(.skip_files | to_entries[];
                (.key | test("^[A-Za-z0-9_.-]+$")) and
                (.value | type == "array" and
                  all(.[]; safe_path) and
                  length == (unique | length)))
            ' >/dev/null
          }

          validate_docs_sites() {
            jq -e --arg owner "$OWNER" '
              type == "array" and
              all(.[];
                (.label | type == "string" and length > 0) and
                (.description | type == "string" and length > 0) and
                (.url | type == "string" and
                  test("^https://" + $owner + "\\.github\\.io/[A-Za-z0-9_.-]+/llms-full\\.txt$")) and
                ((has("badges") | not) or
                  (.badges | type == "array" and
                    all(.[]; (.name | type == "string" and length > 0) and
                      (.workflow | type == "string" and test("^[A-Za-z0-9_.-]+\\.ya?ml$"))))) and
                ((has("readme_english_only") | not) or
                  (.readme_english_only | type == "boolean")) and
                ((has("readme_content") | not) or
                  (.readme_content | type == "string"))) and
              ([.[].url] | length == (unique | length))
            ' >/dev/null
          }

          readme_english_only() {
            jq -er '
              if has("readme_english_only") | not then "false"
              elif (.readme_english_only | type) == "boolean"
              then (.readme_english_only | tostring)
              else error("readme_english_only must be a boolean")
              end
            '
          }

          replace_readme_marker() {
            local marker="$1" insertion_file="$2" target_file="$3"
            local marker_count next_file

            marker_count=$(grep -Fxc -- "$marker" "$target_file" || true)
            if [ "$marker_count" -ne 1 ]; then
              echo "[ERROR] README marker ${marker} must occur exactly once; found ${marker_count}" >&2
              return 1
            fi
            if [ ! -f "$insertion_file" ]; then
              echo "[ERROR] README marker content is unavailable for ${marker}" >&2
              return 1
            fi

            next_file=$(mktemp "${target_file}.marker.XXXXXX")
            if ! awk -v marker="$marker" -v insertion="$insertion_file" '
              $0 == marker {
                while ((read_status = (getline line < insertion)) > 0) print line
                if (read_status < 0) exit 2
                close(insertion)
                next
              }
              { print }
            ' "$target_file" >"$next_file"; then
              rm -f "$next_file"
              echo "[ERROR] Could not replace README marker ${marker}" >&2
              return 1
            fi
            mv "$next_file" "$target_file"
          }

          validate_generated_readme() {
            local readme_file="$1" title="$2" description="$3" docs_url="$4"
            local owner="$5" repo="$6" first_line h1_count expected_docs

            if grep -qE '__[A-Z][A-Z0-9_]*__' "$readme_file"; then
              echo "[ERROR] Generated README contains an unresolved placeholder" >&2
              return 1
            fi
            IFS= read -r first_line <"$readme_file" || {
              echo "[ERROR] Generated README is empty" >&2
              return 1
            }
            h1_count=$(grep -c '^# ' "$readme_file" || true)
            if [ "$first_line" != "# ${title}" ] || [ "$h1_count" -ne 1 ]; then
              echo "[ERROR] Generated README title does not match canonical metadata" >&2
              return 1
            fi
            if ! grep -Fqx -- "$description" "$readme_file"; then
              echo "[ERROR] Generated README description does not match canonical metadata" >&2
              return 1
            fi
            expected_docs="Full documentation is available at __[${docs_url}](${docs_url})__."
            if ! grep -Fqx -- "$expected_docs" "$readme_file"; then
              echo "[ERROR] Generated README documentation URL does not match canonical metadata" >&2
              return 1
            fi
            if ! grep -Fq -- "https://img.shields.io/github/license/${owner}/${repo}" "$readme_file"; then
              echo "[ERROR] Generated README repository identity does not match the caller" >&2
              return 1
            fi
          }

          select_owned_stale_issues() {
            jq -r '
              if type != "array" or
                any(.[]; type != "array") or
                any(.[][]; (.number | type != "number" or floor != . or . < 1) or
                  (.title | type != "string") or (.body | type != "string"))
              then error("invalid issue inventory")
              else
                .[][] |
                select(.title == "chore: sync managed files from governance template") |
                select(.body | contains("This issue was created automatically by the governance enforcement workflow.")) |
                .number
              end
            '
          }

          create_or_find_sync_issue() {
            local title="$1" body="$2" marker="$3" inventory count payload response
            require_current_source_main
            require_current_downstream_main
            inventory=$(gh api "repos/${OWNER}/${REPO}/issues?state=open&per_page=100")
            count=$(jq --arg marker "$marker" '[.[] | select(.pull_request == null) |
              select(.body != null and (.body | contains($marker)))] | length' <<<"$inventory")
            if [ "$count" -eq 1 ]; then
              jq -r --arg marker "$marker" '.[] | select(.pull_request == null) |
                select(.body != null and (.body | contains($marker))) | .number' <<<"$inventory"
              return 0
            fi
            [ "$count" -eq 0 ] || {
              echo "[ERROR] Multiple issues claim the exact managed-file receipt" >&2
              return 1
            }
            payload=$(jq -n --arg title "$title" --arg body "$body" '{title:$title,body:$body}')
            response=$(current_json_request "$payload" \
              "repos/${OWNER}/${REPO}/issues" --method POST)
            jq -er '.number | select(type == "number" and floor == . and . >= 1)' <<<"$response"
          }

          create_or_find_sync_pr() {
            local title="$1" body="$2" inventory count payload response
            require_current_source_main
            require_current_downstream_main
            inventory=$(gh api \
              "repos/${OWNER}/${REPO}/pulls?state=open&base=main&head=${OWNER}:${SYNC_BRANCH}&per_page=100")
            count=$(jq --arg repo "${OWNER}/${REPO}" --arg branch "$SYNC_BRANCH" \
              --arg sha "$LAST_COMMIT_SHA" '[.[] | select(.head.repo.full_name == $repo and
                .head.ref == $branch and .head.sha == $sha and .base.ref == "main")] | length' \
              <<<"$inventory")
            if [ "$count" -eq 1 ]; then
              jq -r --arg repo "${OWNER}/${REPO}" --arg branch "$SYNC_BRANCH" \
                --arg sha "$LAST_COMMIT_SHA" '.[] | select(.head.repo.full_name == $repo and
                  .head.ref == $branch and .head.sha == $sha and .base.ref == "main") | .number' \
                <<<"$inventory"
              return 0
            fi
            [ "$count" -eq 0 ] || {
              echo "[ERROR] Multiple PRs claim the exact managed-file head" >&2
              return 1
            }
            payload=$(jq -n --arg title "$title" --arg body "$body" --arg head "$SYNC_BRANCH" \
              '{title:$title,body:$body,head:$head,base:"main"}')
            response=$(current_json_request "$payload" \
              "repos/${OWNER}/${REPO}/pulls" --method POST)
            jq -er '.number | select(type == "number" and floor == . and . >= 1)' <<<"$response"
          }

          # --- Helper: merge only while both receipts remain current --------
          auto_merge() {
            local pr_num="$1"
            local repo_slug="$2"
            local expected_sha="$3"
            require_sha "expected auto-merge head" "$expected_sha" || return 1

            echo "[INFO] Waiting to merge PR #${pr_num} while exact receipts remain current..."
            require_current_source_main
            require_current_downstream_main
            local elapsed=0
            # api-specs-enriched's required pytest context is measured at
            # 13:47. Allow a full hour so a healthy slow fleet check converges
            # instead of timing out, replacing its PR, and restarting CI.
            local max_wait=3600
            local poll_interval=60

            while [ "$elapsed" -lt "$max_wait" ]; do
              sleep "$poll_interval"
              elapsed=$((elapsed + poll_interval))
              require_current_source_main
              require_current_downstream_main

              BUCKET=$(gh pr checks "${pr_num}" --repo "${repo_slug}" \
                --json bucket --jq '[.[].bucket] | unique |
                  if . == ["pass"] then "pass"
                  elif any(. == "fail") then "fail"
                  else "pending" end' 2>/dev/null) || BUCKET="pending"

              if [ "$BUCKET" = "pass" ]; then
                retry 3 assert_sync_pr_head "$pr_num" "$SYNC_BRANCH" "$expected_sha"
                require_current_source_main
                require_current_downstream_main
                MERGE_JSON=$(jq -n --arg sha "$expected_sha" \
                  '{sha:$sha,merge_method:"squash"}')
                if MERGE_RESPONSE=$(retry_current_json 3 "$MERGE_JSON" \
                  "repos/${repo_slug}/pulls/${pr_num}/merge" --method PUT) &&
                  jq -e '.merged == true' <<<"$MERGE_RESPONSE" >/dev/null; then
                  echo "[OK] Merged sync PR #${pr_num}"
                  return 0
                fi
                echo "[ERROR] Failed to merge exact sync PR #${pr_num}" >&2
                return 1
              elif [ "$BUCKET" = "fail" ]; then
                echo "[WARN] CI checks failed on PR #${pr_num} -- skipping merge"
                return 1
              fi
            done

            echo "[ERROR] Timed out waiting for CI on exact sync PR #${pr_num}" >&2
            return 1
          }

          # --- Helper: file-backed Git tree payloads ---------------------------
          normalize_tree_content() {
            local source_file="$1"
            local normalized_file="$2"

            # Command substitution strips every trailing newline from fetched
            # content, while generated files already carry one. Normalize both
            # sources to exactly one without ever placing the content in argv.
            perl -0pe 's/\n*\z/\n/' "$source_file" >"$normalized_file"
          }

          append_tree_item() {
            local tree_items_file="$1"
            local dest_file="$2"
            local file_mode="$3"
            local content_file="$4"
            local next_items_file
            if ! printf '%s' "$file_mode" | grep -qE '^100(644|755)$'; then
              echo "[ERROR] Invalid Git mode for ${dest_file}: ${file_mode}" >&2
              return 1
            fi
            next_items_file=$(mktemp "${tree_items_file}.next.XXXXXX")

            # Both the existing tree and managed content are unbounded payloads.
            # Read them from files so exec never encounters ARG_MAX or Linux's
            # smaller per-argument MAX_ARG_STRLEN limit.
            if ! jq \
              --arg path "$dest_file" \
              --arg mode "$file_mode" \
              --rawfile content "$content_file" \
              '. + [{"path": $path, "mode": $mode, "type": "blob", "content": $content}]' \
              "$tree_items_file" >"$next_items_file"; then
              rm -f "$next_items_file"
              return 1
            fi
            mv "$next_items_file" "$tree_items_file"
          }

          append_tree_deletion() {
            local tree_items_file="$1"
            local dest_file="$2"
            local next_items_file
            next_items_file=$(mktemp "${tree_items_file}.next.XXXXXX")

            if ! jq \
              --arg path "$dest_file" \
              '. + [{"path": $path, "mode": "100644", "type": "blob", "sha": null}]' \
              "$tree_items_file" >"$next_items_file"; then
              rm -f "$next_items_file"
              return 1
            fi
            mv "$next_items_file" "$tree_items_file"
          }

          write_tree_request() {
            local base_tree="$1"
            local tree_items_file="$2"
            local tree_json_file="$3"

            jq -n \
              --arg base "$base_tree" \
              --slurpfile tree "$tree_items_file" \
              '{"base_tree": $base, "tree": $tree[0]}' >"$tree_json_file"
          }

          # --- Helper: atomic commit via Git Trees API -------------------------
          commit_tree() {
            local branch="$1"
            local commit_msg="$2"
            local repo_slug="${OWNER}/${REPO}"

            local ref_sha
            ref_sha=$(retry 3 gh api "repos/${repo_slug}/git/ref/heads/${branch}" --jq '.object.sha')
            require_sha "ref_sha for ${branch}" "$ref_sha" || return 1

            local base_tree
            base_tree=$(retry 3 gh api "repos/${repo_slug}/git/commits/${ref_sha}" --jq '.tree.sha')
            require_sha "base_tree for ${branch}" "$base_tree" || return 1

            local payload_dir tree_items_file
            payload_dir=$(mktemp -d)
            tree_items_file="${payload_dir}/tree-items.json"
            printf '[]\n' >"$tree_items_file"

            local item_index=0
            for dest_file in $(printf '%b' "$DRIFT_FILES" | sed '/^$/d'); do
              local source_file=""
              local content_file
              local file_mode

              if echo "$ABSENT_LIST" | jq -e --arg dest "$dest_file" \
                'index($dest) != null' >/dev/null; then
                append_tree_deletion "$tree_items_file" "$dest_file"
                continue
              elif [ "$dest_file" = ".github/dependabot.yml" ] && [ "$DEPENDABOT_DRIFT" = true ]; then
                source_file="${SYNC_WORK_DIR}/generated-dependabot.yml"
                item_index=$((item_index + 1))
                content_file="${payload_dir}/content-${item_index}"
                normalize_tree_content "$source_file" "$content_file"
                file_mode=100644
              elif [ "$dest_file" = "README.md" ] && [ "$README_DRIFT" = true ]; then
                source_file="${SYNC_WORK_DIR}/generated-readme.md"
                item_index=$((item_index + 1))
                content_file="${payload_dir}/content-${item_index}"
                normalize_tree_content "$source_file" "$content_file"
                file_mode=100644
              elif source_file=$(managed_cache_path "$dest_file") &&
                [ -f "$source_file" ]; then
                content_file="$source_file"
                if ! file_mode=$(jq -er --arg dest "$dest_file" \
                  '.files[$dest].mode | select(test("^100(644|755)$"))' \
                  "$MANIFEST_RECEIPT_FILE"); then
                  echo "[ERROR] Missing canonical Git mode for ${dest_file}" >&2
                  rm -r "$payload_dir"
                  return 1
                fi
              else
                echo "[ERROR] No cached content for required drift path ${dest_file}" >&2
                rm -r "$payload_dir"
                return 1
              fi

              append_tree_item "$tree_items_file" "$dest_file" "$file_mode" "$content_file"
            done

            local item_count
            item_count=$(jq 'length' "$tree_items_file")
            if [ "$item_count" -eq 0 ]; then
              echo "[SKIP] No files to commit"
              rm -r "$payload_dir"
              return 0
            fi

            local tree_json_file
            tree_json_file="${payload_dir}/tree.json"
            write_tree_request "$base_tree" "$tree_items_file" "$tree_json_file"
            local new_tree_sha
            new_tree_sha=$(retry 3 gh api "repos/${repo_slug}/git/trees" \
              --method POST --input "$tree_json_file" --jq '.sha')
            require_sha "new_tree_sha for ${branch}" "$new_tree_sha" || return 1

            local commit_json
            commit_json=$(jq -n --arg msg "$commit_msg" --arg tree "$new_tree_sha" --arg parent "$ref_sha" \
              '{"message": $msg, "tree": $tree, "parents": [$parent]}')
            local new_commit_sha
            new_commit_sha=$(echo "$commit_json" | retry 3 gh api "repos/${repo_slug}/git/commits" --method POST --input - --jq '.sha')
            require_sha "new_commit_sha for ${branch}" "$new_commit_sha" || return 1

            local ref_update
            ref_update=$(jq -n --arg sha "$new_commit_sha" '{"sha": $sha}')
            require_current_source_main
            require_current_downstream_main
            retry_current_json 3 "$ref_update" "repos/${repo_slug}/git/refs/heads/${branch}" --method PATCH >/dev/null

            rm -r "$payload_dir"
            LAST_COMMIT_SHA="$new_commit_sha"
            echo "[OK] Atomic commit ${new_commit_sha:0:8} (${item_count} files)"
          }

          # --- Phase 1: Validate ---------------------------------------------
          echo "=== Phase 1: Validate ==="

          if ! command -v jq &>/dev/null; then
            echo "[ERROR] jq is not installed" >&2; exit 1
          fi
          if ! command -v gh &>/dev/null; then
            echo "[ERROR] gh CLI is not installed" >&2; exit 1
          fi
          if ! gh auth status &>/dev/null; then
            echo "[ERROR] gh is not authenticated" >&2; exit 1
          fi

          # Fetch central config from docs-control
          echo "[INFO] Fetching config from ${CONFIG_REPO}/${CONFIG_PATH}..."
          CONFIG=$(fetch_governed "$(basename "$CONFIG_PATH")" "repos/${CONFIG_REPO}/contents/${CONFIG_PATH}")
          if ! echo "$CONFIG" | jq empty 2>/dev/null; then
            echo "[ERROR] Failed to fetch or parse config from ${CONFIG_REPO}" >&2; exit 1
          fi
          CONFIG_RECEIPT_FILE=$(mktemp)
          printf '%s' "$CONFIG" >"$CONFIG_RECEIPT_FILE"
          echo "[OK] Fetched config from ${CONFIG_REPO}"

          echo "[OK] Config validated for ${OWNER}/${REPO}"

          # --- Phase 2: Sync Managed Files -------------------------------------
          echo ""
          echo "=== Phase 2: Sync Managed Files ==="

          MANAGED_FILES=$(echo "$CONFIG" | jq -c '.managed_files // empty')
          SYNC_PR_CREATED=false
          EXISTING_PR=""
          SOURCE_REPO=""

          if [ -z "$MANAGED_FILES" ]; then
            echo "[SKIP] No managed_files in config"
          else
            if ! echo "$MANAGED_FILES" | validate_managed_routing; then
              echo "[ERROR] Managed-file routing schema is invalid" >&2
              exit 1
            fi
            SOURCE_REPO=$(echo "$MANAGED_FILES" | jq -r '.source_repo')
            if [ "$SOURCE_REPO" != "$CONFIG_REPO" ]; then
              echo "[ERROR] Managed source must be the exact governance repository" >&2
              exit 1
            fi

            # Guard: skip if running in the source repo itself
            if [ "${OWNER}/${REPO}" = "$SOURCE_REPO" ]; then
              echo "[SKIP] Running in source repo -- skipping managed file sync"
            else
              DRIFT_FILES=""
              DRIFT_COUNT=0

              # Per-repo opt-out list (files this repo maintains independently)
              SKIP_LIST=$(echo "$MANAGED_FILES" | jq -c --arg repo "$REPO" '.skip_files[$repo] // []')
              ABSENT_LIST=$(echo "$MANAGED_FILES" | jq -c '.absent_files')

              # The manifest is required receipt evidence. Missing or malformed
              # entries fail closed; no mutable per-file fallback is admissible.
              MANIFEST_PATH=".github/config/managed-files-manifest.json"
              MANIFEST_RECEIPT_FILE=$(mktemp)
              if ! fetch_governed \
                "managed-files-manifest.json" \
                "repos/${SOURCE_REPO}/contents/${MANIFEST_PATH}" \
                >"$MANIFEST_RECEIPT_FILE"; then
                echo "[ERROR] Required managed-files manifest is unavailable" >&2
                exit 1
              fi
              if ! jq -e '
                type == "object" and
                (.source_commit | type == "string" and test("^[0-9a-f]{40}$")) and
                (.files | type == "object" and length > 0) and
                all(.files | to_entries[];
                  .key == .value.dest and
                  (.value.src | type == "string" and length > 0) and
                  (.value.dest | type == "string" and length > 0) and
                  (.value.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                  (.value.size | type == "number" and floor == . and . >= 0) and
                  (.value.mode | type == "string" and test("^100(644|755)$")))
              ' "$MANIFEST_RECEIPT_FILE" >/dev/null; then
                echo "[ERROR] Required managed-files manifest is malformed" >&2
                exit 1
              fi
              MANIFEST_COMMIT=$(jq -r '.source_commit' "$MANIFEST_RECEIPT_FILE")
              MANIFEST_STATUS=identical
              if [ "$MANIFEST_COMMIT" != "$expected_source_sha" ]; then
                if ! MANIFEST_STATUS=$(retry 3 gh api \
                  "repos/${SOURCE_REPO}/compare/${MANIFEST_COMMIT}...${expected_source_sha}" \
                  --jq '.status'); then
                  echo "[ERROR] Could not prove managed manifest provenance" >&2
                  exit 1
                fi
              fi
              if [ "$MANIFEST_STATUS" != "identical" ] && [ "$MANIFEST_STATUS" != "ahead" ]; then
                echo "[ERROR] Managed manifest source is not on protected-main history" >&2
                exit 1
              fi

              SOURCE_TREE_FILE=$(mktemp)
              MANIFEST_TREE_FILE=$(mktemp)
              if ! retry 3 gh api \
                "repos/${SOURCE_REPO}/git/trees/${expected_source_sha}?recursive=1" \
                >"$SOURCE_TREE_FILE" ||
                ! retry 3 gh api \
                  "repos/${SOURCE_REPO}/git/trees/${MANIFEST_COMMIT}?recursive=1" \
                  >"$MANIFEST_TREE_FILE"; then
                echo "[ERROR] Could not resolve exact managed source trees" >&2
                exit 1
              fi
              if ! jq -e \
                --slurpfile config "$CONFIG_RECEIPT_FILE" \
                --slurpfile source_tree "$SOURCE_TREE_FILE" \
                --slurpfile manifest_tree "$MANIFEST_TREE_FILE" '
                  . as $manifest |
                  ($config[0].managed_files.files) as $configured |
                  ($source_tree[0]) as $current |
                  ($manifest_tree[0]) as $provenance |
                  ($configured | type == "array" and length > 0) and
                  (($configured | map(.dest) | length) ==
                    ($configured | map(.dest) | unique | length)) and
                  (($manifest.files | keys | sort) ==
                    ($configured | map(.dest) | sort)) and
                  ($current.truncated == false) and
                  ($current.tree | type == "array") and
                  ($provenance.truncated == false) and
                  ($provenance.tree | type == "array") and
                  all($configured[];
                    . as $file |
                    ($manifest.files[$file.dest]) as $receipt |
                    ([$current.tree[] | select(.path == $file.src)]) as $current_entries |
                    ([$provenance.tree[] | select(.path == $file.src)]) as $provenance_entries |
                    ($receipt | type == "object") and
                    ($receipt.src == $file.src) and
                    ($receipt.dest == $file.dest) and
                    ($current_entries | length == 1) and
                    ($provenance_entries | length == 1) and
                    all([$current_entries[0], $provenance_entries[0]][];
                      .type == "blob" and
                      .sha == $receipt.sha and
                      .size == $receipt.size and
                      .mode == $receipt.mode))
                ' "$MANIFEST_RECEIPT_FILE" >/dev/null; then
                echo "[ERROR] Exact source tree does not match the managed manifest" >&2
                exit 1
              fi
              echo "[INFO] Using exact manifest from ${SOURCE_REPO}@${MANIFEST_COMMIT} for drift detection"

              for file_obj in $(echo "$MANAGED_FILES" | jq -c '.files[]'); do
                src=$(echo "$file_obj" | jq -r '.src')
                dest=$(echo "$file_obj" | jq -r '.dest')

                # Honor per-repo skip_files opt-out
                if echo "$SKIP_LIST" | jq -e --arg d "$dest" 'index($d) != null' >/dev/null; then
                  echo "[SKIP] ${dest} -- opted out by ${REPO}"
                  continue
                fi

                # Honor per-file opt-in allowlist. A managed file may carry an
                # "only_repos" array; if present it is synced ONLY to those repos.
                # Files without only_repos sync to all.
                ONLY_REPOS=$(echo "$file_obj" | jq -c '.only_repos // empty')
                if [ -n "$ONLY_REPOS" ] && ! echo "$ONLY_REPOS" | jq -e --arg r "$REPO" 'index($r) != null' >/dev/null; then
                  echo "[SKIP] ${dest} -- not in only_repos for ${REPO}"
                  continue
                fi

                MANIFEST_ENTRY=$(jq -c --arg d "$dest" '.files[$d] // empty' "$MANIFEST_RECEIPT_FILE")
                if [ -z "$MANIFEST_ENTRY" ] || ! echo "$MANIFEST_ENTRY" | jq -e \
                  --arg src "$src" --arg dest "$dest" '
                    .src == $src and .dest == $dest and
                    (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                    (.size | type == "number" and floor == . and . >= 0)
                  ' >/dev/null; then
                  echo "[ERROR] Manifest entry missing or inconsistent for ${dest}" >&2
                  exit 1
                fi
                CANONICAL_SHA=$(echo "$MANIFEST_ENTRY" | jq -r '.sha')
                CANONICAL_SIZE=$(echo "$MANIFEST_ENTRY" | jq -r '.size')
                CANONICAL_MODE=$(echo "$MANIFEST_ENTRY" | jq -r '.mode')
                CACHE_FILE=$(managed_cache_path "$dest")

                if [ -f "$dest" ]; then
                  LOCAL_SHA=$(git hash-object "$dest")
                  LOCAL_MODE=$(git ls-files -s -- "$dest" | awk 'NR == 1 { print $1 }')
                  if [ "$LOCAL_SHA" != "$CANONICAL_SHA" ] || [ "$LOCAL_MODE" != "$CANONICAL_MODE" ]; then
                    echo "[DRIFT] Content mismatch: ${dest}"
                    DRIFT_FILES="${DRIFT_FILES}${dest}\n"
                    DRIFT_COUNT=$((DRIFT_COUNT + 1))
                    if ! cache_managed_content \
                      "files/${dest}" \
                      "repos/${SOURCE_REPO}/contents/${src}" \
                      "$CANONICAL_SHA" "$CANONICAL_SIZE" "$CACHE_FILE"; then
                      exit 1
                    fi
                  else
                    echo "[OK] ${dest}"
                  fi
                else
                  echo "[DRIFT] Missing downstream: ${dest}"
                  DRIFT_FILES="${DRIFT_FILES}${dest}\n"
                  DRIFT_COUNT=$((DRIFT_COUNT + 1))
                  if ! cache_managed_content \
                    "files/${dest}" \
                    "repos/${SOURCE_REPO}/contents/${src}" \
                    "$CANONICAL_SHA" "$CANONICAL_SIZE" "$CACHE_FILE"; then
                    exit 1
                  fi
                fi
              done

              for absent_file in $(echo "$ABSENT_LIST" | jq -r '.[]'); do
                if git ls-files --error-unmatch -- "$absent_file" >/dev/null 2>&1; then
                  echo "[DRIFT] Retired managed file still tracked: ${absent_file}"
                  DRIFT_FILES="${DRIFT_FILES}${absent_file}\n"
                  DRIFT_COUNT=$((DRIFT_COUNT + 1))
                else
                  echo "[OK] Retired managed file absent: ${absent_file}"
                fi
              done

              # --- Dynamic dependabot.yml generation ------------------------
              echo ""
              echo "--- Dynamic dependabot.yml ---"
              DEPENDABOT_DRIFT=false

              # Detect ecosystems via local checkout (no API calls needed --
              # actions/checkout@v6 gave us the full tree).
              HAS_NPM=false; HAS_PIP=false; HAS_DOCKER=false
              if [ -f package.json ]; then
                HAS_NPM=true; echo "[INFO] Detected package.json → npm"
              fi
              if [ -f Dockerfile ]; then
                HAS_DOCKER=true; echo "[INFO] Detected Dockerfile → docker"
              fi
              for pyfile in requirements.txt pyproject.toml setup.py; do
                if [ -f "$pyfile" ]; then
                  HAS_PIP=true; echo "[INFO] Detected ${pyfile} → pip"; break
                fi
              done

              # Build dependabot.yml content
              DEPBOT="---\nversion: 2\nupdates:\n  # --- GitHub Actions ---\n  - package-ecosystem: \"github-actions\"\n    directory: \"/\"\n    schedule:\n      interval: \"weekly\"\n      day: \"monday\"\n    commit-message:\n      prefix: \"chore(deps):\"\n    labels:\n      - \"dependencies\"\n    open-pull-requests-limit: 10\n    groups:\n      actions-minor-patch:\n        update-types:\n          - \"minor\"\n          - \"patch\"\n    cooldown:\n      default-days: 7"

              if [ "$HAS_NPM" = true ]; then
                DEPBOT="${DEPBOT}\n\n  # --- npm ---\n  - package-ecosystem: \"npm\"\n    directory: \"/\"\n    schedule:\n      interval: \"daily\"\n    commit-message:\n      prefix: \"chore(deps):\"\n    labels:\n      - \"dependencies\"\n    open-pull-requests-limit: 10\n    groups:\n      # First-party @${OWNER}/* packages: track latest daily, all update types\n      # (auto-merged once CI is green) so internal deps never drift behind.\n      f5-internal:\n        patterns:\n          - \"@${OWNER}/*\"\n        update-types:\n          - \"major\"\n          - \"minor\"\n          - \"patch\"\n      npm-minor-patch:\n        update-types:\n          - \"minor\"\n          - \"patch\"\n    cooldown:\n      default-days: 7"
              fi

              if [ "$HAS_PIP" = true ]; then
                DEPBOT="${DEPBOT}\n\n  # --- pip ---\n  - package-ecosystem: \"pip\"\n    directory: \"/\"\n    schedule:\n      interval: \"weekly\"\n      day: \"monday\"\n    commit-message:\n      prefix: \"chore(deps):\"\n    labels:\n      - \"dependencies\"\n    open-pull-requests-limit: 10\n    groups:\n      pip-minor-patch:\n        update-types:\n          - \"minor\"\n          - \"patch\"\n    cooldown:\n      default-days: 7"
              fi

              if [ "$HAS_DOCKER" = true ]; then
                DEPBOT="${DEPBOT}\n\n  # --- Docker ---\n  - package-ecosystem: \"docker\"\n    directory: \"/\"\n    schedule:\n      interval: \"weekly\"\n      day: \"monday\"\n    commit-message:\n      prefix: \"chore(deps):\"\n    labels:\n      - \"dependencies\"\n    open-pull-requests-limit: 5\n    groups:\n      docker-minor-patch:\n        update-types:\n          - \"minor\"\n          - \"patch\"\n    cooldown:\n      default-days: 7"
              fi

              DEPBOT="${DEPBOT}\n"
              # Write generated dependabot.yml to temp file (preserves trailing newline)
              printf '%b' "$DEPBOT" >"${SYNC_WORK_DIR}/generated-dependabot.yml"

              # Compare with current dependabot.yml in target repo (local disk,
              # no API call -- file was checked out by actions/checkout@v6).
              if [ -f .github/dependabot.yml ]; then
                cp .github/dependabot.yml "${SYNC_WORK_DIR}/current-dependabot.yml"
              else
                : >"${SYNC_WORK_DIR}/current-dependabot.yml"
              fi

              if ! diff -q "${SYNC_WORK_DIR}/generated-dependabot.yml" \
                "${SYNC_WORK_DIR}/current-dependabot.yml" >/dev/null 2>&1; then
                echo "[DRIFT] .github/dependabot.yml needs update"
                DEPENDABOT_DRIFT=true
                DRIFT_FILES="${DRIFT_FILES}.github/dependabot.yml\n"
                DRIFT_COUNT=$((DRIFT_COUNT + 1))
              else
                echo "[OK] .github/dependabot.yml"
              fi

              # --- Dynamic README.md generation ------------------------------
              echo ""
              echo "--- Dynamic README.md ---"
              README_DRIFT=false

              # Honor per-repo skip_files opt-out: repos that maintain their own
              # README (e.g. a marketplace-rendered file) opt out by listing
              # "README.md" in skip_files. Skip generation entirely for them.
              if echo "$SKIP_LIST" | jq -e 'index("README.md") != null' >/dev/null; then
                echo "[SKIP] README.md -- opted out by ${REPO}"
              else
                # Fetch docs-sites.json from docs-control
                DOCS_SITES_JSON=$(fetch_governed "docs-sites.json" "repos/${CONFIG_REPO}/contents/.github/config/docs-sites.json")
                if ! printf '%s' "$DOCS_SITES_JSON" | validate_docs_sites; then
                  echo "[ERROR] Canonical docs-sites.json is invalid" >&2
                  exit 1
                fi

                DOCS_SITE_URL="https://${OWNER}.github.io/${REPO}/llms-full.txt"
                DOCS_SITE_ENTRY=$(printf '%s' "$DOCS_SITES_JSON" | jq -ec \
                  --arg url "$DOCS_SITE_URL" '
                    [.[] | select(.url == $url)] |
                    if length == 0 then null
                    elif length == 1 then .[0]
                    else error("duplicate canonical docs site")
                    end')

                if [ "$DOCS_SITE_ENTRY" = "null" ]; then
                  echo "[ERROR] No canonical docs-site metadata for ${OWNER}/${REPO}; add the exact entry or an explicit README.md opt-out" >&2
                  exit 1
                else
                  README_TITLE=$(printf '%s' "$DOCS_SITE_ENTRY" | jq -er '.label')
                  README_DESC=$(printf '%s' "$DOCS_SITE_ENTRY" | jq -er '.description')
                  DOCS_URL=$(printf '%s' "$DOCS_SITE_ENTRY" | jq -er \
                    '.url | sub("llms-full\\.txt$"; "")')

                  # Generate badges only from the selected canonical site entry.
                  README_BADGES=$(printf '%s' "$DOCS_SITE_ENTRY" | jq -r \
                    --arg r "$REPO" --arg o "$OWNER" '
                      .badges // [] |
                      if length == 0 then empty
                      else .[] |
                        "[![\(.name)](https://github.com/\($o)/\($r)/actions/workflows/\(.workflow)/badge.svg)](https://github.com/\($o)/\($r)/actions/workflows/\(.workflow))"
                      end')

                  README_ENGLISH_ONLY=$(printf '%s' "$DOCS_SITE_ENTRY" |
                    readme_english_only)
                case "$README_ENGLISH_ONLY" in
                  true)
                    printf '%s\n' '🌐 English' >"${SYNC_WORK_DIR}/language-nav.txt"
                    ;;
                  false)
                    printf '%s\n' \
                      '🌐 English |' \
                      "[日本語](https://${OWNER}.github.io/${REPO}/ja/) |" \
                      "[한국어](https://${OWNER}.github.io/${REPO}/ko/) |" \
                      "[简体中文](https://${OWNER}.github.io/${REPO}/zh-cn/) |" \
                      "[繁體中文](https://${OWNER}.github.io/${REPO}/zh-tw/) |" \
                      "[Español](https://${OWNER}.github.io/${REPO}/es/) |" \
                      "[Português](https://${OWNER}.github.io/${REPO}/pt-br/) |" \
                      "[Français](https://${OWNER}.github.io/${REPO}/fr/) |" \
                      "[Deutsch](https://${OWNER}.github.io/${REPO}/de/) |" \
                      "[Italiano](https://${OWNER}.github.io/${REPO}/it/) |" \
                      "[العربية](https://${OWNER}.github.io/${REPO}/ar/) |" \
                      "[हिन्दी](https://${OWNER}.github.io/${REPO}/hi/) |" \
                      "[ไทย](https://${OWNER}.github.io/${REPO}/th/)" \
                      >"${SYNC_WORK_DIR}/language-nav.txt"
                    ;;
                  *)
                    echo "[ERROR] readme_english_only must be true or false for ${REPO}" >&2
                    exit 1
                    ;;
                esac

                # Fetch README.md.tpl from docs-control
                README_TEMPLATE_FILE="${SYNC_WORK_DIR}/README.md.tpl"
                if ! fetch_governed "README.md.tpl" \
                  "repos/${CONFIG_REPO}/contents/README.md.tpl" >"$README_TEMPLATE_FILE"; then
                  echo "[ERROR] Could not fetch canonical README template" >&2
                  exit 1
                fi

                # Escape sed replacement-string metacharacters (backslash, &, and the
                # | delimiter) in substitution values, so a value containing them (e.g.
                # a title like "Web App & API Protection") renders literally instead of
                # sed expanding & to the matched placeholder.
                sed_esc() { printf '%s' "$1" | sed -e 's/[\\&|]/\\&/g'; }
                ORG_NAME_ESC=$(sed_esc "$OWNER")
                README_TITLE_ESC=$(sed_esc "$README_TITLE")
                README_DESC_ESC=$(sed_esc "$README_DESC")
                REPO_NAME_ESC=$(sed_esc "$REPO")
                DOCS_URL_ESC=$(sed_esc "$DOCS_URL")

                # Substitute placeholders
                # Write generated README.md to temp file (preserves trailing newline)
                sed \
                  -e "s|__ORG_NAME__|${ORG_NAME_ESC}|g" \
                  -e "s|__TITLE__|${README_TITLE_ESC}|g" \
                  -e "s|__DESCRIPTION__|${README_DESC_ESC}|g" \
                  -e "s|__REPO_NAME__|${REPO_NAME_ESC}|g" \
                  -e "s|__DOCS_URL__|${DOCS_URL_ESC}|g" \
                  "$README_TEMPLATE_FILE" >"${SYNC_WORK_DIR}/generated-readme.md"

                replace_readme_marker "__LANGUAGE_NAV__" \
                  "${SYNC_WORK_DIR}/language-nav.txt" "${SYNC_WORK_DIR}/generated-readme.md"

                : >"${SYNC_WORK_DIR}/extra-badges.md"
                if [ -n "$README_BADGES" ]; then
                  printf '%s\n' "$README_BADGES" >"${SYNC_WORK_DIR}/extra-badges.md"
                fi
                replace_readme_marker "__EXTRA_BADGES__" \
                  "${SYNC_WORK_DIR}/extra-badges.md" "${SYNC_WORK_DIR}/generated-readme.md"

                README_CONTENT=$(printf '%s' "$DOCS_SITE_ENTRY" | jq -r '.readme_content // ""')
                : >"${SYNC_WORK_DIR}/extra-content.md"
                if [ -n "$README_CONTENT" ]; then
                  printf '%s\n' "$README_CONTENT" >"${SYNC_WORK_DIR}/extra-content.md"
                fi
                replace_readme_marker "__EXTRA_CONTENT__" \
                  "${SYNC_WORK_DIR}/extra-content.md" "${SYNC_WORK_DIR}/generated-readme.md"

                # Collapse runs of blank lines left behind by deleting an optional
                # placeholder. __EXTRA_CONTENT__ sits on its own line between two blank
                # lines in the template, so removing it leaves those two adjacent --
                # markdownlint MD012. Most sites in docs-sites.json omit readme_content,
                # so that path remains used by most repos in the fleet, and README.md is
                # protected, so no consumer can fix it locally. Squeezing here fixes the
                # existing case and any optional placeholder added later.
                cat -s "${SYNC_WORK_DIR}/generated-readme.md" \
                  >"${SYNC_WORK_DIR}/generated-readme.squeezed"
                mv "${SYNC_WORK_DIR}/generated-readme.squeezed" \
                  "${SYNC_WORK_DIR}/generated-readme.md"

                validate_generated_readme "${SYNC_WORK_DIR}/generated-readme.md" \
                  "$README_TITLE" "$README_DESC" "$DOCS_URL" "$OWNER" "$REPO"

                # Compare with current README.md in target repo (local disk, no API).
                if [ -f README.md ]; then
                  cp README.md "${SYNC_WORK_DIR}/current-readme.md"
                else
                  : >"${SYNC_WORK_DIR}/current-readme.md"
                fi

                if ! diff -q "${SYNC_WORK_DIR}/generated-readme.md" \
                  "${SYNC_WORK_DIR}/current-readme.md" >/dev/null 2>&1; then
                  echo "[DRIFT] README.md needs update"
                  README_DRIFT=true
                  DRIFT_FILES="${DRIFT_FILES}README.md\n"
                  DRIFT_COUNT=$((DRIFT_COUNT + 1))
                else
                  echo "[OK] README.md"
                fi
                fi
              fi

              # The reusable jobs run independently. Re-prove the exact
              # downstream receipt after every local comparison and before a
              # clean result or any issue, branch, or PR mutation.
              require_current_source_main
              require_current_downstream_main

              if [ "$DRIFT_COUNT" -eq 0 ]; then
                echo "[OK] All managed files match canonical"
              else
                echo "[INFO] Found ${DRIFT_COUNT} drifted file(s)"

                # Inventory every same-named PR across all head repositories.
                # The CLI head filter cannot express owner-qualified heads, so
                # selecting its first result could merge a same-named fork PR.
                SYNC_PR_INVENTORY=$(mktemp)
                read_sync_prs "$SYNC_PR_INVENTORY"
                SYNC_PR_ROW=$(select_owned_sync_pr "$SYNC_PR_INVENTORY")
                rm -f "$SYNC_PR_INVENTORY"
                EXISTING_PR=""
                if [ -n "$SYNC_PR_ROW" ]; then
                  IFS=$'\t' read -r EXISTING_PR EXISTING_BRANCH EXISTING_HEAD <<<"$SYNC_PR_ROW"
                fi
                if [ -n "$EXISTING_PR" ]; then
                  retry 3 assert_sync_pr_head \
                    "$EXISTING_PR" "$EXISTING_BRANCH" "$EXISTING_HEAD"
                  require_current_source_main
                  require_current_downstream_main
                  CLOSE_PR_JSON=$(jq -n '{state:"closed"}')
                  retry_current_json 3 "$CLOSE_PR_JSON" \
                    "repos/${OWNER}/${REPO}/pulls/${EXISTING_PR}" --method PATCH >/dev/null
                  echo "[OK] Closed superseded sync PR #${EXISTING_PR} without deleting its branch"
                fi

                # Close only issues carrying the exact automation ownership marker.
                STALE_ISSUE_INVENTORY=$(mktemp)
                if ! retry 3 gh api --paginate --slurp \
                  "repos/${OWNER}/${REPO}/issues?state=open&per_page=100" \
                  >"$STALE_ISSUE_INVENTORY"; then
                  echo "[ERROR] Could not inventory stale sync issues" >&2
                  rm -f "$STALE_ISSUE_INVENTORY"
                  exit 1
                fi
                if ! STALE_ISSUES=$(select_owned_stale_issues <"$STALE_ISSUE_INVENTORY"); then
                  echo "[ERROR] Stale sync issue inventory is invalid" >&2
                  rm -f "$STALE_ISSUE_INVENTORY"
                  exit 1
                fi
                rm -f "$STALE_ISSUE_INVENTORY"
                for stale_num in $STALE_ISSUES; do
                  require_current_source_main
                  require_current_downstream_main
                  CLOSE_ISSUE_JSON=$(jq -n '{state:"closed",state_reason:"completed"}')
                  retry_current_json 3 "$CLOSE_ISSUE_JSON" \
                    "repos/${OWNER}/${REPO}/issues/${stale_num}" --method PATCH >/dev/null
                  echo "[OK] Closed stale owned sync issue #${stale_num}"
                done

                DRIFT_LIST=$(printf '%b' "$DRIFT_FILES" | sed '/^$/d' | sed 's/^/- /')
                ISSUE_MARKER="<!-- managed-file-sync:${expected_source_sha}:${expected_downstream_sha} -->"
                ISSUE_BODY=$(printf "%s\n\nThe following managed files have drifted from the canonical source in \`%s\`:\n\n%s\n\nThis issue was created automatically by the governance enforcement workflow." \
                  "$ISSUE_MARKER" "$SOURCE_REPO" "$DRIFT_LIST")
                require_current_source_main
                require_current_downstream_main
                ISSUE_NUM=$(retry 3 create_or_find_sync_issue \
                  "chore: sync managed files from governance template" "$ISSUE_BODY" "$ISSUE_MARKER")
                if ! printf '%s' "$ISSUE_NUM" | grep -qE '^[1-9][0-9]*$'; then
                  echo "[ERROR] Issue creation returned an invalid number" >&2
                  exit 1
                fi
                echo "[OK] Created issue #${ISSUE_NUM}"

                # The run-owned branch must be absent. Never move or reuse an
                # unproved ref, even if an earlier attempt used the same name.
                MAIN_SHA="$expected_downstream_sha"
                set +e
                EXISTING_BRANCH_SHA=$(api_value_or_404 \
                  "repos/${OWNER}/${REPO}/git/ref/heads/${SYNC_BRANCH}" \
                  '.object.sha')
                BRANCH_LOOKUP_RC=$?
                set -e
                case "$BRANCH_LOOKUP_RC" in
                  0)
                    require_sha "unexpected run-owned sync branch" "$EXISTING_BRANCH_SHA"
                    echo "[ERROR] Run-owned sync branch ${SYNC_BRANCH} already exists" >&2
                    exit 1
                    ;;
                  44)
                    BRANCH_CREATE_JSON=$(jq -n --arg sha "$MAIN_SHA" --arg branch "$SYNC_BRANCH" \
                      '{"ref":("refs/heads/" + $branch),"sha":$sha}')
                    require_current_source_main
                    require_current_downstream_main
                    retry_current_json 3 "$BRANCH_CREATE_JSON" \
                      "repos/${OWNER}/${REPO}/git/refs" --method POST >/dev/null
                    ;;
                  *) exit 1 ;;
                esac
                echo "[OK] Created run-owned branch ${SYNC_BRANCH} at protected main"

                commit_tree "$SYNC_BRANCH" \
                  "chore: sync managed files from governance template"

                PR_BODY=$(printf "Closes #%s\n\nSynced managed files from \`%s\` canonical source:\n\n%s" \
                  "$ISSUE_NUM" "$SOURCE_REPO" "$DRIFT_LIST")
                require_current_source_main
                require_current_downstream_main
                PR_NUM=$(retry 3 create_or_find_sync_pr \
                  "chore: sync managed files from governance template" "$PR_BODY")
                if ! printf '%s' "$PR_NUM" | grep -qE '^[1-9][0-9]*$'; then
                  echo "[ERROR] PR creation returned an invalid number" >&2
                  exit 1
                fi
                echo "[OK] Created sync PR #${PR_NUM}"

                retry 3 assert_sync_pr_head "$PR_NUM" "$SYNC_BRANCH" "$LAST_COMMIT_SHA"
                auto_merge "$PR_NUM" "${OWNER}/${REPO}" "$LAST_COMMIT_SHA"
                SYNC_PR_CREATED=true
              fi
            fi
          fi

          # --- Phase 3: Verify --------------------------------------------------
          echo ""
          echo "=== Phase 3: Verify ==="

          require_current_source_main
          require_current_downstream_main

          if [ -n "$MANAGED_FILES" ] && [ "${OWNER}/${REPO}" != "$SOURCE_REPO" ]; then
            if [ "$SYNC_PR_CREATED" = true ]; then
              echo "[OK] Sync PR created with a confirmed merge transition"
            elif [ -n "$EXISTING_PR" ]; then
              echo "[OK] Existing sync PR #${EXISTING_PR} has a confirmed merge transition"
            else
              echo "[OK] Managed files verified"
            fi
          else
            echo "[SKIP] No managed files to verify"
          fi

          echo "[OK] Managed-file enforcement run complete"
