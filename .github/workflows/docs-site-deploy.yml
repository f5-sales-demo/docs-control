---
name: Deploy docs-control Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  docs:
    uses: ./.github/workflows/github-pages-deploy.yml
    permissions:
      contents: read # read the protected documentation source
      packages: read # pull the approved documentation builder
      pages: write # publish the verified Pages artifact
      id-token: write # authenticate the Pages deployment
    with:
      content-ref: ${{ github.sha }}
      # docs-control is itself ARC-governed; do not fall back to the
      # repository-name labels that do not exist for this control-plane repo.
      socketless_runner_label: managed-socketless
      container_build_runner_label: managed-container-build
