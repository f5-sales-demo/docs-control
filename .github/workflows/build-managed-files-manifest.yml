---
name: Build Managed Files Manifest

# Regenerates .github/config/managed-files-manifest.json whenever a
# managed-file source changes on main. Downstream repos fetch this
# manifest ONCE per sync run and compare blob SHAs locally via
# `git hash-object`, eliminating the 34x2 per-file content fetches that
# previously hammered docs-control's content endpoints.

on:
  push:
    branches: [main]
    paths:
      - '.github/config/repo-settings.json'
      - '.github/actionlint.yaml'
      - '.github/config/self-hosted-runner-policy.json'
      - '.github/workflows/**'
      - '.github/config/managed-files-manifest.json'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'workflows/**'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'STYLE_GUIDE.md'
      - '.agents/**'
      - 'README.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - '.yamllint.yaml'
      - '.markdownlint.json'
      - 'biome.json'
      - '.jscpd.json'
      - '.textlintrc'
      - '.editorconfig-checker.json'
      - '.gitleaks.toml'
      - '.checkov.yaml'
      - 'zizmor.yaml'
      - '.shellcheckrc'
      - '.codespellrc'
      - '.prettierignore'
      - '.trivyignore'
      - '.ruff.toml'
      - 'ruff.toml'
      - 'trivy.yaml'
      - '.isort.cfg'
      - '.python-lint'
      - '.mypy.ini'
      - '.claude/governance.json'
      - '.claude/settings.json'
      - 'scripts/**'
      - 'tests/**'
      - '.claude/hooks/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-managed-files-manifest
  cancel-in-progress: true

jobs:
  build:
    name: Build managed-files manifest
    runs-on: managed-socketless
    environment: repository-settings
    permissions:
      contents: read # check out the protected governance source
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Remote reads authenticate explicitly through gh in the build step.
          persist-credentials: false
          # Use a PAT so the manifest PR (and its branch push) are attributed
          # to a real user — PRs opened with the default GITHUB_TOKEN do not
          # trigger CI, leaving required checks unreported and auto-merge stuck.
          token: ${{ secrets.REPO_SETTINGS_TOKEN }}

      - name: Build manifest
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
          CONFIG_PATH: .github/config/repo-settings.json
          MANIFEST_PATH: .github/config/managed-files-manifest.json
        run: |
          set -euo pipefail
          gh auth setup-git

          resolve_protected_main_sha() {
            local framed sha
            if ! framed=$(git ls-remote --exit-code --heads origin refs/heads/main &&
              printf '\034'); then
              echo "[ERROR] Could not resolve protected main from the Git remote" >&2
              return 1
            fi
            sha=${framed%%$'\t'*}
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] ||
              [ "$framed" != "${sha}"$'\trefs/heads/main\n\034' ]; then
              echo "[ERROR] Protected main Git remote receipt is invalid" >&2
              return 1
            fi
            printf '%s' "$sha"
          }

          PROTECTED_MAIN_SHA=$(resolve_protected_main_sha)
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if ! printf '%s\n%s\n%s\n' \
            "$SOURCE_COMMIT" "$CHECKED_OUT_SHA" "$PROTECTED_MAIN_SHA" |
            awk '/^[0-9a-f]{40}$/ { valid++ } END { exit valid != 3 }'; then
            echo "[ERROR] Manifest source identities are invalid" >&2
            exit 1
          fi
          if [ "$SOURCE_COMMIT" != "$PROTECTED_MAIN_SHA" ] ||
            [ "$CHECKED_OUT_SHA" != "$PROTECTED_MAIN_SHA" ]; then
            echo "[ERROR] Manifest generation requires the exact current protected main" >&2
            exit 1
          fi

          if [ ! -f "$CONFIG_PATH" ]; then
            echo "[ERROR] $CONFIG_PATH not found" >&2
            exit 1
          fi
          if ! jq -e '
            def safe_path:
              type == "string" and
              length > 0 and
              test("^[A-Za-z0-9._/-]+$") and
              (startswith("/") | not) and
              (split("/") | all(.[]; length > 0 and . != "." and . != ".."));
            .managed_files as $managed |
            ($managed.files | type == "array" and length > 0) and
            all($managed.files[];
              (.src | safe_path) and
              (.dest | safe_path)) and
            ([$managed.files[].dest] | length == (unique | length)) and
            ($managed.absent_files | type == "array" and length > 0 and
              all(.[]; safe_path) and
              length == (unique | length)) and
            (([$managed.files[].dest] + $managed.absent_files) |
              length == (unique | length))
          ' "$CONFIG_PATH" >/dev/null; then
            echo "[ERROR] Managed-file present and absent paths are invalid or overlap" >&2
            exit 1
          fi
          DUPLICATE_DESTS=$(jq -r '
            [.managed_files.files[].dest] | sort | group_by(.) |
            .[] | select(length > 1) | .[0]
          ' "$CONFIG_PATH")
          if [ -n "$DUPLICATE_DESTS" ]; then
            echo "[ERROR] Duplicate managed-file destinations:" >&2
            printf '%s\n' "$DUPLICATE_DESTS" | sed 's/^/  - /' >&2
            exit 1
          fi

          ENTRIES=$(jq -c '.managed_files.files[]' "$CONFIG_PATH")
          if [ -z "$ENTRIES" ]; then
            echo "[ERROR] No managed_files.files[] entries in $CONFIG_PATH" >&2
            exit 1
          fi

          FILES_JSON="[]"
          MISSING=""
          INVALID_MODES=""
          while IFS= read -r entry; do
            src=$(echo "$entry" | jq -r '.src')
            dest=$(echo "$entry" | jq -r '.dest')
            if [ ! -f "$src" ]; then
              MISSING="${MISSING}${src}\n"
              continue
            fi
            sha=$(git hash-object "$src")
            size=$(wc -c <"$src" | tr -d ' ')
            mode=$(git ls-files -s -- "$src" | awk 'NR == 1 { print $1 }')
            if ! printf '%s' "$mode" | grep -qE '^100(644|755)$'; then
              INVALID_MODES="${INVALID_MODES}${src}:${mode:-missing}\n"
              continue
            fi
            FILES_JSON=$(echo "$FILES_JSON" | jq \
              --arg path "$dest" \
              --arg src "$src" \
              --arg sha "$sha" \
              --arg mode "$mode" \
              --argjson size "$size" \
              '. + [{path: $path, src: $src, sha: $sha, size: $size, mode: $mode}] | sort_by(.path)')
          done <<<"$ENTRIES"

          if [ -n "$MISSING" ]; then
            echo "[ERROR] Managed-file sources missing from checkout:" >&2
            printf '%b' "$MISSING" | sed 's/^/  - /' >&2
            exit 1
          fi
          if [ -n "$INVALID_MODES" ]; then
            echo "[ERROR] Managed-file sources have invalid Git modes:" >&2
            printf '%b' "$INVALID_MODES" | sed 's/^/  - /' >&2
            exit 1
          fi

          ABSENT_PATHS=$(jq -c '.managed_files.absent_files | sort' "$CONFIG_PATH")
          STATE=$(jq -cnS --argjson files "$FILES_JSON" --argjson absent_paths "$ABSENT_PATHS" \
            '{files: $files, absent_paths: $absent_paths}')
          STATE_DIGEST="sha256:$(printf '%s' "$STATE" | sha256sum | cut -d' ' -f1)"
          jq -n \
            --arg source_commit "$SOURCE_COMMIT" \
            --argjson files "$FILES_JSON" \
            --argjson absent_paths "$ABSENT_PATHS" \
            --arg state_digest "$STATE_DIGEST" \
            '{schema_version: 2, source_commit: $source_commit, files: $files, absent_paths: $absent_paths, state_digest: $state_digest}' \
            >"$MANIFEST_PATH"

          echo "[OK] Wrote manifest with $(echo "$FILES_JSON" | jq 'length') present entries, $(echo "$ABSENT_PATHS" | jq 'length') absent paths, and state $STATE_DIGEST"

      - name: Open or update auto-merged manifest PR if files changed
        # main is protected (required checks + enforce_admins, no bypass), so a
        # direct push of the manifest is rejected. Instead route the manifest
        # through an auto-merging PR on a sync/* branch (excluded from the
        # require-linked-issue gate). The PR is only opened/updated when the
        # canonical managed state actually changes — source_commit churn is ignored — so
        # there is no per-run PR spam. The manifest is excluded
        # from biome, so the PR's Lint Code Base passes. Downstream sync fails
        # closed until this exact manifest evidence lands.
        env:
          # PAT (not GITHUB_TOKEN) so the PR triggers CI and auto-merge can proceed.
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
          MANIFEST_PATH: .github/config/managed-files-manifest.json
          # Immutable source-SHA branches prevent delayed runs from replacing newer state.
          BRANCH: sync/manifest-${{ github.sha }}
        run: |
          set -euo pipefail

          resolve_protected_main_sha() {
            local framed sha
            if ! framed=$(git ls-remote --exit-code --heads origin refs/heads/main &&
              printf '\034'); then
              echo "[ERROR] Could not resolve protected main from the Git remote" >&2
              return 1
            fi
            sha=${framed%%$'\t'*}
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] ||
              [ "$framed" != "${sha}"$'\trefs/heads/main\n\034' ]; then
              echo "[ERROR] Protected main Git remote receipt is invalid" >&2
              return 1
            fi
            printf '%s' "$sha"
          }

          PROTECTED_MAIN_SHA=$(resolve_protected_main_sha)
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if ! printf '%s\n%s\n%s\n' \
            "$SOURCE_COMMIT" "$CHECKED_OUT_SHA" "$PROTECTED_MAIN_SHA" |
            awk '/^[0-9a-f]{40}$/ { valid++ } END { exit valid != 3 }'; then
            echo "[ERROR] Manifest publication identities are invalid" >&2
            exit 1
          fi
          if [ "$SOURCE_COMMIT" != "$PROTECTED_MAIN_SHA" ] ||
            [ "$CHECKED_OUT_SHA" != "$PROTECTED_MAIN_SHA" ]; then
            echo "[ERROR] Manifest publication requires the exact current protected main" >&2
            exit 1
          fi

          read_manifest_prs() {
            local destination="$1"
            if ! gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --paginate --slurp >"$destination"; then
              echo "[ERROR] Could not inventory open manifest PRs" >&2
              return 1
            fi
            if ! jq -e --arg branch "$BRANCH" '
              type == "array" and all(.[]; type == "array") and
              all(.[][] | select(.head.ref == $branch);
                (.number | type == "number" and floor == . and . >= 1) and
                (.head.ref | type == "string") and
                (.head.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                (.head.repo.full_name | type == "string") and
                (.base.ref | type == "string"))
            ' "$destination" >/dev/null; then
              echo "[ERROR] Open manifest PR inventory is invalid" >&2
              return 1
            fi
          }

          select_owned_manifest_pr() {
            local inventory="$1" count row pr_num pr_repo pr_base pr_head
            count=$(jq --arg branch "$BRANCH" '
              [.[][] | select(.head.ref == $branch)] | length
            ' "$inventory")
            case "$count" in
              0) return 0 ;;
              1)
                row=$(jq -r --arg branch "$BRANCH" '
                  .[][] | select(.head.ref == $branch) |
                  [.number, .head.repo.full_name, .base.ref, .head.sha] | @tsv
                ' "$inventory")
                IFS=$'\t' read -r pr_num pr_repo pr_base pr_head <<<"$row"
                if [ "$pr_repo" != "$GITHUB_REPOSITORY" ] || [ "$pr_base" != "main" ]; then
                  echo "[ERROR] Open manifest PR is not owned by protected ${GITHUB_REPOSITORY} main" >&2
                  return 1
                fi
                printf '%s\t%s\n' "$pr_num" "$pr_head"
                ;;
              *)
                echo "[ERROR] Multiple open manifest PRs claim ${BRANCH}" >&2
                return 1
                ;;
            esac
          }

          assert_exact_remote_manifest_ref() {
            local expected_sha="$1" framed remote_sha rc
            if ! printf '%s' "$expected_sha" | grep -qE '^[0-9a-f]{40}$'; then
              echo "[ERROR] Invalid expected manifest ref receipt" >&2
              return 1
            fi
            set +e
            framed=$(git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" &&
              printf '\034')
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "[ERROR] Could not re-prove the pushed manifest ref" >&2
              return 1
            fi
            remote_sha=${framed%%$'\t'*}
            if [[ ! "$remote_sha" =~ ^[0-9a-f]{40}$ ]] ||
              [ "$framed" != "${remote_sha}"$'\trefs/heads/'"${BRANCH}"$'\n\034' ] ||
              [ "$remote_sha" != "$expected_sha" ]; then
              echo "[ERROR] Remote manifest ref changed after the exact push" >&2
              return 1
            fi
          }

          settle_owned_manifest_pr() {
            local expected_sha="$1" expected_pr_num="$2" stale_sha="$3"
            local attempt inventory row rc actual_pr_num actual_head
            if ! printf '%s' "$expected_sha" | grep -qE '^[0-9a-f]{40}$' ||
              ! printf '%s' "$expected_pr_num" | grep -qE '^[1-9][0-9]*$' ||
              { [ -n "$stale_sha" ] &&
                ! printf '%s' "$stale_sha" | grep -qE '^[0-9a-f]{40}$'; }; then
              echo "[ERROR] Invalid manifest PR settlement receipt" >&2
              return 1
            fi

            for attempt in 1 2 3 4 5 6; do
              if ! assert_exact_remote_manifest_ref "$expected_sha"; then
                return 1
              fi

              inventory=$(mktemp)
              if ! read_manifest_prs "$inventory"; then
                rm -f "$inventory"
                return 1
              fi
              set +e
              row=$(select_owned_manifest_pr "$inventory")
              rc=$?
              set -e
              rm -f "$inventory"
              if [ "$rc" -ne 0 ]; then
                return "$rc"
              fi
              if [ -n "$row" ]; then
                IFS=$'\t' read -r actual_pr_num actual_head <<<"$row"
                if [ "$actual_pr_num" != "$expected_pr_num" ]; then
                  echo "[ERROR] Manifest PR ownership changed after the exact push" >&2
                  return 1
                fi
                if [ "$actual_head" = "$expected_sha" ]; then
                  if ! assert_exact_remote_manifest_ref "$expected_sha"; then
                    return 1
                  fi
                  printf '%s\n' "$row"
                  return 0
                fi
                if [ -z "$stale_sha" ] || [ "$actual_head" != "$stale_sha" ]; then
                  echo "[ERROR] Manifest PR reported an unrecognized head after the exact push" >&2
                  return 1
                fi
              fi
              if [ "$attempt" -lt 6 ]; then
                sleep 2
              fi
            done
            echo "[ERROR] Manifest PR head did not settle to the exact pushed commit" >&2
            return 1
          }

          assert_manifest_pr_head() {
            local pr_num="$1" expected_sha="$2" response
            if ! printf '%s' "$pr_num" | grep -qE '^[1-9][0-9]*$' ||
              ! printf '%s' "$expected_sha" | grep -qE '^[0-9a-f]{40}$'; then
              echo "[ERROR] Invalid manifest PR receipt" >&2
              return 1
            fi
            response=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_num}")
            if ! echo "$response" | jq -e \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg branch "$BRANCH" \
              --arg sha "$expected_sha" '
                .state == "open" and
                .head.repo.full_name == $repo and
                .head.ref == $branch and
                .head.sha == $sha and
                .base.ref == "main"
              ' >/dev/null; then
              echo "[ERROR] Manifest PR ownership or exact head changed before auto-merge" >&2
              return 1
            fi
          }

          assert_manifest_pr_diff() {
            local expected_head="$1" response
            if ! printf '%s' "$expected_head" | grep -qE '^[0-9a-f]{40}$'; then
              echo "[ERROR] Invalid manifest diff receipt" >&2
              return 1
            fi
            response=$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${PROTECTED_MAIN_SHA}...${expected_head}")
            if ! printf '%s' "$response" | jq -e \
              --arg expected_head "$expected_head" \
              --arg manifest_path "$MANIFEST_PATH" '
                .status == "ahead" and
                .ahead_by == 1 and
                .total_commits == 1 and
                (.commits | length) == 1 and
                .commits[0].sha == $expected_head and
                (.files | length) == 1 and
                .files[0].filename == $manifest_path
              ' >/dev/null; then
              echo "[ERROR] Manifest PR is not one exact manifest-only commit on protected main" >&2
              return 1
            fi
          }

          assert_manifest_commit_parent() {
            local expected_head="$1" response
            response=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${expected_head}")
            if ! printf '%s' "$response" | jq -e \
              --arg head "$expected_head" \
              --arg source "$PROTECTED_MAIN_SHA" '
                .sha == $head and (.parents | length) == 1 and .parents[0].sha == $source
              ' >/dev/null; then
              echo "[ERROR] Manifest head does not have the exact protected-main parent" >&2
              return 1
            fi
          }

          manifest_receipt_external_id() {
            local pr_num="$1" expected_head="$2"
            printf 'manifest-receipt:%s:pr:%s:source:%s:head:%s' \
              "$GITHUB_REPOSITORY" "$pr_num" "$PROTECTED_MAIN_SHA" "$expected_head"
          }

          read_linked_issue_receipts() {
            local expected_head="$1" response
            if ! response=$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${expected_head}/check-runs" \
              -f 'check_name=Check linked issues' -f 'filter=all' -F 'per_page=100'); then
              echo "[ERROR] Could not inventory linked-issue check receipts" >&2
              return 1
            fi
            if ! response=$(printf '%s' "$response" |
              jq -ce -f scripts/normalize-check-run-response.jq); then
              echo "[ERROR] Linked-issue check receipt inventory is invalid or incomplete" >&2
              return 1
            fi
            printf '%s' "$response" | jq -c '.check_runs'
          }

          assert_no_foreign_linked_issue_receipt() {
            local pr_num="$1" expected_head="$2" receipts count external_id
            external_id=$(manifest_receipt_external_id "$pr_num" "$expected_head")
            receipts=$(read_linked_issue_receipts "$expected_head")
            count=$(printf '%s' "$receipts" | jq 'length')
            if [ "$count" -eq 0 ]; then
              return 0
            fi
            if [ "$count" -eq 1 ] && printf '%s' "$receipts" | jq -e \
              --arg id "$external_id" --arg head "$expected_head" '
                .[0].external_id == $id and .[0].head_sha == $head and
                .[0].status == "completed" and .[0].conclusion == "success" and
                .[0].app.slug == "github-actions"
              ' >/dev/null; then
              return 0
            fi
            echo "[ERROR] Manifest head already has a foreign, duplicate, or unsuccessful required check" >&2
            return 1
          }

          dispatch_manifest_linked_issue_check() {
            local pr_num="$1" expected_sha="$2"
            if ! printf '%s' "$pr_num" | grep -qE '^[1-9][0-9]*$' ||
              ! printf '%s' "$expected_sha" | grep -qE '^[0-9a-f]{40}$'; then
              echo "[ERROR] Invalid manifest linked-issue dispatch receipt" >&2
              return 1
            fi
            if ! assert_manifest_pr_head "$pr_num" "$expected_sha"; then
              echo "[ERROR] Manifest PR changed before linked-issue dispatch" >&2
              return 1
            fi
            if ! gh workflow run attest-manifest-linked-issue.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f "pull_request_number=$pr_num" \
              -f "expected_source_sha=$PROTECTED_MAIN_SHA" \
              -f "expected_head_sha=$expected_sha"; then
              echo "[ERROR] Could not dispatch the manifest receipt attestor" >&2
              return 1
            fi
          }

          wait_for_exact_linked_issue_receipt() {
            local pr_num="$1" expected_head="$2" external_id receipts count attempt
            external_id=$(manifest_receipt_external_id "$pr_num" "$expected_head")
            for attempt in $(seq 1 36); do
              receipts=$(read_linked_issue_receipts "$expected_head")
              count=$(printf '%s' "$receipts" | jq 'length')
              if [ "$count" -eq 1 ]; then
                if printf '%s' "$receipts" | jq -e \
                  --arg id "$external_id" --arg head "$expected_head" '
                    .[0].external_id == $id and .[0].head_sha == $head and
                    .[0].status == "completed" and .[0].conclusion == "success" and
                    .[0].app.slug == "github-actions"
                  ' >/dev/null; then
                  echo "[OK] Exact linked-issue receipt published for ${expected_head}"
                  return 0
                fi
                echo "[ERROR] Required check receipt is foreign, incomplete, or unsuccessful" >&2
                return 1
              fi
              if [ "$count" -gt 1 ]; then
                echo "[ERROR] Duplicate required check receipts fail closed" >&2
                return 1
              fi
              if [ "$attempt" -lt 36 ]; then
                sleep 5
              fi
            done
            echo "[ERROR] Timed out waiting for the exact linked-issue receipt" >&2
            return 1
          }

          # Compare the canonical present+absent state (ignore source_commit churn).
          NEW_STATE=$(jq -er '.state_digest | select(test("^sha256:[0-9a-f]{64}$"))' "$MANIFEST_PATH")
          CURRENT_MANIFEST=$(mktemp)
          if ! git show "HEAD:${MANIFEST_PATH}" >"$CURRENT_MANIFEST"; then
            echo "[ERROR] Current checkout lacks a committed manifest receipt" >&2
            exit 1
          fi
          if CURRENT_STATE=$(jq -er '
            select(.schema_version == 2) |
            .state_digest | select(test("^sha256:[0-9a-f]{64}$"))
          ' "$CURRENT_MANIFEST"); then
            :
          else
            # One clean schema cutover is expected. The reconciler itself rejects
            # this legacy receipt; the builder must replace it through a PR.
            CURRENT_STATE="schema-replacement-required"
          fi
          rm -f "$CURRENT_MANIFEST"

          if [ "$NEW_STATE" = "$CURRENT_STATE" ]; then
            echo "[OK] Managed-file set unchanged - no manifest PR needed"
            exit 0
          fi
          echo "[INFO] Managed-file set changed - opening/updating manifest PR"

          # Inventory ownership and the exact remote ref before any mutation.
          MANIFEST_PR_INVENTORY=$(mktemp)
          read_manifest_prs "$MANIFEST_PR_INVENTORY"
          MANIFEST_PR_ROW=$(select_owned_manifest_pr "$MANIFEST_PR_INVENTORY")
          rm -f "$MANIFEST_PR_INVENTORY"
          PR_NUM=""
          INVENTORIED_HEAD=""
          if [ -n "$MANIFEST_PR_ROW" ]; then
            IFS=$'\t' read -r PR_NUM INVENTORIED_HEAD <<<"$MANIFEST_PR_ROW"
          fi

          set +e
          REMOTE_BRANCH_ROW=$(git ls-remote --exit-code --heads origin "refs/heads/$BRANCH")
          REMOTE_BRANCH_RC=$?
          set -e
          case "$REMOTE_BRANCH_RC" in
            0)
              REMOTE_BRANCH_SHA=$(printf '%s' "$REMOTE_BRANCH_ROW" |
                awk -v ref="refs/heads/$BRANCH" '
                  $2 == ref && $1 ~ /^[0-9a-f]{40}$/ { print $1; valid++ }
                  END { exit valid != 1 }
                ')
              if [ -z "$PR_NUM" ] || [ "$REMOTE_BRANCH_SHA" != "$INVENTORIED_HEAD" ]; then
                echo "[ERROR] Remote manifest branch is not owned by the inventoried PR" >&2
                exit 1
              fi
              ;;
            2)
              REMOTE_BRANCH_SHA=""
              if [ -n "$PR_NUM" ]; then
                echo "[ERROR] Inventoried manifest PR has no exact remote branch" >&2
                exit 1
              fi
              ;;
            *)
              echo "[ERROR] Could not prove the remote manifest branch state" >&2
              exit 1
              ;;
          esac

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add "$MANIFEST_PATH"
          if [ "$(git diff --cached --name-only)" != "$MANIFEST_PATH" ]; then
            echo "[ERROR] Manifest commit stages paths outside ${MANIFEST_PATH}" >&2
            exit 1
          fi
          git commit -m "chore(governance): regenerate managed-files-manifest.json"

          EXPECTED_HEAD=$(git rev-parse HEAD)
          if ! printf '%s' "$EXPECTED_HEAD" | grep -qE '^[0-9a-f]{40}$'; then
            echo "[ERROR] Local manifest branch head is invalid" >&2
            exit 1
          fi
          CURRENT_MAIN_SHA=$(resolve_protected_main_sha)
          if [ "$CURRENT_MAIN_SHA" != "$PROTECTED_MAIN_SHA" ]; then
            echo "[ERROR] Protected main changed before manifest publication" >&2
            exit 1
          fi

          if [ -n "$REMOTE_BRANCH_SHA" ]; then
            echo "[ERROR] Immutable manifest branch already exists; only the exact prior receipt may be retried" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"

          # Re-inventory after the exact ordinary push. A concurrent PR must
          # never be adopted as the workflow's own publication.
          MANIFEST_PR_INVENTORY=$(mktemp)
          read_manifest_prs "$MANIFEST_PR_INVENTORY"
          MANIFEST_PR_ROW=$(select_owned_manifest_pr "$MANIFEST_PR_INVENTORY")
          rm -f "$MANIFEST_PR_INVENTORY"
          if [ -z "$PR_NUM" ]; then
            if [ -n "$MANIFEST_PR_ROW" ]; then
              echo "[ERROR] An unowned manifest PR appeared after the exact push" >&2
              exit 1
            fi
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main --head "$BRANCH" \
              --title "chore(governance): regenerate managed-files-manifest.json" \
              --body "Automated managed-files manifest refresh. Auto-merges once checks pass; sync reads this to take the fast path instead of per-file API fetches.")
            PR_NUM=$(echo "$PR_URL" | grep -o '[0-9]*$')
            if ! printf '%s' "$PR_NUM" | grep -qE '^[1-9][0-9]*$'; then
              echo "[ERROR] Manifest PR creation returned an invalid URL" >&2
              exit 1
            fi
          fi
          set +e
          MANIFEST_PR_ROW=$(settle_owned_manifest_pr \
            "$EXPECTED_HEAD" "$PR_NUM" "$INVENTORIED_HEAD")
          SETTLE_RC=$?
          set -e
          if [ "$SETTLE_RC" -ne 0 ]; then
            exit 1
          fi
          IFS=$'\t' read -r FINAL_PR_NUM FINAL_HEAD <<<"$MANIFEST_PR_ROW"
          if [ "$FINAL_PR_NUM" != "$PR_NUM" ] || [ "$FINAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "[ERROR] Manifest PR does not own the exact pushed head" >&2
            exit 1
          fi
          assert_manifest_pr_head "$PR_NUM" "$EXPECTED_HEAD"
          assert_manifest_pr_diff "$EXPECTED_HEAD"
          assert_no_foreign_linked_issue_receipt "$PR_NUM" "$EXPECTED_HEAD"
          dispatch_manifest_linked_issue_check "$PR_NUM" "$EXPECTED_HEAD"
          wait_for_exact_linked_issue_receipt "$PR_NUM" "$EXPECTED_HEAD"

          # The receipt is useful only while every immutable fact still matches.
          CURRENT_MAIN_SHA=$(resolve_protected_main_sha)
          if [ "$CURRENT_MAIN_SHA" != "$PROTECTED_MAIN_SHA" ]; then
            echo "[ERROR] Protected main advanced after manifest receipt publication" >&2
            exit 1
          fi
          assert_exact_remote_manifest_ref "$EXPECTED_HEAD"
          assert_manifest_pr_head "$PR_NUM" "$EXPECTED_HEAD"
          assert_manifest_commit_parent "$EXPECTED_HEAD"
          assert_manifest_pr_diff "$EXPECTED_HEAD"
          FINAL_INVENTORY=$(mktemp)
          read_manifest_prs "$FINAL_INVENTORY"
          FINAL_ROW=$(select_owned_manifest_pr "$FINAL_INVENTORY")
          rm -f "$FINAL_INVENTORY"
          if [ "$FINAL_ROW" != "${PR_NUM}"$'\t'"${EXPECTED_HEAD}" ]; then
            echo "[ERROR] Manifest PR ownership changed after receipt publication" >&2
            exit 1
          fi
          gh pr merge "$PR_NUM" --repo "$GITHUB_REPOSITORY" \
            --squash --auto --delete-branch --match-head-commit "$EXPECTED_HEAD"
          echo "[OK] Manifest PR has an exact receipt and auto-merge is enabled"
