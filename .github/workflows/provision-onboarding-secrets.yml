---
name: Provision Onboarding Governance Secrets

on:
  pull_request:
    paths:
      - .github/workflows/provision-onboarding-secrets.yml
      - scripts/provision-onboarding-secrets.py
      - tests/test-provision-onboarding-secrets.py
  workflow_dispatch:
    inputs:
      repository:
        description: One enrolled repository name without its owner.
        required: true
        type: string
      dry_run:
        description: Preview missing names without writing secrets.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: provision-onboarding-governance-secrets-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:
  fixtures:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: managed-socketless
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify secret transport fixtures
        run: python3 tests/test-provision-onboarding-secrets.py

  provision:
    needs: fixtures
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'f5-sales-demo/docs-control' &&
      github.ref == 'refs/heads/main'
    environment: repository-settings
    runs-on: managed-socketless
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync the selected repository's governance secrets
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          REPO_SETTINGS_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          REPO_SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: >-
          python3 scripts/provision-onboarding-secrets.py
          --repository "$TARGET_REPOSITORY" --dry-run "$DRY_RUN"
