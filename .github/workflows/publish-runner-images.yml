name: Publish runner images

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-runner-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.profile }}
    runs-on: [self-hosted, Linux, X64, "${{ github.event.repository.name }}", container-build]
    permissions:
      contents: read # check out the runner image source
      packages: write # publish runner images to GHCR
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: ubuntu-24.04
            image: actions-runner
            base: docker.io/library/ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
            target: socketless
          - profile: ubuntu-22.04
            image: actions-runner
            base: docker.io/library/ubuntu@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f
            target: socketless
          - profile: container-build
            image: actions-runner-container
            base: docker.io/library/ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
            target: docker-capable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and publish immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/f5-sales-demo/${{ matrix.image }}
          PROFILE: ${{ matrix.profile }}
          UBUNTU_IMAGE: ${{ matrix.base }}
          TARGET: ${{ matrix.target }}
          DOCKER_CLI_IMAGE: docker.io/library/docker:29.7.2-cli@sha256:e650b7a58d7f56be91d4f7be799196380a3bbc1bcbc41f1f4dff1b36ac309e1e
        run: |
          set -euo pipefail
          tag="issue-1426-${PROFILE}"
          runner_root="${RUNNER_RUNTIME_DIR:?}"
          runner_temp="${RUNNER_TEMP:?}"
          case "$runner_temp" in
            "$runner_root"/*) ;;
            *) echo "runner temp escapes runner workspace" >&2; exit 1 ;;
          esac
          metadata_file="$(mktemp --tmpdir="$runner_temp")"
          auth_dir="$(mktemp -d --tmpdir="$runner_temp")"
          tools_dir="$(mktemp -d --tmpdir="$runner_temp")"
          plugins_dir="$tools_dir/cli-plugins"
          tools_container="f5-runner-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PROFILE}"
          cleanup() {
            docker container rm --force "$tools_container" >/dev/null 2>&1 || true
            rm -f "$metadata_file"
            rm -f "$auth_dir/config.json"
            rm -f "$tools_dir/docker"
            rm -f "$plugins_dir/docker-buildx" "$plugins_dir/docker-compose"
            rmdir "$plugins_dir"
            rmdir "$tools_dir"
            rmdir "$auth_dir"
          }
          trap cleanup EXIT
          mkdir "$plugins_dir"
          docker container rm --force "$tools_container" >/dev/null 2>&1 || true
          docker create \
            --name "$tools_container" \
            --volume "$runner_root:$runner_root:rw" \
            --entrypoint /bin/true \
            "$DOCKER_CLI_IMAGE" >/dev/null
          docker cp "$tools_container:/usr/local/bin/docker" "$tools_dir/docker"
          docker cp \
            "$tools_container:/usr/local/libexec/docker/cli-plugins/docker-buildx" \
            "$plugins_dir/docker-buildx"
          docker cp \
            "$tools_container:/usr/local/libexec/docker/cli-plugins/docker-compose" \
            "$plugins_dir/docker-compose"
          docker container rm "$tools_container" >/dev/null
          export PATH="$tools_dir:$PATH"
          test "$(docker version --format '{{.Client.Version}}')" = 29.7.2
          jq -n --arg plugins "$plugins_dir" \
            '{cliPluginsExtraDirs:[$plugins]}' > "$auth_dir/config.json"
          docker --config "$auth_dir" buildx version
          printf '%s' "$GHCR_TOKEN" | docker --config "$auth_dir" login \
            ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker --config "$auth_dir" buildx build \
            --build-arg "UBUNTU_IMAGE=${UBUNTU_IMAGE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --metadata-file "$metadata_file" \
            --platform linux/amd64 \
            --push \
            --tag "${IMAGE}:${tag}" \
            --target "$TARGET" \
            --file runner-images/Containerfile \
            .
          digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid published digest" >&2
            exit 1
          fi
          published="${IMAGE}@${digest}"
          registry_digest="sha256:$(docker buildx imagetools inspect --raw "$published" | sha256sum | cut -d' ' -f1)"
          if [[ "$registry_digest" != "$digest" ]]; then
            echo "published digest verification failed" >&2
            exit 1
          fi
          if [[ "$TARGET" == socketless ]]; then
            docker run --rm --entrypoint bash "$published" -c \
              'python3 -c "import yaml" && ! command -v docker'
          else
            socket_gid="$(stat -c '%g' /run/docker.sock)"
            docker run --rm --entrypoint bash \
              --group-add "$socket_gid" \
              --volume /run/docker.sock:/run/docker.sock:rw \
              "$published" -c \
              'python3 -c "import yaml" && docker version && docker buildx version && docker compose version'
          fi
          # shellcheck disable=SC2016
          printf '### %s\n\n`%s@%s`\n' "$PROFILE" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
