---
name: Super-Linter

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      rust_edition:
        description: Rust edition to format (none, 2018, 2021, or 2024)
        required: false
        type: string
        default: "2021"
      classify_xc_minimum_configs:
        description: Classify the provider's F5 XC minimum configs as non-Kubernetes YAML
        required: false
        type: boolean
        default: false

      socketless_runner_label:
        description: Policy-approved repository-scoped ARC socketless label
        required: false
        type: string
        default: 'managed-socketless'
      container_build_runner_label:
        description: Policy-approved repository-scoped ARC container-build label
        required: false
        type: string
        default: 'managed-container-build'
permissions: {}

concurrency:
  # A called workflow inherits github.workflow from its caller. Keep this
  # group distinct from caller-level groups or cancel-in-progress can cancel
  # the caller itself instead of only superseding an older lint invocation.
  group: reusable-super-linter-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trust-gate:
    name: Trust Docker-capable job
    runs-on: ${{ inputs.socketless_runner_label || 'managed-socketless' }}
    permissions: {}
    steps:
      - name: Reject untrusted or unsupported events
        env:
          CONTAINER_BUILD_RUNNER_LABEL: ${{ inputs.container_build_runner_label || 'managed-container-build' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          SOCKETLESS_RUNNER_LABEL: ${{ inputs.socketless_runner_label || 'managed-socketless' }}
        run: |
          set -euo pipefail
          if [[ -z "$SOCKETLESS_RUNNER_LABEL" || -z "$CONTAINER_BUILD_RUNNER_LABEL" ]]; then
            echo "::error::socketless_runner_label and container_build_runner_label must be supplied together"
            exit 1
          elif [[ ! "$SOCKETLESS_RUNNER_LABEL" =~ ^[a-z0-9][a-z0-9.-]*$ ]] ||
            [[ ! "$CONTAINER_BUILD_RUNNER_LABEL" =~ ^[a-z0-9][a-z0-9.-]*$ ]] ||
            [[ "$SOCKETLESS_RUNNER_LABEL" == "$CONTAINER_BUILD_RUNNER_LABEL" ]]; then
            echo "::error::ARC runner labels must be distinct safe scalar labels"
            exit 1
          fi
          case "$EVENT_NAME" in
            pull_request)
              if [[ -z "$HEAD_REPOSITORY" || "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
                echo "::error::Docker-capable lint is forbidden for fork pull requests."
                exit 1
              fi
              ;;
            workflow_dispatch) ;;
            *)
              echo "::error::Docker-capable lint requires a same-repository PR or manual dispatch."
              exit 1
              ;;
          esac

  lint:
    name: Lint Code Base
    needs: trust-gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ inputs.container_build_runner_label || 'managed-container-build' }}
    # Scoped to what the linter needs: read code/packages, write commit statuses
    # and PR annotations. The shell-unit-tests job below gets contents:read only.
    permissions:
      contents: read
      packages: read # pull the pinned Super-Linter container image
      statuses: write # publish the lint status context
      pull-requests: write # annotate pull requests with lint findings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This scanner is managed and synced verbatim. Enforce its portability
      # where it is authored; checking a downstream caller's stale copy blocks
      # an unrelated PR with a file that repository is forbidden to edit. The
      # three canonical widths still guard every Ruff configuration in the fleet.
      - name: Check managed PII scanner lint at 88 columns
        if: github.repository == 'f5-sales-demo/docs-control' && hashFiles('scripts/check_pii.py') != ''
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: check --config=line-length=88
          src: scripts/check_pii.py

      - name: Check managed PII scanner lint at 100 columns
        if: github.repository == 'f5-sales-demo/docs-control' && hashFiles('scripts/check_pii.py') != ''
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: check --config=line-length=100
          src: scripts/check_pii.py

      - name: Check managed PII scanner lint at 120 columns
        if: github.repository == 'f5-sales-demo/docs-control' && hashFiles('scripts/check_pii.py') != ''
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: check --config=line-length=120
          src: scripts/check_pii.py

      - name: Check managed PII scanner format at 88 columns
        if: github.repository == 'f5-sales-demo/docs-control' && hashFiles('scripts/check_pii.py') != ''
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: format --check --config=line-length=88
          src: scripts/check_pii.py

      - name: Check managed PII scanner format at 100 columns
        if: github.repository == 'f5-sales-demo/docs-control' && hashFiles('scripts/check_pii.py') != ''
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: format --check --config=line-length=100
          src: scripts/check_pii.py

      - name: Check managed PII scanner format at 120 columns
        if: github.repository == 'f5-sales-demo/docs-control' && hashFiles('scripts/check_pii.py') != ''
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: format --check --config=line-length=120
          src: scripts/check_pii.py

      # Deterministic portability guard, run natively on the runner (Super-Linter
      # cannot see git object modes from inside its container). Cheap and first, so
      # a committed absolute symlink or hardcoded home directory fails fast.
      #
      # Runs the CANONICAL copy of the script (docs-control main) against the HEAD
      # working tree. Never execute a privileged gate from the untrusted PR head:
      #   1. This job holds statuses:write and pull-requests:write, so executing a
      #      PR's own copy of the script would hand those scopes to PR-authored code.
      #   2. Gating on the head's copy would let a PR delete the file to skip the
      #      gate entirely.
      # The script only reads git metadata and tracked file contents, so trusted
      # logic over untrusted data is safe.
      #
      # Canonical rather than this repo's default branch: the default branch is a sync
      # target and can lag docs-control, in which case the pull request carrying the
      # fix is blocked by the stale copy it would replace (issue #815). Whether the
      # script applies here is still decided by the default branch carrying it, so the
      # skip_files opt-out is unchanged; absent there, nothing to enforce.
      - name: Check repository hygiene
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          script=scripts/check-repo-hygiene.sh
          branch="${DEFAULT_BRANCH:-main}"
          git fetch --no-tags --quiet origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          # Opt-out is still "the repo does not carry the script" (skip_files), unchanged.
          if ! git cat-file -e "origin/${branch}:${script}" 2>/dev/null; then
            echo "The default branch does not carry ${script} yet; nothing to enforce."
            exit 0
          fi
          # Execute the CANONICAL bytes, not this repo's copy. A downstream default
          # branch is a sync target and can lag docs-control, and a pull request that
          # would deliver the fix could never pass the stale gate it replaces — that is
          # what stranded i18n-core (issue #815). Still never the head's copy.
          remote="${GOVERNANCE_REMOTE:-https://github.com/f5-sales-demo/docs-control}"
          # Fetch into a throwaway repository, never this workspace. A --depth=1 fetch
          # into the checkout writes .git/shallow, which breaks Super-Linter's
          # GIT_MERGE_BASE calculation and fails the whole job; and it would clobber
          # FETCH_HEAD for anything else in the workspace.
          gov_dir=$(mktemp -d)
          trap 'rm -rf "$gov_dir"' EXIT
          git init --quiet "$gov_dir"
          if ! git -C "$gov_dir" fetch --no-tags --quiet --depth=1 "$remote" main 2>/dev/null; then
            echo "::error::cannot reach canonical governance at ${remote} -- refusing to run a stale gate"
            exit 1
          fi
          canonical_sha=$(git -C "$gov_dir" rev-parse FETCH_HEAD)
          if ! git -C "$gov_dir" cat-file -e "${canonical_sha}:${script}" 2>/dev/null; then
            # Absent from canonical. Distinguish a deliberate retirement from an
            # accident by asking canonical's own manifest, not this repo's copy of the
            # script: the sync only ever adds and updates blobs, never deletes them, so
            # a retired script lingers downstream forever and cannot be used as the
            # signal. Retirement = drop the managed_files entry; the orphaned
            # downstream copy is then simply unmanaged.
            manifest=$(git -C "$gov_dir" show "${canonical_sha}:.github/config/repo-settings.json" 2>/dev/null || true)
            # Require a well-formed manifest before believing "retired". Absent or
            # malformed managed_files must not read as an empty list, or a schema
            # migration or partial merge would silently stand the gate down.
            if ! printf '%s' "$manifest" | jq -e '.managed_files.files | type == "array"' >/dev/null 2>&1; then
              echo "::error::cannot read managed_files from canonical governance @ ${canonical_sha} -- refusing to guess whether ${script} was retired"
              exit 1
            fi
            if printf '%s' "$manifest" |
              jq -e --arg s "$script" '[.managed_files.files[].dest] | index($s) == null' >/dev/null 2>&1; then
              echo "${script} has been retired from canonical governance; nothing to enforce."
              exit 0
            fi
            echo "::error::${script} is still listed in canonical managed_files but missing from canonical governance @ ${canonical_sha} -- refusing to pass an unenforced gate. Retire it by removing its managed_files entry."
            exit 1
          fi
          # Log the exact commit whose bytes run, so a run is reproducible and any
          # behaviour change is attributable to a specific governance commit.
          echo "Enforcing ${script} from canonical governance @ ${canonical_sha}"
          git -C "$gov_dir" show "${canonical_sha}:${script}" | bash -s

      # Same trust boundary and same canonical source as the step above: never the
      # head's own copy, and never a possibly-stale local copy. Repositories that opt
      # out of this script via skip_files simply have nothing to enforce.
      - name: Check for hardcoded locale lists
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          script=scripts/locale-lint.sh
          branch="${DEFAULT_BRANCH:-main}"
          git fetch --no-tags --quiet origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          # Opt-out is still "the repo does not carry the script" (skip_files), unchanged.
          if ! git cat-file -e "origin/${branch}:${script}" 2>/dev/null; then
            echo "The default branch does not carry ${script}; nothing to enforce."
            exit 0
          fi
          # Execute the CANONICAL bytes, not this repo's copy. A downstream default
          # branch is a sync target and can lag docs-control, and a pull request that
          # would deliver the fix could never pass the stale gate it replaces — that is
          # what stranded i18n-core (issue #815). Still never the head's copy.
          remote="${GOVERNANCE_REMOTE:-https://github.com/f5-sales-demo/docs-control}"
          # Fetch into a throwaway repository, never this workspace. A --depth=1 fetch
          # into the checkout writes .git/shallow, which breaks Super-Linter's
          # GIT_MERGE_BASE calculation and fails the whole job; and it would clobber
          # FETCH_HEAD for anything else in the workspace.
          gov_dir=$(mktemp -d)
          trap 'rm -rf "$gov_dir"' EXIT
          git init --quiet "$gov_dir"
          if ! git -C "$gov_dir" fetch --no-tags --quiet --depth=1 "$remote" main 2>/dev/null; then
            echo "::error::cannot reach canonical governance at ${remote} -- refusing to run a stale gate"
            exit 1
          fi
          canonical_sha=$(git -C "$gov_dir" rev-parse FETCH_HEAD)
          if ! git -C "$gov_dir" cat-file -e "${canonical_sha}:${script}" 2>/dev/null; then
            # Absent from canonical. Distinguish a deliberate retirement from an
            # accident by asking canonical's own manifest, not this repo's copy of the
            # script: the sync only ever adds and updates blobs, never deletes them, so
            # a retired script lingers downstream forever and cannot be used as the
            # signal. Retirement = drop the managed_files entry; the orphaned
            # downstream copy is then simply unmanaged.
            manifest=$(git -C "$gov_dir" show "${canonical_sha}:.github/config/repo-settings.json" 2>/dev/null || true)
            # Require a well-formed manifest before believing "retired". Absent or
            # malformed managed_files must not read as an empty list, or a schema
            # migration or partial merge would silently stand the gate down.
            if ! printf '%s' "$manifest" | jq -e '.managed_files.files | type == "array"' >/dev/null 2>&1; then
              echo "::error::cannot read managed_files from canonical governance @ ${canonical_sha} -- refusing to guess whether ${script} was retired"
              exit 1
            fi
            if printf '%s' "$manifest" |
              jq -e --arg s "$script" '[.managed_files.files[].dest] | index($s) == null' >/dev/null 2>&1; then
              echo "${script} has been retired from canonical governance; nothing to enforce."
              exit 0
            fi
            echo "::error::${script} is still listed in canonical managed_files but missing from canonical governance @ ${canonical_sha} -- refusing to pass an unenforced gate. Retire it by removing its managed_files entry."
            exit 1
          fi
          # Log the exact commit whose bytes run, so a run is reproducible and any
          # behaviour change is attributable to a specific governance commit.
          echo "Enforcing ${script} from canonical governance @ ${canonical_sha}"
          git -C "$gov_dir" show "${canonical_sha}:${script}" | bash -s

      # Biome runs OUTSIDE the Super-Linter container so its exact version is
      # independent of the Super-Linter container release cadence. Authority
      # boundary: setup-biome owns JS/TS/JSON/JSX; the
      # Super-Linter step below runs everything else with VALIDATE_BIOME_*
      # disabled. Step order matters: if Biome fails, Super-Linter is skipped
      # (default fail-fast, no `if: always()`) so developers get a focused log.
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.6

      - name: Run Biome
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          # Keep this gate scoped to the pull request: existing Biome findings
          # outside a change must not fail unrelated work. NUL delimiters retain
          # exact path names through Git, the filter, and Biome's argv.
          mapfile -d '' -t biome_files < <(
            git diff --name-only -z --diff-filter=ACMR "origin/${BASE_REF}...HEAD" |
              while IFS= read -r -d '' path; do
                case "$path" in
                  node_modules/*|.terraform/*|dist/*|build/*|vendor/*)
                    ;;
                  *.js|*.jsx|*.ts|*.tsx|*.json|*.jsonc|*.css|*.vue)
                    printf '%s\0' "$path"
                    ;;
                esac
              done
          )
          if ((${#biome_files[@]})); then
            # A repository's native Biome configuration may intentionally ignore
            # every changed candidate. That is a valid scoped result, not a lint
            # failure; non-ignored candidates are still checked normally.
            biome ci --no-errors-on-unmatched -- "${biome_files[@]}"
          else
            echo "No changed biome-eligible files found — skipping"
          fi

      # MDX prose runs OUTSIDE the Super-Linter container for the same reason
      # Biome does: the container cannot own it. Super-Linter v8.7.0 routes only
      # the `md` extension into MARKDOWN and NATURAL_LANGUAGE, so a repository
      # whose documentation is .mdx passed this gate with no linter having opened
      # a file (docs-control#847). Scoped to changed files to match
      # VALIDATE_ALL_CODEBASE=false below, so a pull request is judged on the
      # pages it touches.
      - name: Lint MDX prose
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ -f scripts/lint-mdx-prose.sh ]; then
            bash scripts/lint-mdx-prose.sh --changed "origin/${BASE_REF}"
          else
            echo "scripts/lint-mdx-prose.sh not present in this repository — skipping"
          fi

      - name: Validate Rust edition input
        env:
          RUST_EDITION: ${{ inputs.rust_edition || 'none' }}
        run: |
          case "$RUST_EDITION" in
            none|2018|2021|2024) ;;
            *)
              echo "::error::rust_edition must be one of: none, 2018, 2021, 2024"
              exit 1
              ;;
          esac

          # Super-Linter rejects a mix of explicit true (include mode) and
          # false (exclude mode) VALIDATE_* settings. This workflow already
          # excludes unrelated validators, so leave the selected Rust edition
          # unset and dynamically exclude every other edition. `none` excludes
          # them all.
          for edition in 2015 2018 2021 2024; do
            if [ "$RUST_EDITION" != "$edition" ]; then
              echo "VALIDATE_RUST_${edition}=false" >> "$GITHUB_ENV"
            fi
          done

      # Super-Linter v8.7.0's bundled actionlint can deadlock while analyzing
      # the large managed sync workflow. Run actionlint 1.7.12 directly from
      # the immutable container-build runner image.
      - name: Run native actionlint
        run: |
          set -euo pipefail
          actionlint -config-file .github/actionlint.yaml

      - name: Start Super-Linter profiler
        id: super_linter_profile_start
        continue-on-error: true
        env:
          SUPER_LINTER_IMAGE: ghcr.io/super-linter/super-linter:v8.7.0
          SUPER_LINTER_DIGEST: sha256:c05768164eed53bac7c82aade7a14a76955206d4962cd41be97118db96fa5996
        run: |
          set -euo pipefail
          profile_dir="$RUNNER_TEMP/workload-profile-super-linter"
          rm -rf -- "$profile_dir"
          install -d -m 0700 "$profile_dir"
          RUNNER_TRACKING_ID='' docker-action-profile \
            --name super-linter \
            --image "$SUPER_LINTER_IMAGE" \
            --expected-digest "$SUPER_LINTER_DIGEST" \
            --output "$profile_dir/profile.json" \
            --ready-file "$profile_dir/ready" \
            --pid-file "$profile_dir/pid" \
            --variant instrumentation \
            --pair-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}" \
            >/dev/null 2>"$profile_dir/profiler.stderr" &
          profiler_pid=$!
          printf '%s\n' "$profiler_pid" >"$profile_dir/launcher.pid"
          for _ in $(seq 1 100); do
            if [[ -f "$profile_dir/ready" ]]; then
              exit 0
            fi
            if ! kill -0 "$profiler_pid" 2>/dev/null; then
              wait "$profiler_pid"
              exit $?
            fi
            sleep 0.1
          done
          kill -TERM "$profiler_pid" 2>/dev/null || true
          echo "::error::Super-Linter profiler did not become ready"
          exit 1

      - name: Run Super-Linter
        id: super_linter
        continue-on-error: true
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: main
          # Redirect Python tool caches out of $GITHUB_WORKSPACE so
          # TRIVY's filesystem walker never sees them. TRIVY 0.69.3
          # lstat()s entries BEFORE consulting skip-dirs, so dangling
          # .mypy_cache/missing_stubs symlinks crash the scan
          # regardless of trivy.yaml config. See #379 (follow-up to #378).
          MYPY_CACHE_DIR: /tmp/mypy_cache
          RUFF_CACHE_DIR: /tmp/ruff_cache
          PYTEST_ADDOPTS: --cache-dir=/tmp/pytest_cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable Biome in Super-Linter — handled by the biomejs/setup-biome
          # step above, which runs the pinned Biome version instead of the
          # container's bundled version. Authority boundary: setup-biome owns JS/TS/JSON/JSX;
          # Super-Linter retains everything else.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          LINTER_RULES_PATH: "."
          # The pinned native actionlint step owns GitHub Actions validation.
          # Keep the config path explicit for contract auditing, but disable
          # Super-Linter's regressed bundled actionlint below.
          GITHUB_ACTIONS_CONFIG_FILE: .github/actionlint.yaml
          VALIDATE_GITHUB_ACTIONS: false
          # F5 XC API objects also use top-level apiVersion and kind fields.
          # Super-Linter otherwise misclassifies their native YAML sources as
          # Kubernetes. Limit this option to Kubeconform so YAML and security
          # validators still inspect every minimum configuration. Super-Linter
          # reparses validator options through bash -c, so keep this regex free
          # of shell metacharacters.
          KUBERNETES_KUBECONFORM_OPTIONS: ${{ inputs.classify_xc_minimum_configs && '-ignore-filename-pattern=tools/minimum-configs/' || '' }}
          # tree-sitter-<grammar>/src/{parser,scanner}.c are either machine-
          # generated (parser.c from `tree-sitter generate`) or hand-written
          # to upstream tree-sitter conventions that do not match
          # clang-format's default style; excluding preserves fork fidelity.
          FILTER_REGEX_EXCLUDE: "(dist/|build/|release/|vendor/|tree-sitter-[^/]+/src/(parser|scanner)\\.(c|h)$|docs/(fr|es|de|ja|pt-br|ko|zh-cn|zh-tw|ar|it|hi|th)/|src/i18n/.*translations)"
          # Disable Prettier — Biome handles formatting for
          # JS/TS/JSON/CSS/HTML/GraphQL/JSX/Vue; yamllint handles
          # YAML; markdownlint handles Markdown.
          VALIDATE_CSS_PRETTIER: false
          VALIDATE_GRAPHQL_PRETTIER: false
          VALIDATE_HTML_PRETTIER: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_JSONC_PRETTIER: false
          VALIDATE_JSX_PRETTIER: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_VUE_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
          # Disable ESLint — Biome handles linting for
          # JS/TS/JSON/JSX/Vue; super-linter cannot run
          # type-aware ESLint (no npm ci / tsconfig).
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JSON: false
          VALIDATE_JSONC: false
          VALIDATE_JSX: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TSX: false
          VALIDATE_VUE: false
          # Disable Stylelint — Biome handles CSS linting
          VALIDATE_CSS: false
          # Disable pre-commit — cannot execute inside super-linter container
          VALIDATE_PRE_COMMIT: false
          # Pass SC2016 exclusion to shellcheck via env so actionlint's
          # embedded shellcheck also skips it (.shellcheckrc only works
          # for the direct BASH linter, not actionlint's subprocess)
          SHELLCHECK_OPTS: "-e SC2016"
          # Explicit config file name — super-linter v8 defaults to
          # .yamllint.yml but our managed config uses .yamllint.yaml
          YAML_YAMLLINT_CONFIG_FILE: .yamllint.yaml
          # Without an explicit config file, Super-Linter's JSCPD uses its
          # bundled default and IGNORES the repo .jscpd.json (so the ignore /
          # threshold never apply). Point it at the managed repo config.
          # Filename only — a full path triggers the doubled-slash
          # "rules file doesn't exist" bug (super-linter #6734).
          JSCPD_CONFIG_FILE: .jscpd.json
          # Point Trivy at our governance config (skip-dirs for
          # .mypy_cache, .ruff_cache, .pytest_cache so the fs walker
          # doesn't hit dangling symlinks mid-run). See issue #377.
          TRIVY_CONFIG_FILE: trivy.yaml
          SAVE_SUPER_LINTER_SUMMARY: false
          # Successful runs retain warnings and errors while omitting verbose
          # per-validator success output. Failure diagnostics remain complete.
          SUPPRESS_OUTPUT_ON_SUCCESS: true
          VALIDATE_ALL_CODEBASE: false
          # No commitlint config exists in managed repos
          VALIDATE_GIT_COMMITLINT: false
          # ── Python linters ─────────────────────────────────
          # Ruff: comprehensive lint + format (extends pyproject.toml).
          # Pylint: complexity/design checks. Mypy: type checking.
          # Black, Flake8, isort disabled (Ruff is a superset).
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          PYTHON_RUFF_CONFIG_FILE: .ruff.toml
          PYTHON_RUFF_FORMAT_CONFIG_FILE: .ruff.toml
          PYTHON_PYLINT_CONFIG_FILE: .python-lint
          PYTHON_MYPY_CONFIG_FILE: .mypy.ini
          # ── OpenAPI / Spectral ──────────────────────────────
          # Disabled — super-linter's Docker container can't resolve
          # repo-specific .spectral.yaml paths. Handled by the
          # dedicated Spectral step below (runs natively on runner).
          VALIDATE_OPENAPI: false
          # ── Validators irrelevant to this ecosystem's language mix ──
          # PowerShell: no .ps1 files in any governed repo.
          VALIDATE_POWERSHELL: false
          # Standalone HTML: repos are Astro/Starlight-based; generated
          # HTML is a build artifact, not source.
          VALIDATE_HTML: false
          # CPP (cpplint): overlaps with CLANG_FORMAT; clang-format is
          # the ecosystem's chosen C/C++ style enforcer and has been
          # tuned per-repo (e.g., .clang-format-ignore in xcsh).
          VALIDATE_CPP: false
          VALIDATE_CPP_EPA: false

          # Dockerfile hadolint: overlaps with CHECKOV for dockerfile
          # security scanning; running both is redundant noise.
          VALIDATE_DOCKERFILE_HADOLINT: false
          # BASH_EXEC (shebang + exec bit): repos carry node-style
          # shebangs on .ts entrypoints and intentionally lack +x
          # (invoked via `bun run ...`); this validator flags non-issues.
          VALIDATE_BASH_EXEC: false
          # EDITORCONFIG (super-linter's built-in validator): we already
          # run editorconfig-checker per-repo via the managed config.
          # The super-linter built-in duplicates that check with stricter
          # default behaviour that flags legitimate fork indentation.
          VALIDATE_EDITORCONFIG: false
          # PROTOBUF: governed repos may carry third-party proto files
          # (e.g., xcsh's Cursor protobuf imports under packages/ai/src/
          # providers/cursor/proto/) whose layout is fork-faithful.
          VALIDATE_PROTOBUF: false
          # GO: super-linter runs golangci-lint per-file, but Go's type
          # checker requires all files in a package. Repos with Go code
          # run golangci-lint correctly in their own CI jobs.
          VALIDATE_GO: false
          VALIDATE_GO_MODULES: false
          VALIDATE_GO_REVIVE: false

      - name: Finalize Super-Linter profile
        id: super_linter_profile
        if: always()
        continue-on-error: true
        env:
          SUPER_LINTER_OUTCOME: ${{ steps.super_linter.outcome }}
          SUPER_LINTER_DIGEST: sha256:c05768164eed53bac7c82aade7a14a76955206d4962cd41be97118db96fa5996
        run: |
          set -euo pipefail
          profile_dir="$RUNNER_TEMP/workload-profile-super-linter"
          profile="$profile_dir/profile.json"
          schema=/usr/local/share/runner-profile/docker-action-profile.schema.json
          if [[ -r "$profile_dir/launcher.pid" ]]; then
            read -r profiler_pid <"$profile_dir/launcher.pid"
            for _ in $(seq 1 150); do
              [[ -s "$profile" ]] && break
              kill -0 "$profiler_pid" 2>/dev/null || break
              sleep 0.1
            done
            if [[ ! -s "$profile" ]] && kill -0 "$profiler_pid" 2>/dev/null; then
              kill -TERM "$profiler_pid" 2>/dev/null || true
              for _ in $(seq 1 50); do
                [[ -s "$profile" ]] && break
                sleep 0.1
              done
            fi
          fi
          if [[ ! -s "$profile" ]]; then
            echo "::error::Super-Linter profiler did not produce an artifact"
            exit 1
          fi
          node - "$profile" "$schema" "$SUPER_LINTER_OUTCOME" "$SUPER_LINTER_DIGEST" <<'NODE'
          const fs = require('fs');
          const Ajv2020 = require('/opt/spectral/node_modules/ajv/dist/2020').default;
          const addFormats = require('/opt/spectral/node_modules/ajv-formats').default;
          const [profilePath, schemaPath, actionOutcome, expectedDigest] = process.argv.slice(2);
          const profile = JSON.parse(fs.readFileSync(profilePath, 'utf8'));
          const schema = JSON.parse(fs.readFileSync(schemaPath, 'utf8'));
          const ajv = new Ajv2020({allErrors: true, strict: true});
          addFormats(ajv);
          if (!ajv.validate(schema, profile)) {
            throw new Error(`invalid Docker profile: ${ajv.errorsText(ajv.errors)}`);
          }
          if (profile.image.digest !== expectedDigest) {
            throw new Error('profiled image digest does not match the pinned Super-Linter image');
          }
          if (actionOutcome === 'success' || actionOutcome === 'failure') {
            if (profile.observer.result !== 'completed') {
              throw new Error(`profiler did not observe action completion: ${profile.observer.result}`);
            }
            if (actionOutcome === 'success' && profile.exit.code !== 0) {
              throw new Error('successful action has a nonzero profiled exit code');
            }
            if (actionOutcome === 'failure' && !(profile.exit.code > 0)) {
              throw new Error('failed action lacks a nonzero profiled exit code');
            }
          }
          NODE

      - name: Upload Super-Linter profile
        id: super_linter_profile_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-profile-super-linter
          path: ${{ runner.temp }}/workload-profile-super-linter/profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve Super-Linter conclusion
        if: always()
        env:
          PROFILE_START_OUTCOME: ${{ steps.super_linter_profile_start.outcome }}
          SUPER_LINTER_OUTCOME: ${{ steps.super_linter.outcome }}
          PROFILE_FINALIZE_OUTCOME: ${{ steps.super_linter_profile.outcome }}
          PROFILE_UPLOAD_OUTCOME: ${{ steps.super_linter_profile_upload.outcome }}
        run: |
          if [[ "$PROFILE_START_OUTCOME" != success ||
            "$SUPER_LINTER_OUTCOME" != success ||
            "$PROFILE_FINALIZE_OUTCOME" != success ||
            "$PROFILE_UPLOAD_OUTCOME" != success ]]; then
            echo "::error::Super-Linter or its required profiling evidence failed"
            exit 1
          fi

      # Spectral is immutable in the container-build runner image. Running it
      # natively avoids a second Docker action image while retaining the
      # repository ruleset, JSON/YAML coverage, GitHub annotations, and
      # error-level failure semantics of the retired container action.
      - name: Run native Spectral OpenAPI lint
        id: spectral
        if: hashFiles('.spectral.yaml', '.spectral.yml') != ''
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ -f .spectral.yaml ]]; then
            ruleset=.spectral.yaml
          elif [[ -f .spectral.yml ]]; then
            ruleset=.spectral.yml
          else
            echo "::error::Spectral ruleset disappeared after workflow evaluation"
            exit 1
          fi
          if [[ "$(spectral --version)" != "6.16.3" ]]; then
            echo "::error::runner Spectral version does not match immutable 6.16.3 contract"
            exit 1
          fi
          candidate_manifest="$RUNNER_TEMP/spectral-candidates"
          target_manifest="$RUNNER_TEMP/spectral-targets"
          git ls-files -z -- '*.json' '*.yaml' '*.yml' >"$candidate_manifest"
          # BEGIN OPENAPI DISCOVERY
          python3 - "$candidate_manifest" "$target_manifest" <<'PYDISCOVERY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          import yaml

          candidate_manifest = Path(sys.argv[1])
          target_manifest = Path(sys.argv[2])
          candidates = [
              os.fsdecode(path)
              for path in candidate_manifest.read_bytes().split(b"\0")
              if path
          ]
          json_marker = re.compile(
              rb'(?m)(?:\A\{[ \t\r\n]*|^[ \t]*)"(?:openapi|swagger)"[ \t]*:'
          )
          yaml_marker = re.compile(rb'(?m)^(?:openapi|swagger)[ \t]*:')
          targets = []
          for candidate in candidates:
              path = Path(candidate)
              if path.is_symlink() or not path.is_file():
                  print(
                      f"tracked Spectral candidate is not a regular file: {candidate!r}",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)
              raw = path.read_bytes()
              is_json = path.suffix.lower() == ".json"
              marker = json_marker if is_json else yaml_marker
              if marker.search(raw) is None:
                  continue
              try:
                  document = json.loads(raw) if is_json else yaml.safe_load(raw)
              except (UnicodeDecodeError, json.JSONDecodeError, yaml.YAMLError) as error:
                  print(
                      f"cannot parse potential OpenAPI document {candidate!r}: "
                      f"{type(error).__name__}",
                      file=sys.stderr,
                  )
                  raise SystemExit(1) from error
              if isinstance(document, dict) and (
                  "openapi" in document or "swagger" in document
              ):
                  targets.append(os.fsencode(candidate))

          with target_manifest.open("wb") as output:
              for target in targets:
                  output.write(target + b"\0")
          PYDISCOVERY
          # END OPENAPI DISCOVERY
          mapfile -d '' -t spectral_files <"$target_manifest"
          echo "Discovered ${#spectral_files[@]} tracked OpenAPI document(s)"
          if ((${#spectral_files[@]})); then
            spectral_command=(
              spectral lint
              --ruleset "$ruleset"
              --format github-actions
              --fail-severity error
              --
              "${spectral_files[@]}"
            )
          else
            spectral_command=(bash -c 'echo "No tracked OpenAPI documents require Spectral linting."')
          fi
          profile_dir="$RUNNER_TEMP/workload-profile-spectral"
          rm -rf -- "$profile_dir"
          install -d -m 0700 "$profile_dir"
          runner-profile \
            --name spectral \
            --output "$profile_dir/profile.json" \
            --cache-state warm \
            --variant native-spectral-suppressed \
            --pair-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}" \
            -- "${spectral_command[@]}"

      - name: Validate Spectral profile
        id: spectral_profile
        if: always() && hashFiles('.spectral.yaml', '.spectral.yml') != ''
        continue-on-error: true
        env:
          SPECTRAL_OUTCOME: ${{ steps.spectral.outcome }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/workload-profile-spectral/profile.json"
          schema=/usr/local/share/runner-profile/workload-profile.schema.json
          if [[ ! -s "$profile" ]]; then
            echo "::error::Spectral profiler did not produce an artifact"
            exit 1
          fi
          node - "$profile" "$schema" "$SPECTRAL_OUTCOME" <<'NODE'
          const fs = require('fs');
          const Ajv2020 = require('/opt/spectral/node_modules/ajv/dist/2020').default;
          const addFormats = require('/opt/spectral/node_modules/ajv-formats').default;
          const [profilePath, schemaPath, spectralOutcome] = process.argv.slice(2);
          const profile = JSON.parse(fs.readFileSync(profilePath, 'utf8'));
          const schema = JSON.parse(fs.readFileSync(schemaPath, 'utf8'));
          const ajv = new Ajv2020({allErrors: true, strict: true});
          addFormats(ajv);
          if (!ajv.validate(schema, profile)) {
            throw new Error(`invalid Spectral profile: ${ajv.errorsText(ajv.errors)}`);
          }
          if (profile.phase !== 'spectral' || profile.variant !== 'native-spectral-suppressed') {
            throw new Error('Spectral profile identity does not match the workflow contract');
          }
          if (spectralOutcome === 'success' && profile.exit.code !== 0) {
            throw new Error('successful Spectral step has a nonzero profiled exit code');
          }
          if (spectralOutcome === 'failure' && !(profile.exit.code > 0)) {
            throw new Error('failed Spectral step lacks a nonzero profiled exit code');
          }
          NODE

      - name: Upload Spectral profile
        id: spectral_profile_upload
        if: always() && hashFiles('.spectral.yaml', '.spectral.yml') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-profile-spectral
          path: ${{ runner.temp }}/workload-profile-spectral/profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve Spectral conclusion
        if: always() && hashFiles('.spectral.yaml', '.spectral.yml') != ''
        env:
          SPECTRAL_OUTCOME: ${{ steps.spectral.outcome }}
          PROFILE_OUTCOME: ${{ steps.spectral_profile.outcome }}
          PROFILE_UPLOAD_OUTCOME: ${{ steps.spectral_profile_upload.outcome }}
        run: |
          if [[ "$SPECTRAL_OUTCOME" != success ||
            "$PROFILE_OUTCOME" != success ||
            "$PROFILE_UPLOAD_OUTCOME" != success ]]; then
            echo "::error::Spectral or its required profiling evidence failed"
            exit 1
          fi

  shell-unit-tests:
    name: Shell Unit Tests
    runs-on: ${{ inputs.socketless_runner_label || 'managed-socketless' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These tests guard docs-control's own fleet-sync machinery. They
      # live only in docs-control; consumer repos that pin this workflow
      # via `workflow_call` do not carry the scripts. Each step has its
      # OWN hashFiles guard so partial file presence (e.g. a consumer
      # that inherited one script via an older governance sync) doesn't
      # admit the step and fail on the missing sibling. A multi-file
      # hashFiles('a','b','c') is OR, not AND — hence per-step guards.
      - name: Run fetch-governed test
        if: hashFiles('tests/test-fetch-governed.sh') != ''
        run: bash tests/test-fetch-governed.sh

      - name: Run central fleet reconciler test
        if: hashFiles('tests/test-fleet-reconciler.sh') != ''
        run: bash tests/test-fleet-reconciler.sh

      - name: Run pr-author-trusted gate test
        if: hashFiles('tests/test-pr-author-trusted.sh') != ''
        run: bash tests/test-pr-author-trusted.sh

      - name: Run protect-managed-files hook test
        if: hashFiles('tests/test-protect-managed-files.sh') != ''
        run: bash tests/test-protect-managed-files.sh

      - name: Run managed agent-guidance test
        if: hashFiles('tests/test-agent-guidance.sh') != ''
        run: bash tests/test-agent-guidance.sh

      - name: Run linter-configs test
        if: hashFiles('tests/test-linter-configs.sh') != ''
        run: bash tests/test-linter-configs.sh

      - name: Run Super-Linter profile contract test
        if: hashFiles('tests/test-super-linter-profile.sh') != ''
        run: bash tests/test-super-linter-profile.sh

      - name: Setup uv for workflow-security integration
        if: hashFiles('tests/test-workflow-security-validator-integration.sh') != ''
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.8.24"

      - name: Run workflow-security validator integration test
        if: hashFiles('tests/test-workflow-security-validator-integration.sh') != ''
        run: bash tests/test-workflow-security-validator-integration.sh

      - name: Run runner auditor portability test
        if: hashFiles('tests/test-runner-auditor-portability.sh') != ''
        run: bash tests/test-runner-auditor-portability.sh

      - name: Run runner tool-cache test
        if: hashFiles('tests/test-runner-tool-cache.sh') != ''
        run: bash tests/test-runner-tool-cache.sh

      - name: Run runner fleet Python unit tests
        if: hashFiles('tests/test_ephemeral_runner_controller.py') != ''
        run: |
          python3 -m unittest \
            tests/test_audit_runner_workflows.py \
            tests/test_ephemeral_runner_controller.py \
            tests/test_fleet_runner_dispatch.py \
            tests/test_provision_ephemeral_runners.py \
            tests/test_workflow_security_validator.py

      - name: Run backlog consolidation verifier tests
        if: hashFiles('tests/test-backlog-consolidation.sh') != ''
        run: bash tests/test-backlog-consolidation.sh

      - name: Run consumer shell-test selector test
        if: hashFiles('tests/test-consumer-shell-tests.sh') != ''
        run: bash tests/test-consumer-shell-tests.sh

      - name: Run governed workflow pin test
        if: hashFiles('tests/test-governed-workflow-pins.sh') != ''
        run: bash tests/test-governed-workflow-pins.sh


      - name: Run review-layer-routing test
        if: hashFiles('tests/test-review-layer-routing.sh') != ''
        run: bash tests/test-review-layer-routing.sh

      - name: Run translation-suspension test
        if: hashFiles('tests/test-translation-suspension.sh') != ''
        run: bash tests/test-translation-suspension.sh

      - name: Run Antigravity suspension test
        if: hashFiles('tests/test-antigravity-suspension.sh') != ''
        run: bash tests/test-antigravity-suspension.sh

      - name: Run Antigravity pre-push review test
        if: hashFiles('tests/test-agy-pre-push-review.sh') != ''
        run: bash tests/test-agy-pre-push-review.sh

      - name: Run translation release-policy test
        if: hashFiles('tests/test-translation-release-policy.sh') != ''
        run: bash tests/test-translation-release-policy.sh

      - name: Run deterministic translation-validator test
        if: hashFiles('tests/test-validate-translations.sh') != ''
        run: bash tests/test-validate-translations.sh

      - name: Run Antigravity live-control verifier test
        if: hashFiles('tests/test-verify-antigravity-controls.sh') != ''
        run: bash tests/test-verify-antigravity-controls.sh

      - name: Run GitHub API resilience test
        if: hashFiles('tests/test-github-api-resilience.sh') != ''
        run: bash tests/test-github-api-resilience.sh

      - name: Run locale-lint test
        if: hashFiles('tests/test-locale-lint.sh') != ''
        run: bash tests/test-locale-lint.sh

      - name: Run governed-script source test
        if: hashFiles('tests/test-governed-script-source.sh') != ''
        run: bash tests/test-governed-script-source.sh

      - name: Run fleet pre-flight test
        if: hashFiles('tests/test-preflight-fleet.sh') != ''
        run: bash tests/test-preflight-fleet.sh

      - name: Run check-repo-hygiene test
        if: hashFiles('tests/test-check-repo-hygiene.sh') != ''
        run: bash tests/test-check-repo-hygiene.sh

      - name: Run PII scanner test
        if: hashFiles('tests/test-check-pii.sh') != ''
        run: bash tests/test-check-pii.sh

      - name: Run require-linked-issue exemptions test
        if: hashFiles('tests/test-require-linked-issue-exemptions.sh') != ''
        run: bash tests/test-require-linked-issue-exemptions.sh

      - name: Run privileged pull-request workflow test
        if: hashFiles('tests/test-privileged-pr-workflows.sh') != ''
        run: bash tests/test-privileged-pr-workflows.sh

      - name: Run MDX prose gate test
        if: hashFiles('tests/test-lint-mdx-prose.sh') != ''
        run: bash tests/test-lint-mdx-prose.sh

      # Consumer repos: run their OWN hermetic tests/test-*.sh through canonical
      # docs-control selection. The default remains every matching script. A repo
      # that mixes unit and environment tests can have a complete, fail-closed
      # profile in repo-settings.json; inventory drift then fails before execution.
      # Fetch both runner and config from the same trusted canonical revision so a
      # pull request cannot edit its own profile to evade the required context.
      # Skipped in docs-control itself, whose tests are curated above.
      - name: Run consumer shell unit tests
        if: github.repository != 'f5-sales-demo/docs-control'
        shell: bash
        run: |
          set -euo pipefail
          remote="${GOVERNANCE_REMOTE:-https://github.com/f5-sales-demo/docs-control}"
          gov_dir=$(mktemp -d)
          trap 'rm -rf "$gov_dir"' EXIT
          git init --quiet "$gov_dir"
          if ! git -C "$gov_dir" fetch --no-tags --quiet --depth=1 "$remote" main 2>/dev/null; then
            echo "::error::cannot reach canonical governance at ${remote} -- refusing to guess which consumer tests are safe"
            exit 1
          fi

          canonical_sha=$(git -C "$gov_dir" rev-parse FETCH_HEAD)
          runner=scripts/run-consumer-shell-tests.sh
          config=.github/config/repo-settings.json
          for artifact in "$runner" "$config"; do
            if ! git -C "$gov_dir" cat-file -e "${canonical_sha}:${artifact}" 2>/dev/null; then
              echo "::error::canonical governance @ ${canonical_sha} is missing ${artifact}"
              exit 1
            fi
          done

          git -C "$gov_dir" archive "$canonical_sha" "$runner" "$config" |
            tar -xf - -C "$gov_dir"
          echo "Selecting consumer shell tests from canonical governance @ ${canonical_sha}"
          bash "${gov_dir}/${runner}" \
            --root "$GITHUB_WORKSPACE" \
            --config "${gov_dir}/${config}" \
            --repository "$GITHUB_REPOSITORY"
