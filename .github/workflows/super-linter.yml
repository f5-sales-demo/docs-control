---
name: Super-Linter

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_call:

permissions: {}

concurrency:
  # A called workflow inherits github.workflow from its caller. Keep this
  # group distinct from caller-level groups or cancel-in-progress can cancel
  # the caller itself instead of only superseding an older lint invocation.
  group: reusable-super-linter-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    # Scoped to what the linter needs: read code/packages, write commit statuses
    # and PR annotations. The shell-unit-tests job below gets contents:read only.
    permissions:
      contents: read
      packages: read # pull the pinned Super-Linter container image
      statuses: write # publish the lint status context
      pull-requests: write # annotate pull requests with lint findings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # This scanner is managed and synced verbatim. Enforce its portability
      # where it is authored; checking a downstream caller's stale copy blocks
      # an unrelated PR with a file that repository is forbidden to edit. The
      # three canonical widths still guard every Ruff configuration in the fleet.
      - name: Check managed PII scanner format at 88 columns
        if: github.repository == 'f5-sales-demo/docs-control' && hashFiles('scripts/check_pii.py') != ''
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: format --check --config=line-length=88
          src: scripts/check_pii.py

      - name: Check managed PII scanner format at 100 columns
        if: github.repository == 'f5-sales-demo/docs-control' && hashFiles('scripts/check_pii.py') != ''
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: format --check --config=line-length=100
          src: scripts/check_pii.py

      - name: Check managed PII scanner format at 120 columns
        if: github.repository == 'f5-sales-demo/docs-control' && hashFiles('scripts/check_pii.py') != ''
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: format --check --config=line-length=120
          src: scripts/check_pii.py

      # Deterministic portability guard, run natively on the runner (Super-Linter
      # cannot see git object modes from inside its container). Cheap and first, so
      # a committed absolute symlink or hardcoded home directory fails fast.
      #
      # Runs the CANONICAL copy of the script (docs-control main) against the HEAD
      # working tree, per REVIEWER-SPEC.md invariant 3 ("never execute scripts carried
      # in the PR head") and the trust boundary documented there. Two reasons:
      #   1. This job holds statuses:write and pull-requests:write, so executing a
      #      PR's own copy of the script would hand those scopes to PR-authored code.
      #   2. Gating on the head's copy would let a PR delete the file to skip the
      #      gate entirely.
      # The script only reads git metadata and tracked file contents, so trusted
      # logic over untrusted data is safe.
      #
      # Canonical rather than this repo's default branch: the default branch is a sync
      # target and can lag docs-control, in which case the pull request carrying the
      # fix is blocked by the stale copy it would replace (issue #815). Whether the
      # script applies here is still decided by the default branch carrying it, so the
      # skip_files opt-out is unchanged; absent there, nothing to enforce.
      - name: Check repository hygiene
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          script=scripts/check-repo-hygiene.sh
          branch="${DEFAULT_BRANCH:-main}"
          git fetch --no-tags --quiet origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          # Opt-out is still "the repo does not carry the script" (skip_files), unchanged.
          if ! git cat-file -e "origin/${branch}:${script}" 2>/dev/null; then
            echo "The default branch does not carry ${script} yet; nothing to enforce."
            exit 0
          fi
          # Execute the CANONICAL bytes, not this repo's copy. A downstream default
          # branch is a sync target and can lag docs-control, and a pull request that
          # would deliver the fix could never pass the stale gate it replaces — that is
          # what stranded i18n-core (issue #815). Still never the head's copy.
          remote="${GOVERNANCE_REMOTE:-https://github.com/f5-sales-demo/docs-control}"
          # Fetch into a throwaway repository, never this workspace. A --depth=1 fetch
          # into the checkout writes .git/shallow, which breaks Super-Linter's
          # GIT_MERGE_BASE calculation and fails the whole job; and it would clobber
          # FETCH_HEAD for anything else in the workspace.
          gov_dir=$(mktemp -d)
          trap 'rm -rf "$gov_dir"' EXIT
          git init --quiet "$gov_dir"
          if ! git -C "$gov_dir" fetch --no-tags --quiet --depth=1 "$remote" main 2>/dev/null; then
            echo "::error::cannot reach canonical governance at ${remote} -- refusing to run a stale gate"
            exit 1
          fi
          canonical_sha=$(git -C "$gov_dir" rev-parse FETCH_HEAD)
          if ! git -C "$gov_dir" cat-file -e "${canonical_sha}:${script}" 2>/dev/null; then
            # Absent from canonical. Distinguish a deliberate retirement from an
            # accident by asking canonical's own manifest, not this repo's copy of the
            # script: the sync only ever adds and updates blobs, never deletes them, so
            # a retired script lingers downstream forever and cannot be used as the
            # signal. Retirement = drop the managed_files entry; the orphaned
            # downstream copy is then simply unmanaged.
            manifest=$(git -C "$gov_dir" show "${canonical_sha}:.github/config/repo-settings.json" 2>/dev/null || true)
            # Require a well-formed manifest before believing "retired". Absent or
            # malformed managed_files must not read as an empty list, or a schema
            # migration or partial merge would silently stand the gate down.
            if ! printf '%s' "$manifest" | jq -e '.managed_files.files | type == "array"' >/dev/null 2>&1; then
              echo "::error::cannot read managed_files from canonical governance @ ${canonical_sha} -- refusing to guess whether ${script} was retired"
              exit 1
            fi
            if printf '%s' "$manifest" |
              jq -e --arg s "$script" '[.managed_files.files[].dest] | index($s) == null' >/dev/null 2>&1; then
              echo "${script} has been retired from canonical governance; nothing to enforce."
              exit 0
            fi
            echo "::error::${script} is still listed in canonical managed_files but missing from canonical governance @ ${canonical_sha} -- refusing to pass an unenforced gate. Retire it by removing its managed_files entry."
            exit 1
          fi
          # Log the exact commit whose bytes run, so a run is reproducible and any
          # behaviour change is attributable to a specific governance commit.
          echo "Enforcing ${script} from canonical governance @ ${canonical_sha}"
          git -C "$gov_dir" show "${canonical_sha}:${script}" | bash -s

      # Same trust boundary and same canonical source as the step above: never the
      # head's own copy, and never a possibly-stale local copy. Repositories that opt
      # out of this script via skip_files simply have nothing to enforce.
      - name: Check for hardcoded locale lists
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          script=scripts/locale-lint.sh
          branch="${DEFAULT_BRANCH:-main}"
          git fetch --no-tags --quiet origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          # Opt-out is still "the repo does not carry the script" (skip_files), unchanged.
          if ! git cat-file -e "origin/${branch}:${script}" 2>/dev/null; then
            echo "The default branch does not carry ${script}; nothing to enforce."
            exit 0
          fi
          # Execute the CANONICAL bytes, not this repo's copy. A downstream default
          # branch is a sync target and can lag docs-control, and a pull request that
          # would deliver the fix could never pass the stale gate it replaces — that is
          # what stranded i18n-core (issue #815). Still never the head's copy.
          remote="${GOVERNANCE_REMOTE:-https://github.com/f5-sales-demo/docs-control}"
          # Fetch into a throwaway repository, never this workspace. A --depth=1 fetch
          # into the checkout writes .git/shallow, which breaks Super-Linter's
          # GIT_MERGE_BASE calculation and fails the whole job; and it would clobber
          # FETCH_HEAD for anything else in the workspace.
          gov_dir=$(mktemp -d)
          trap 'rm -rf "$gov_dir"' EXIT
          git init --quiet "$gov_dir"
          if ! git -C "$gov_dir" fetch --no-tags --quiet --depth=1 "$remote" main 2>/dev/null; then
            echo "::error::cannot reach canonical governance at ${remote} -- refusing to run a stale gate"
            exit 1
          fi
          canonical_sha=$(git -C "$gov_dir" rev-parse FETCH_HEAD)
          if ! git -C "$gov_dir" cat-file -e "${canonical_sha}:${script}" 2>/dev/null; then
            # Absent from canonical. Distinguish a deliberate retirement from an
            # accident by asking canonical's own manifest, not this repo's copy of the
            # script: the sync only ever adds and updates blobs, never deletes them, so
            # a retired script lingers downstream forever and cannot be used as the
            # signal. Retirement = drop the managed_files entry; the orphaned
            # downstream copy is then simply unmanaged.
            manifest=$(git -C "$gov_dir" show "${canonical_sha}:.github/config/repo-settings.json" 2>/dev/null || true)
            # Require a well-formed manifest before believing "retired". Absent or
            # malformed managed_files must not read as an empty list, or a schema
            # migration or partial merge would silently stand the gate down.
            if ! printf '%s' "$manifest" | jq -e '.managed_files.files | type == "array"' >/dev/null 2>&1; then
              echo "::error::cannot read managed_files from canonical governance @ ${canonical_sha} -- refusing to guess whether ${script} was retired"
              exit 1
            fi
            if printf '%s' "$manifest" |
              jq -e --arg s "$script" '[.managed_files.files[].dest] | index($s) == null' >/dev/null 2>&1; then
              echo "${script} has been retired from canonical governance; nothing to enforce."
              exit 0
            fi
            echo "::error::${script} is still listed in canonical managed_files but missing from canonical governance @ ${canonical_sha} -- refusing to pass an unenforced gate. Retire it by removing its managed_files entry."
            exit 1
          fi
          # Log the exact commit whose bytes run, so a run is reproducible and any
          # behaviour change is attributable to a specific governance commit.
          echo "Enforcing ${script} from canonical governance @ ${canonical_sha}"
          git -C "$gov_dir" show "${canonical_sha}:${script}" | bash -s

      # Biome runs OUTSIDE the Super-Linter container so its exact version is
      # independent of the Super-Linter container release cadence. Authority
      # boundary: setup-biome owns JS/TS/JSON/JSX; the
      # Super-Linter step below runs everything else with VALIDATE_BIOME_*
      # disabled. Step order matters: if Biome fails, Super-Linter is skipped
      # (default fail-fast, no `if: always()`) so developers get a focused log.
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51  # v2.7.1 — Dependabot-managed
        with:
          version: 2.5.6

      - name: Run Biome
        run: |
          if find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o -name '*.json' -o -name '*.jsonc' -o -name '*.css' -o -name '*.vue' \) -not -path './node_modules/*' -not -path './.terraform/*' -not -path './dist/*' -not -path './build/*' -not -path './vendor/*' | grep -q .; then
            biome ci .
          else
            echo "No biome-eligible files found — skipping"
          fi

      - name: Run Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: main
          # Redirect Python tool caches out of $GITHUB_WORKSPACE so
          # TRIVY's filesystem walker never sees them. TRIVY 0.69.3
          # lstat()s entries BEFORE consulting skip-dirs, so dangling
          # .mypy_cache/missing_stubs symlinks crash the scan
          # regardless of trivy.yaml config. See #379 (follow-up to #378).
          MYPY_CACHE_DIR: /tmp/mypy_cache
          RUFF_CACHE_DIR: /tmp/ruff_cache
          PYTEST_ADDOPTS: --cache-dir=/tmp/pytest_cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable Biome in Super-Linter — handled by the biomejs/setup-biome
          # step above, which runs the pinned Biome version instead of the
          # container's bundled version. Authority boundary: setup-biome owns JS/TS/JSON/JSX;
          # Super-Linter retains everything else.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          LINTER_RULES_PATH: "."
          # tree-sitter-<grammar>/src/{parser,scanner}.c are either machine-
          # generated (parser.c from `tree-sitter generate`) or hand-written
          # to upstream tree-sitter conventions that do not match
          # clang-format's default style; excluding preserves fork fidelity.
          FILTER_REGEX_EXCLUDE: "(dist/|build/|release/|vendor/|tree-sitter-[^/]+/src/(parser|scanner)\\.(c|h)$|docs/(fr|es|de|ja|pt-br|ko|zh-cn|zh-tw|ar|it|hi|th)/|src/i18n/.*translations)"
          # Disable Prettier — Biome handles formatting for
          # JS/TS/JSON/CSS/HTML/GraphQL/JSX/Vue; yamllint handles
          # YAML; markdownlint handles Markdown.
          VALIDATE_CSS_PRETTIER: false
          VALIDATE_GRAPHQL_PRETTIER: false
          VALIDATE_HTML_PRETTIER: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_JSONC_PRETTIER: false
          VALIDATE_JSX_PRETTIER: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_VUE_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
          # Disable ESLint — Biome handles linting for
          # JS/TS/JSON/JSX/Vue; super-linter cannot run
          # type-aware ESLint (no npm ci / tsconfig).
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JSON: false
          VALIDATE_JSONC: false
          VALIDATE_JSX: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TSX: false
          VALIDATE_VUE: false
          # Disable Stylelint — Biome handles CSS linting
          VALIDATE_CSS: false
          # Disable pre-commit — cannot execute inside super-linter container
          VALIDATE_PRE_COMMIT: false
          # Pass SC2016 exclusion to shellcheck via env so actionlint's
          # embedded shellcheck also skips it (.shellcheckrc only works
          # for the direct BASH linter, not actionlint's subprocess)
          SHELLCHECK_OPTS: "-e SC2016"
          # Explicit config file name — super-linter v8 defaults to
          # .yamllint.yml but our managed config uses .yamllint.yaml
          YAML_YAMLLINT_CONFIG_FILE: .yamllint.yaml
          # Without an explicit config file, Super-Linter's JSCPD uses its
          # bundled default and IGNORES the repo .jscpd.json (so the ignore /
          # threshold never apply). Point it at the managed repo config.
          # Filename only — a full path triggers the doubled-slash
          # "rules file doesn't exist" bug (super-linter #6734).
          JSCPD_CONFIG_FILE: .jscpd.json
          # Point Trivy at our governance config (skip-dirs for
          # .mypy_cache, .ruff_cache, .pytest_cache so the fs walker
          # doesn't hit dangling symlinks mid-run). See issue #377.
          TRIVY_CONFIG_FILE: trivy.yaml
          SAVE_SUPER_LINTER_SUMMARY: false
          VALIDATE_ALL_CODEBASE: false
          # No commitlint config exists in managed repos
          VALIDATE_GIT_COMMITLINT: false
          # ── Python linters ─────────────────────────────────
          # Ruff: comprehensive lint + format (extends pyproject.toml).
          # Pylint: complexity/design checks. Mypy: type checking.
          # Black, Flake8, isort disabled (Ruff is a superset).
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          PYTHON_RUFF_CONFIG_FILE: .ruff.toml
          PYTHON_RUFF_FORMAT_CONFIG_FILE: .ruff.toml
          PYTHON_PYLINT_CONFIG_FILE: .python-lint
          PYTHON_MYPY_CONFIG_FILE: .mypy.ini
          # ── OpenAPI / Spectral ──────────────────────────────
          # Disabled — super-linter's Docker container can't resolve
          # repo-specific .spectral.yaml paths. Handled by the
          # dedicated Spectral step below (runs natively on runner).
          VALIDATE_OPENAPI: false
          # ── Validators irrelevant to this ecosystem's language mix ──
          # PowerShell: no .ps1 files in any governed repo.
          VALIDATE_POWERSHELL: false
          # Standalone HTML: repos are Astro/Starlight-based; generated
          # HTML is a build artifact, not source.
          VALIDATE_HTML: false
          # CPP (cpplint): overlaps with CLANG_FORMAT; clang-format is
          # the ecosystem's chosen C/C++ style enforcer and has been
          # tuned per-repo (e.g., .clang-format-ignore in xcsh).
          VALIDATE_CPP: false
          VALIDATE_CPP_EPA: false
          # Rust 2015 edition checks: governed repos target edition 2021
          # or 2024; the 2015 validator flags normal modern-edition code.
          VALIDATE_RUST_2015: false
          # Dockerfile hadolint: overlaps with CHECKOV for dockerfile
          # security scanning; running both is redundant noise.
          VALIDATE_DOCKERFILE_HADOLINT: false
          # BASH_EXEC (shebang + exec bit): repos carry node-style
          # shebangs on .ts entrypoints and intentionally lack +x
          # (invoked via `bun run ...`); this validator flags non-issues.
          VALIDATE_BASH_EXEC: false
          # EDITORCONFIG (super-linter's built-in validator): we already
          # run editorconfig-checker per-repo via the managed config.
          # The super-linter built-in duplicates that check with stricter
          # default behaviour that flags legitimate fork indentation.
          VALIDATE_EDITORCONFIG: false
          # PROTOBUF: governed repos may carry third-party proto files
          # (e.g., xcsh's Cursor protobuf imports under packages/ai/src/
          # providers/cursor/proto/) whose layout is fork-faithful.
          VALIDATE_PROTOBUF: false
          # GO: super-linter runs golangci-lint per-file, but Go's type
          # checker requires all files in a package. Repos with Go code
          # run golangci-lint correctly in their own CI jobs.
          VALIDATE_GO: false
          VALIDATE_GO_MODULES: false
          VALIDATE_GO_REVIVE: false

      - name: Spectral OpenAPI lint
        if: hashFiles('.spectral.yaml', '.spectral.yml') != ''
        uses: stoplightio/spectral-action@6416fd018ae38e60136775066eb3e98172143141 # v0.8.13
        with:
          file_glob: "**/*.json **/*.yaml"

  shell-unit-tests:
    name: Shell Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # These tests guard docs-control's own fleet-sync machinery. They
      # live only in docs-control; consumer repos that pin this workflow
      # via `workflow_call` do not carry the scripts. Each step has its
      # OWN hashFiles guard so partial file presence (e.g. a consumer
      # that inherited one script via an older governance sync) doesn't
      # admit the step and fail on the missing sibling. A multi-file
      # hashFiles('a','b','c') is OR, not AND — hence per-step guards.
      - name: Run fetch-governed test
        if: hashFiles('tests/test-fetch-governed.sh') != ''
        run: bash tests/test-fetch-governed.sh

      - name: Run inlined-helpers-match test
        if: hashFiles('tests/test-inlined-helpers-match.sh') != ''
        run: bash tests/test-inlined-helpers-match.sh

      - name: Run retry stdout-isolation test
        if: hashFiles('tests/test-retry-stdout.sh') != ''
        run: bash tests/test-retry-stdout.sh

      - name: Run dispatch-matrix test
        if: hashFiles('tests/test-dispatch-matrix.sh') != ''
        run: bash tests/test-dispatch-matrix.sh

      - name: Run review-slot semaphore test
        if: hashFiles('tests/test-review-slot.sh') != ''
        run: bash tests/test-review-slot.sh

      - name: Run parse-verdict gate test
        if: hashFiles('tests/test-parse-verdict.sh') != ''
        run: bash tests/test-parse-verdict.sh

      - name: Run pr-author-trusted gate test
        if: hashFiles('tests/test-pr-author-trusted.sh') != ''
        run: bash tests/test-pr-author-trusted.sh

      - name: Run claude-review retry-decision test
        if: hashFiles('tests/test-claude-review-retry.sh') != ''
        run: bash tests/test-claude-review-retry.sh

      - name: Run reviewer-comment-count test
        if: hashFiles('tests/test-reviewer-comment-count.sh') != ''
        run: bash tests/test-reviewer-comment-count.sh

      - name: Run pages-staleness-guard test
        if: hashFiles('tests/test-pages-staleness-guard.sh') != ''
        run: bash tests/test-pages-staleness-guard.sh

      - name: Run check-review-deps test
        if: hashFiles('tests/test-check-review-deps.sh') != ''
        run: bash tests/test-check-review-deps.sh

      - name: Run protect-managed-files hook test
        if: hashFiles('tests/test-protect-managed-files.sh') != ''
        run: bash tests/test-protect-managed-files.sh

      - name: Run linter-configs test
        if: hashFiles('tests/test-linter-configs.sh') != ''
        run: bash tests/test-linter-configs.sh

      - name: Run consumer shell-test selector test
        if: hashFiles('tests/test-consumer-shell-tests.sh') != ''
        run: bash tests/test-consumer-shell-tests.sh

      - name: Run README generation test
        if: hashFiles('tests/test-readme-generation.sh') != ''
        run: bash tests/test-readme-generation.sh

      - name: Run governed workflow pin test
        if: hashFiles('tests/test-governed-workflow-pins.sh') != ''
        run: bash tests/test-governed-workflow-pins.sh

      - name: Run sync-managed-files test
        if: hashFiles('tests/test-sync-managed-files.sh') != ''
        run: bash tests/test-sync-managed-files.sh

      - name: Run review-layer-routing test
        if: hashFiles('tests/test-review-layer-routing.sh') != ''
        run: bash tests/test-review-layer-routing.sh

      - name: Run translation-suspension test
        if: hashFiles('tests/test-translation-suspension.sh') != ''
        run: bash tests/test-translation-suspension.sh

      - name: Run locale-lint test
        if: hashFiles('tests/test-locale-lint.sh') != ''
        run: bash tests/test-locale-lint.sh

      - name: Run governed-script source test
        if: hashFiles('tests/test-governed-script-source.sh') != ''
        run: bash tests/test-governed-script-source.sh

      - name: Run fleet pre-flight test
        if: hashFiles('tests/test-preflight-fleet.sh') != ''
        run: bash tests/test-preflight-fleet.sh

      - name: Run check-repo-hygiene test
        if: hashFiles('tests/test-check-repo-hygiene.sh') != ''
        run: bash tests/test-check-repo-hygiene.sh

      - name: Run PII scanner test
        if: hashFiles('tests/test-check-pii.sh') != ''
        run: bash tests/test-check-pii.sh

      - name: Run require-linked-issue exemptions test
        if: hashFiles('tests/test-require-linked-issue-exemptions.sh') != ''
        run: bash tests/test-require-linked-issue-exemptions.sh

      # Consumer repos: run their OWN hermetic tests/test-*.sh through canonical
      # docs-control selection. The default remains every matching script. A repo
      # that mixes unit and environment tests can have a complete, fail-closed
      # profile in repo-settings.json; inventory drift then fails before execution.
      # Fetch both runner and config from the same trusted canonical revision so a
      # pull request cannot edit its own profile to evade the required context.
      # Skipped in docs-control itself, whose tests are curated above.
      - name: Run consumer shell unit tests
        if: github.repository != 'f5-sales-demo/docs-control'
        shell: bash
        run: |
          set -euo pipefail
          remote="${GOVERNANCE_REMOTE:-https://github.com/f5-sales-demo/docs-control}"
          gov_dir=$(mktemp -d)
          trap 'rm -rf "$gov_dir"' EXIT
          git init --quiet "$gov_dir"
          if ! git -C "$gov_dir" fetch --no-tags --quiet --depth=1 "$remote" main 2>/dev/null; then
            echo "::error::cannot reach canonical governance at ${remote} -- refusing to guess which consumer tests are safe"
            exit 1
          fi

          canonical_sha=$(git -C "$gov_dir" rev-parse FETCH_HEAD)
          runner=scripts/run-consumer-shell-tests.sh
          config=.github/config/repo-settings.json
          for artifact in "$runner" "$config"; do
            if ! git -C "$gov_dir" cat-file -e "${canonical_sha}:${artifact}" 2>/dev/null; then
              echo "::error::canonical governance @ ${canonical_sha} is missing ${artifact}"
              exit 1
            fi
          done

          git -C "$gov_dir" archive "$canonical_sha" "$runner" "$config" |
            tar -xf - -C "$gov_dir"
          echo "Selecting consumer shell tests from canonical governance @ ${canonical_sha}"
          bash "${gov_dir}/${runner}" \
            --root "$GITHUB_WORKSPACE" \
            --config "${gov_dir}/${config}" \
            --repository "$GITHUB_REPOSITORY"
