---
name: Update Governed Workflow Pins

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/antigravity-review.yml'
      - '.github/workflows/auto-merge.yml'
      - '.github/workflows/claude-review.yml'
      - '.github/workflows/dependabot-auto-merge.yml'
      - '.github/workflows/enforce-repo-settings.yml'
      - '.github/workflows/github-pages-deploy.yml'
      - '.github/workflows/require-linked-issue.yml'
      - '.github/workflows/super-linter.yml'
      - '.github/workflows/sync-managed-files.yml'
      - '.github/workflows/translation-audit.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full docs-control commit SHA to publish to governed callers'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-governed-workflow-pins
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs-control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_SETTINGS_TOKEN }}

      - name: Roll governed callers forward
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: scripts/update-governed-workflow-pins.sh
