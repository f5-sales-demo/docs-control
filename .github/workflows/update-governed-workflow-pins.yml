---
name: Update Governed Workflow Pins

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-merge.yml'
      - '.github/workflows/claude-review.yml'
      - '.github/workflows/dependabot-auto-merge.yml'
      - '.github/workflows/enforce-repo-settings.yml'
      - '.github/workflows/github-pages-deploy.yml'
      - '.github/workflows/require-linked-issue.yml'
      - '.github/workflows/super-linter.yml'
      - '.github/workflows/sync-managed-files.yml'
      - '.github/workflows/translation-audit.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full docs-control commit SHA to publish to governed callers'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-governed-workflow-pins
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs-control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_SETTINGS_TOKEN }}

      - name: Roll governed callers forward
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail

          TARGET_REVISION="${REQUESTED_REVISION:-$GITHUB_SHA}"
          if [[ ! "$TARGET_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision must be a full lowercase 40-character commit SHA"
            exit 1
          fi

          git fetch origin main
          BRANCH="sync/governed-workflow-pins"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch --track -c "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git switch -c "$BRANCH" origin/main
          fi

          if ! git merge-base --is-ancestor "$TARGET_REVISION" origin/main; then
            echo "::error::revision is not an ancestor of origin/main: $TARGET_REVISION"
            exit 1
          fi
          CURRENT_REVISION=$(jq -er .revision .github/config/governed-workflow-pin.json)
          if ! git merge-base --is-ancestor "$CURRENT_REVISION" "$TARGET_REVISION"; then
            echo "::error::refusing to roll governed workflows backward from $CURRENT_REVISION to $TARGET_REVISION"
            exit 1
          fi
          python3 scripts/update-governed-workflow-pins.py \
            --revision "$TARGET_REVISION" > /tmp/workflow-pin-update
          while IFS= read -r workflow; do
            [ -n "$workflow" ] || continue
            if ! git cat-file -e "$TARGET_REVISION:.github/workflows/$workflow"; then
              echo "::error::$TARGET_REVISION does not contain reusable workflow $workflow"
              exit 1
            fi
          done < <(tail -n +2 /tmp/workflow-pin-update)
          cat /tmp/workflow-pin-update

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add workflows/ .github/config/governed-workflow-pin.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(governance): roll reusable workflow pins"
            git push -u origin "$BRANCH"
          fi

          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            if git diff --quiet origin/main...HEAD; then
              echo "Governed callers already use docs-control@$TARGET_REVISION"
              exit 0
            fi
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(governance): roll reusable workflow pins" \
              --body "Automated immutable pin update to docs-control@$TARGET_REVISION.")
            PR_NUMBER=${PR_URL##*/}
          fi
          gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
