---
name: Reconcile Fleet Settings

on:
  push:
    branches: [main]
    paths:
      - '.github/config/repo-settings.json'
      - '.github/config/downstream-repos.json'
      - '.github/workflows/reconcile-fleet-settings.yml'
      - 'scripts/fleet-reconciler.cjs'
      - 'scripts/github-api-resilience.cjs'
  workflow_dispatch:
    inputs:
      mode:
        description: Reconciliation mode.
        required: false
        default: dry-run
        type: choice
        options: [dry-run, pilot, full]
      repositories:
        description: Optional comma-separated downstream repository names.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fleet-settings-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile fleet settings
    environment: repository-settings
    runs-on: managed-socketless
    timeout-minutes: 60
    env:
      APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve governed repository scope
        id: repository-scope
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = '.github/config/downstream-repos.json';
          const repositories = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Array.isArray(repositories) || repositories.some((item) => typeof item !== 'string' || item.length === 0)) {
            throw new Error('downstream repository inventory must be a non-empty string array');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `repositories=${repositories.join(',')}\n`);
          NODE
      - id: app-token
        if: env.APP_ID != '' && env.APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repository-scope.outputs.repositories }}
          permission-actions: write
          permission-administration: write
          permission-pull-requests: read
      - name: Reconcile repository settings
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.REPO_SETTINGS_TOKEN }}
          RECONCILE_MODE: ${{ inputs.mode || 'full' }}
          RECONCILE_KIND: settings
          REPOSITORIES: ${{ inputs.repositories }}
        run: node scripts/fleet-reconciler.cjs
