---
name: Enforce Repository Settings

#checkov:skip=CKV_GHA_7:Exact source receipts are validated before any governed read or mutation.
on:
  push:
    branches: [main]
    paths:
      - '.github/config/repo-settings.json'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact docs-control commit receipt for every governed read.'
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        description: 'Exact docs-control commit receipt for every governed read.'
        required: true
        type: string
    secrets:
      repo-settings-token:
        description: 'PAT with admin permissions for repository settings'
        required: true
      REPO_SETTINGS_TOKEN:
        description: 'Repo-level fallback used by push trigger context'
        required: false

permissions:
  contents: read

concurrency:
  group: enforce-repo-settings-${{ github.repository }}
  cancel-in-progress: false

jobs:
  enforce:
    name: Enforce repository settings
    runs-on: [self-hosted, Linux, X64, "${{ github.event.repository.name }}"]
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce repository settings
        env:
          GH_TOKEN: ${{ secrets.repo-settings-token || secrets.REPO_SETTINGS_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # --- Retry helpers -------------------------------------------------
          # Ordinary transport failures use a short exponential backoff. Primary
          # limits wait for X-RateLimit-Reset (or GET /rate_limit when the header
          # is unavailable). Secondary limits never poll: honor Retry-After or
          # wait 60, 120, 240... seconds within a bounded per-operation budget.
          retry() {
            local max="$1"; shift
            local attempt=1
            local delay=2
            local max_delay=8
            local total_wait=0
            local wait_budget="${GITHUB_API_WAIT_BUDGET_SECONDS:-600}"
            local err_file out_file response_content
            err_file=$(mktemp)
            out_file=$(mktemp)
            while true; do
              # Buffer stdout per attempt. `gh api` prints its JSON error body to
              # stdout on failure, and ~23 call sites capture this function's output
              # into a variable -- several of which drive enforcement decisions. Left
              # unbuffered, a transient failure followed by a successful retry hands
              # the caller the error body concatenated with the real value, which is
              # silently wrong rather than absent (issue #805).
              : >"$out_file"
              if "$@" >"$out_file" 2>"$err_file"; then
                cat "$out_file"
                cat "$err_file" >&2
                rm -f "$err_file" "$out_file"
                return 0
              fi
              response_content=$(cat "$out_file" "$err_file")
              cat "$err_file" >&2
              : >"$err_file"
              local retry_after remaining reset now wait_s next_at kind
              retry_after=$(awk 'tolower($1) == "retry-after:" {gsub("\r", "", $2); print $2; exit}' \
                <<<"$response_content")
              remaining=$(awk 'tolower($1) == "x-ratelimit-remaining:" {gsub("\r", "", $2); print $2; exit}' \
                <<<"$response_content")
              reset=$(awk 'tolower($1) == "x-ratelimit-reset:" {gsub("\r", "", $2); print $2; exit}' \
                <<<"$response_content")
              kind=""
              if [ -n "$retry_after" ] ||
                grep -qiE '(secondary rate|abuse detection|submitted too quickly|temporarily blocked from content creation)' \
                  <<<"$response_content" || {
                    grep -qi 'HTTP 429' <<<"$response_content" && [ "${remaining:-unknown}" != 0 ]
                  }; then
                kind=secondary
                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  wait_s="$retry_after"
                else
                  wait_s=$((60 * (2 ** (attempt - 1))))
                  [ "$wait_s" -gt 600 ] && wait_s=600
                fi
              elif [ "${remaining:-unknown}" = 0 ] ||
                grep -qiE '(API rate limit exceeded|primary rate limit)' <<<"$response_content"; then
                kind=primary
                if ! [[ "$reset" =~ ^[0-9]+$ ]]; then
                  reset=$(gh api rate_limit --jq '.rate.reset' 2>/dev/null || echo 0)
                fi
                now=$(date +%s)
                wait_s=$((reset - now + 5))
                [ "$wait_s" -gt 0 ] || wait_s=60
              fi
              if [ -n "$kind" ]; then
                if [ "$attempt" -ge "$max" ] || [ $((total_wait + wait_s)) -gt "$wait_budget" ]; then
                  echo "[DEFER] $kind GitHub limit requires ${wait_s}s; retry budget exhausted" >&2
                  rm -f "$err_file" "$out_file"
                  return 84
                fi
                now=$(date +%s)
                next_at=$(python3 -c 'import datetime,sys; print(datetime.datetime.fromtimestamp(int(sys.argv[1]), datetime.timezone.utc).isoformat().replace("+00:00", "Z"))' "$((now + wait_s))")
                echo "[WAIT] $kind GitHub limit on attempt ${attempt}/${max}; waiting ${wait_s}s; next attempt ${next_at}" >&2
                sleep "$wait_s"
                total_wait=$((total_wait + wait_s))
                attempt=$((attempt + 1))
                continue
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "[ERROR] Failed after ${max} attempts: $*" >&2
                rm -f "$err_file" "$out_file"
                return 1
              fi
              echo "[WARN] Attempt ${attempt}/${max} failed -- retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
              [ "$delay" -gt "$max_delay" ] && delay="$max_delay"
            done
          }

          # Retry with JSON body (for gh api --input - calls)
          current_json_request() {
            local json="$1"
            shift
            require_current_source_main
            local endpoint="$1" method=POST response_file error_file rc
            shift
            while [ "$#" -gt 0 ]; do
              case "$1" in
                --method) method="$2"; shift 2 ;;
                *) echo "[ERROR] Unsupported JSON request option: $1" >&2; return 2 ;;
              esac
            done
            response_file=$(mktemp)
            error_file=$(mktemp)
            set +e
            printf '%s' "$json" | gh api "$endpoint" --method "$method" --input - --include \
              >"$response_file" 2>"$error_file"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              if head -n 1 "$response_file" | grep -q '^HTTP/'; then
                awk 'body {print} /^\r?$/ {body=1}' "$response_file"
              else
                cat "$response_file"
              fi
              cat "$error_file" >&2
              rm -f "$response_file" "$error_file"
              return 0
            fi
            cat "$response_file" "$error_file" >&2
            rm -f "$response_file" "$error_file"
            return 1
          }

          retry_current_json() {
            local max="$1"
            shift
            local json="$1"
            shift
            retry "$max" current_json_request "$json" "$@"
          }

          api_value_or_404() {
            local endpoint="$1" jq_filter="$2"
            local out_file err_file rc value
            out_file=$(mktemp)
            err_file=$(mktemp)
            set +e
            gh api "$endpoint" --jq "$jq_filter" >"$out_file" 2>"$err_file"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              value=$(cat "$out_file")
              rm -f "$out_file" "$err_file"
              if [ -z "$value" ]; then
                echo "[ERROR] GitHub API returned an empty value for ${endpoint}" >&2
                return 1
              fi
              printf '%s' "$value"
              return 0
            fi
            if grep -qE '\(HTTP 404\)$' "$err_file"; then
              rm -f "$out_file" "$err_file"
              return 44
            fi
            echo "[ERROR] GitHub API read failed closed for ${endpoint}" >&2
            sed -E 's/(Request-Id:).*/\1 [redacted]/I' "$err_file" >&2
            rm -f "$out_file" "$err_file"
            return 1
          }

          normalize_desired_protection() {
            jq -ce '
              def names($key):
                map(if type == "string" then . else error("invalid " + $key) end) | sort;
              {
                enforce_admins: .enforce_admins,
                required_status_checks:
                  (if .required_status_checks == null then null else {
                    strict: .required_status_checks.strict,
                    contexts: (.required_status_checks.contexts | sort)
                  } end),
                required_pull_request_reviews:
                  (if .required_pull_request_reviews == null then null else {
                    dismiss_stale_reviews:
                      (.required_pull_request_reviews.dismiss_stale_reviews // false),
                    require_code_owner_reviews:
                      (.required_pull_request_reviews.require_code_owner_reviews // false),
                    required_approving_review_count:
                      (.required_pull_request_reviews.required_approving_review_count // 0),
                    require_last_push_approval:
                      (.required_pull_request_reviews.require_last_push_approval // false),
                    dismissal_restrictions: {
                      users: ((.required_pull_request_reviews.dismissal_restrictions.users // []) | names("users")),
                      teams: ((.required_pull_request_reviews.dismissal_restrictions.teams // []) | names("teams"))
                    },
                    bypass_pull_request_allowances: {
                      users: ((.required_pull_request_reviews.bypass_pull_request_allowances.users // []) | names("users")),
                      teams: ((.required_pull_request_reviews.bypass_pull_request_allowances.teams // []) | names("teams")),
                      apps: ((.required_pull_request_reviews.bypass_pull_request_allowances.apps // []) | names("apps"))
                    }
                  } end),
                restrictions:
                  (if .restrictions == null then null else {
                    users: ((.restrictions.users // []) | names("users")),
                    teams: ((.restrictions.teams // []) | names("teams")),
                    apps: ((.restrictions.apps // []) | names("apps"))
                  } end),
                required_linear_history: .required_linear_history,
                allow_force_pushes: .allow_force_pushes,
                allow_deletions: .allow_deletions,
                block_creations: .block_creations,
                required_conversation_resolution: .required_conversation_resolution,
                lock_branch: .lock_branch,
                allow_fork_syncing: .allow_fork_syncing
              }
            '
          }

          normalize_current_protection() {
            jq -ce '
              def identities($key):
                map(
                  if type == "string" then .
                  elif $key == "users" then .login
                  else .slug
                  end
                ) | sort;
              {
                enforce_admins: .enforce_admins.enabled,
                required_status_checks:
                  (if .required_status_checks == null then null else {
                    strict: .required_status_checks.strict,
                    contexts: (.required_status_checks.contexts | sort)
                  } end),
                required_pull_request_reviews:
                  (if .required_pull_request_reviews == null then null else {
                    dismiss_stale_reviews:
                      (.required_pull_request_reviews.dismiss_stale_reviews // false),
                    require_code_owner_reviews:
                      (.required_pull_request_reviews.require_code_owner_reviews // false),
                    required_approving_review_count:
                      (.required_pull_request_reviews.required_approving_review_count // 0),
                    require_last_push_approval:
                      (.required_pull_request_reviews.require_last_push_approval // false),
                    dismissal_restrictions: {
                      users: ((.required_pull_request_reviews.dismissal_restrictions.users // []) | identities("users")),
                      teams: ((.required_pull_request_reviews.dismissal_restrictions.teams // []) | identities("teams"))
                    },
                    bypass_pull_request_allowances: {
                      users: ((.required_pull_request_reviews.bypass_pull_request_allowances.users // []) | identities("users")),
                      teams: ((.required_pull_request_reviews.bypass_pull_request_allowances.teams // []) | identities("teams")),
                      apps: ((.required_pull_request_reviews.bypass_pull_request_allowances.apps // []) | identities("apps"))
                    }
                  } end),
                restrictions:
                  (if .restrictions == null then null else {
                    users: ((.restrictions.users // []) | identities("users")),
                    teams: ((.restrictions.teams // []) | identities("teams")),
                    apps: ((.restrictions.apps // []) | identities("apps"))
                  } end),
                required_linear_history: (.required_linear_history.enabled // false),
                allow_force_pushes: (.allow_force_pushes.enabled // false),
                allow_deletions: (.allow_deletions.enabled // false),
                block_creations: (.block_creations.enabled // false),
                required_conversation_resolution:
                  (.required_conversation_resolution.enabled // false),
                lock_branch: (.lock_branch.enabled // false),
                allow_fork_syncing: (.allow_fork_syncing.enabled // false)
              }
            '
          }

          # Probe an endpoint for its HTTP status line.
          #
          # This deliberately does NOT use retry(): reading a status code requires
          # the stdout of a call that FAILS (a 404 is the answer, not an error), and
          # retry() correctly withholds a failed attempt's stdout (issue #805).
          #
          # It still retries the cases worth retrying: no status line at all (the
          # request never reached GitHub), and transient 5xx/429. A definitive status
          # -- including 404, which is the answer that drives first-time Pages
          # creation -- is returned immediately. Returns non-zero with no output when
          # the status stays unknown, so callers can decline to guess rather than pick
          # a branch on a blank value.
          http_status() {
            local endpoint="$1" response code attempt=1 max=3
            while [ "$attempt" -le "$max" ]; do
              response=$(gh api "$endpoint" --include 2>/dev/null || true)
              code=$(printf '%s\n' "$response" | head -1 | awk '{print $2}')
              if printf '%s' "$code" | grep -qE '^[0-9]{3}$'; then
                # A 429 means we are under a rate-limit embargo. Re-requesting a few
                # seconds later just deepens it, and this probe has no business
                # sleeping until the reset, so report unknown and let the caller
                # decline to act this run.
                if [ "$code" = "429" ]; then
                  echo "[WARN] HTTP 429 from ${endpoint} -- rate limited, not retrying" >&2
                  break
                fi
                # 5xx is transient, not an answer. Accepting one would read as
                # "not 404", sending the caller down the update path against a Pages
                # site that does not exist yet.
                if printf '%s' "$code" | grep -qE '^5[0-9]{2}$'; then
                  if [ "$attempt" -lt "$max" ]; then
                    echo "[WARN] Transient HTTP ${code} from ${endpoint} (attempt ${attempt}/${max}) -- retrying" >&2
                    sleep 2
                    attempt=$((attempt + 1))
                    continue
                  fi
                  break
                fi
                printf '%s\n' "$code"
                return 0
              fi
              if [ "$attempt" -lt "$max" ]; then
                echo "[WARN] No HTTP status from ${endpoint} (attempt ${attempt}/${max}) -- retrying" >&2
                sleep 2
              fi
              attempt=$((attempt + 1))
            done
            echo "[WARN] Could not determine HTTP status for ${endpoint} after ${max} attempts" >&2
            return 1
          }

          # --- Exact-receipt fetch helper (canonical: tests/fixtures/fetch-governed.sh) ---
          fetch_governed() {
            local key="$1" fallback="$2" api_file decoded_file err_file
            local receipt_sha receipt_size decoded_sha decoded_size

            if ! printf '%s' "${expected_source_sha:-}" | grep -qE '^[0-9a-f]{40}$'; then
              echo "[ERROR] Could not resolve an exact docs-control source commit" >&2
              return 1
            fi
            if [[ "$fallback" == *[?#]* ]]; then
              echo "[ERROR] Governed API path already contains a query or fragment for ${key}" >&2
              return 1
            fi

            api_file=$(mktemp)
            decoded_file=$(mktemp)
            err_file=$(mktemp)
            if ! retry 3 gh api "${fallback}?ref=${expected_source_sha}" >"$api_file" 2>"$err_file"; then
              echo "[ERROR] gh api failed for ${key}:" >&2
              cat "$err_file" >&2
              rm -f "$api_file" "$decoded_file" "$err_file"
              return 1
            fi
            if ! jq -e '
              .type == "file" and .encoding == "base64" and
              (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
              (.size | type == "number" and floor == . and . >= 0) and
              (.content | type == "string") and
              (.size == 0 or (.content | length > 0))
            ' "$api_file" >/dev/null 2>&1; then
              echo "[ERROR] gh api returned an invalid content envelope for ${key}" >&2
              rm -f "$api_file" "$decoded_file" "$err_file"
              return 1
            fi
            if ! jq -r '.content' "$api_file" | tr -d '\n' | base64 -d >"$decoded_file"; then
              echo "[ERROR] gh api returned invalid base64 content for ${key}" >&2
              rm -f "$api_file" "$decoded_file" "$err_file"
              return 1
            fi
            receipt_sha=$(jq -r '.sha' "$api_file")
            receipt_size=$(jq -r '.size' "$api_file")
            decoded_sha=$(git hash-object "$decoded_file")
            decoded_size=$(wc -c <"$decoded_file" | tr -d ' ')
            if [ "$decoded_sha" != "$receipt_sha" ] || [ "$decoded_size" != "$receipt_size" ]; then
              echo "[ERROR] Decoded bytes do not match the content receipt for ${key}" >&2
              rm -f "$api_file" "$decoded_file" "$err_file"
              return 1
            fi
            cat "$decoded_file"
            rm -f "$api_file" "$decoded_file" "$err_file"
          }

          ensure_current_source_main() {
            local current_source_sha source_status
            if ! current_source_sha=$(retry 3 gh api \
              "repos/${GITHUB_REPOSITORY_OWNER}/docs-control/commits/main" --jq '.sha'); then
              echo "[ERROR] Could not resolve protected docs-control main" >&2
              return 1
            fi
            if ! printf '%s' "$current_source_sha" | grep -qE '^[0-9a-f]{40}$'; then
              echo "[ERROR] Protected docs-control main returned an invalid commit" >&2
              return 1
            fi
            if [ "$expected_source_sha" = "$current_source_sha" ]; then
              return 0
            fi
            if ! source_status=$(retry 3 gh api \
              "repos/${GITHUB_REPOSITORY_OWNER}/docs-control/compare/${expected_source_sha}...${current_source_sha}" \
              --jq '.status'); then
              echo "[ERROR] Could not prove the source receipt is on protected docs-control main" >&2
              return 1
            fi
            if [ "$source_status" != "ahead" ]; then
              echo "[ERROR] Source receipt is not an approved protected-main commit" >&2
              return 1
            fi
            if ! gh workflow run enforce-repo-settings.yml \
              --repo "$GITHUB_REPOSITORY" --ref main \
              -f source_sha="$current_source_sha"; then
              echo "[ERROR] Could not enqueue the current protected-main receipt" >&2
              return 1
            fi
            echo "[DEFER] Docs-control protected main advanced; enqueued its exact receipt"
            return 78
          }

          require_current_source_main() {
            local receipt_rc=0
            ensure_current_source_main || receipt_rc=$?
            case "$receipt_rc" in
              0) return 0 ;;
              78) exit 0 ;;
              *) exit 1 ;;
            esac
          }

          expected_source_sha="${SOURCE_SHA:-}"
          if [ -z "$expected_source_sha" ] && [ "$EVENT_NAME" != "workflow_call" ]; then
            expected_source_sha="$EVENT_SHA"
          fi

          if ! printf '%s' "$expected_source_sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "[ERROR] Could not resolve an exact docs-control source commit" >&2
            exit 1
          fi
          require_current_source_main
          echo "[OK] Governed reads bound to source ${expected_source_sha:0:8}"

          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          CONFIG_REPO="${GITHUB_REPOSITORY_OWNER}/docs-control"
          CONFIG_PATH=".github/config/repo-settings.json"

          # --- Phase 1: Validate ---------------------------------------------
          echo "=== Phase 1: Validate ==="

          if ! command -v jq &>/dev/null; then
            echo "[ERROR] jq is not installed" >&2; exit 1
          fi
          if ! command -v gh &>/dev/null; then
            echo "[ERROR] gh CLI is not installed" >&2; exit 1
          fi
          if ! gh auth status &>/dev/null; then
            echo "[ERROR] gh is not authenticated" >&2; exit 1
          fi

          # Fetch central config from docs-control
          echo "[INFO] Fetching config from ${CONFIG_REPO}/${CONFIG_PATH}..."
          CONFIG=$(fetch_governed "repo-settings.json" "repos/${CONFIG_REPO}/contents/${CONFIG_PATH}")
          if ! echo "$CONFIG" | jq empty 2>/dev/null; then
            echo "[ERROR] Failed to fetch or parse config from ${CONFIG_REPO}" >&2; exit 1
          fi
          echo "[OK] Fetched config from ${CONFIG_REPO}"

          # Auto-compute homepage if empty
          HOMEPAGE=$(echo "$CONFIG" | jq -r '.repository.homepage // empty')
          if [ -z "$HOMEPAGE" ]; then
            HOMEPAGE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO}/"
            CONFIG=$(echo "$CONFIG" | jq --arg hp "$HOMEPAGE" '.repository.homepage = $hp')
            echo "[INFO] Auto-computed homepage: $HOMEPAGE"
          fi

          echo "[OK] Config validated for ${OWNER}/${REPO}"

          # --- Self-detection --------------------------------------------------
          SOURCE_REPO=$(echo "$CONFIG" | jq -r '.managed_files.source_repo // empty')
          IS_SELF=false
          if [ "$SOURCE_REPO" = "$GITHUB_REPOSITORY" ]; then
            IS_SELF=true
            echo "[INFO] Running on source repo -- will use self_contexts if present"
          fi

          # --- Phase 2: Apply repo settings ------------------------------------
          echo ""
          echo "=== Phase 2: Apply repo settings ==="

          DESIRED_REPO=$(echo "$CONFIG" | jq -c '.repository')
          CURRENT_REPO=$(retry 3 gh api "repos/${OWNER}/${REPO}")

          REPO_DRIFT=false
          REPO_PATCH="{}"

          for key in $(echo "$DESIRED_REPO" | jq -r 'keys[]'); do
            desired_val=$(echo "$DESIRED_REPO" | jq -c ".[\"$key\"]")
            current_val=$(echo "$CURRENT_REPO" | jq -c ".[\"$key\"]")
            if [ "$desired_val" != "$current_val" ]; then
              echo "[WARN] Drift in repo.$key: current=$current_val desired=$desired_val"
              REPO_PATCH=$(echo "$REPO_PATCH" | jq --argjson v "$desired_val" ". + {\"$key\": \$v}")
              REPO_DRIFT=true
            fi
          done

          if [ "$REPO_DRIFT" = true ]; then
            echo "[INFO] Patching repository settings..."
            require_current_source_main
            retry_current_json 3 "$REPO_PATCH" "repos/${OWNER}/${REPO}" --method PATCH >/dev/null
            echo "[OK] Repository settings updated"
          else
            echo "[OK] Repository settings match -- no changes needed"
          fi

          # --- Phase 3: Apply Actions permissions ------------------------------
          echo ""
          echo "=== Phase 3: Apply Actions permissions ==="

          DESIRED_ACTIONS=$(echo "$CONFIG" | jq -c '.actions_permissions // empty')

          if [ -n "$DESIRED_ACTIONS" ]; then
            CURRENT_ACTIONS=$(retry 3 gh api "repos/${OWNER}/${REPO}/actions/permissions/workflow")
            ACTIONS_DRIFT=false

            for key in $(echo "$DESIRED_ACTIONS" | jq -r 'keys[]'); do
              desired_val=$(echo "$DESIRED_ACTIONS" | jq -c ".[\"$key\"]")
              current_val=$(echo "$CURRENT_ACTIONS" | jq -c ".[\"$key\"]")
              if [ "$desired_val" != "$current_val" ]; then
                echo "[WARN] Drift in actions.$key: current=$current_val desired=$desired_val"
                ACTIONS_DRIFT=true
              fi
            done

            if [ "$ACTIONS_DRIFT" = true ]; then
              echo "[INFO] Updating Actions workflow permissions..."
              require_current_source_main
              retry_current_json 3 "$DESIRED_ACTIONS" "repos/${OWNER}/${REPO}/actions/permissions/workflow" \
                --method PUT >/dev/null
              echo "[OK] Actions permissions updated"
            else
              echo "[OK] Actions permissions match -- no changes needed"
            fi
          else
            echo "[SKIP] No actions_permissions in config"
          fi

          # --- Phase 3b: Apply fork-PR workflow approval -----------------------
          # Require maintainer approval before Actions workflows (and therefore
          # the required status checks) run on PRs from the configured
          # contributor class. With "all_external_contributors" an outside/fork
          # PR cannot go green -- and so cannot auto-merge -- until a maintainer
          # approves the run. Defense in depth behind the author-trust gate in
          # auto-merge.yml.
          echo ""
          echo "=== Phase 3b: Apply fork-PR workflow approval ==="

          DESIRED_FORK_APPROVAL=$(echo "$CONFIG" | jq -c '.actions_fork_pr_approval // empty')

          if [ -n "$DESIRED_FORK_APPROVAL" ]; then
            FORK_APPROVAL_EP="repos/${OWNER}/${REPO}/actions/permissions/fork-pr-contributor-approval"
            CURRENT_FORK_APPROVAL=$(retry 3 gh api "$FORK_APPROVAL_EP")
            desired_policy=$(echo "$DESIRED_FORK_APPROVAL" | jq -r '.approval_policy')
            current_policy=$(echo "$CURRENT_FORK_APPROVAL" | jq -r '.approval_policy // empty')
            if [ "$desired_policy" != "$current_policy" ]; then
              echo "[WARN] Drift in fork_pr_approval: current=$current_policy desired=$desired_policy"
              require_current_source_main
              retry_current_json 3 "$DESIRED_FORK_APPROVAL" "$FORK_APPROVAL_EP" --method PUT >/dev/null
              echo "[OK] Fork-PR approval policy updated to $desired_policy"
            else
              echo "[OK] Fork-PR approval policy matches ($current_policy) -- no changes needed"
            fi
          else
            echo "[SKIP] No actions_fork_pr_approval in config"
          fi

          # --- Phase 4: Apply branch protection --------------------------------
          echo ""
          echo "=== Phase 4: Apply branch protection ==="

          BRANCH_COUNT=$(echo "$CONFIG" | jq '.branch_protection | length')

          for i in $(seq 0 $((BRANCH_COUNT - 1))); do
            BRANCH=$(echo "$CONFIG" | jq -r ".branch_protection[$i].branch")
            echo "--- Branch: $BRANCH ---"

            DESIRED_PAYLOAD=$(echo "$CONFIG" | jq -c ".branch_protection[$i] | del(.branch)")

            # self_contexts override: use self_contexts instead of contexts for source repo
            if [ "$IS_SELF" = true ]; then
              SELF_CTX=$(echo "$DESIRED_PAYLOAD" | jq -c '.required_status_checks.self_contexts // empty')
              if [ -n "$SELF_CTX" ] && [ "$SELF_CTX" != "null" ]; then
                DESIRED_PAYLOAD=$(echo "$DESIRED_PAYLOAD" | jq -c \
                  '.required_status_checks.contexts = .required_status_checks.self_contexts')
                echo "[INFO] Overriding contexts with self_contexts for source repo"
              fi
            fi
            # Strip self_contexts from payload (not part of GitHub API)
            DESIRED_PAYLOAD=$(echo "$DESIRED_PAYLOAD" | jq -c \
              'if .required_status_checks then
                .required_status_checks |= del(.self_contexts)
              else . end')

            # Merge per-repo additional contexts from repo_overrides
            REPO_OVERRIDES=$(echo "$CONFIG" | jq -c ".repo_overrides[\"${REPO}\"] // empty")
            if [ -n "$REPO_OVERRIDES" ] && [ "$REPO_OVERRIDES" != "null" ]; then
              if [ "$IS_SELF" = true ]; then
                EXTRA_CTX=$(echo "$REPO_OVERRIDES" | jq -c '.additional_self_contexts // []')
              else
                EXTRA_CTX=$(echo "$REPO_OVERRIDES" | jq -c '.additional_contexts // []')
              fi
              if [ "$EXTRA_CTX" != "[]" ]; then
                DESIRED_PAYLOAD=$(echo "$DESIRED_PAYLOAD" | jq -c \
                  --argjson extra "$EXTRA_CTX" \
                  '.required_status_checks.contexts = (.required_status_checks.contexts + $extra | unique)')
                echo "[INFO] Merged additional contexts for ${REPO}: $EXTRA_CTX"
              fi

              # Subtract per-repo excluded_required_contexts (e.g. deferred super-linter)
              EXCLUDED_CTX=$(echo "$REPO_OVERRIDES" | jq -c '.excluded_required_contexts // []')
              if [ "$EXCLUDED_CTX" != "[]" ]; then
                DESIRED_PAYLOAD=$(echo "$DESIRED_PAYLOAD" | jq -c \
                  --argjson excluded "$EXCLUDED_CTX" \
                  '.required_status_checks.contexts = (.required_status_checks.contexts - $excluded)')
                echo "[INFO] Excluded required contexts for ${REPO}: $EXCLUDED_CTX"
              fi
            fi

            set +e
            CURRENT_PROTECTION=$(api_value_or_404 \
              "repos/${OWNER}/${REPO}/branches/${BRANCH}/protection" '.')
            PROTECTION_READ_RC=$?
            set -e
            case "$PROTECTION_READ_RC" in
              0)
                if ! echo "$CURRENT_PROTECTION" | jq -e 'type == "object"' >/dev/null; then
                  echo "[ERROR] Branch-protection API returned an invalid response" >&2
                  exit 1
                fi
                ;;
              44) CURRENT_PROTECTION="" ;;
              *) exit 1 ;;
            esac

            PROTECTION_DRIFT=false

            if [ "$PROTECTION_READ_RC" = 44 ]; then
              echo "[WARN] No branch protection found -- will create"
              PROTECTION_DRIFT=true
            else
              DESIRED_PROTECTION_STATE=$(echo "$DESIRED_PAYLOAD" | normalize_desired_protection)
              CURRENT_PROTECTION_STATE=$(echo "$CURRENT_PROTECTION" | normalize_current_protection)
              if [ "$DESIRED_PROTECTION_STATE" != "$CURRENT_PROTECTION_STATE" ]; then
                echo "[WARN] Branch protection does not match desired state"
                PROTECTION_DRIFT=true
              fi
            fi

            if [ "$PROTECTION_DRIFT" = true ]; then
              echo "[INFO] Applying branch protection for $BRANCH..."

              PUT_PAYLOAD=$(jq -n \
                --argjson desired "$DESIRED_PAYLOAD" \
                '{
                  enforce_admins: $desired.enforce_admins,
                  required_status_checks: $desired.required_status_checks,
                  required_pull_request_reviews: $desired.required_pull_request_reviews,
                  restrictions: $desired.restrictions,
                  required_linear_history: $desired.required_linear_history,
                  allow_force_pushes: $desired.allow_force_pushes,
                  allow_deletions: $desired.allow_deletions,
                  block_creations: $desired.block_creations,
                  required_conversation_resolution: $desired.required_conversation_resolution,
                  lock_branch: $desired.lock_branch,
                  allow_fork_syncing: $desired.allow_fork_syncing
                }')

              require_current_source_main
              retry_current_json 3 "$PUT_PAYLOAD" "repos/${OWNER}/${REPO}/branches/${BRANCH}/protection" \
                --method PUT >/dev/null
              echo "[OK] Branch protection updated for $BRANCH"
            else
              echo "[OK] Branch protection matches -- no changes needed"
            fi
          done

          # --- Phase 5: Apply topics --------------------------------------------
          echo ""
          echo "=== Phase 5: Apply topics ==="

          DESIRED_TOPICS=$(echo "$CONFIG" | jq -c '.topics // []')
          if [ "$DESIRED_TOPICS" != "[]" ]; then
            CURRENT_TOPICS=$(retry 3 gh api "repos/${OWNER}/${REPO}/topics" | jq -c '.names // []')
            if [ "$DESIRED_TOPICS" != "$CURRENT_TOPICS" ]; then
              echo "[WARN] Drift in topics: current=$CURRENT_TOPICS desired=$DESIRED_TOPICS"
              echo "[INFO] Updating topics..."
              TOPICS_JSON=$(jq -n --argjson names "$DESIRED_TOPICS" '{"names": $names}')
              require_current_source_main
              retry_current_json 3 "$TOPICS_JSON" "repos/${OWNER}/${REPO}/topics" --method PUT >/dev/null
              echo "[OK] Topics updated"
            else
              echo "[OK] Topics match -- no changes needed"
            fi
          else
            echo "[SKIP] No topics specified"
          fi

          # --- Phase 6: Apply Pages ---------------------------------------------
          echo ""
          echo "=== Phase 6: Apply Pages ==="

          PAGES_ENABLED=$(echo "$CONFIG" | jq -r '.pages.enabled // false')
          DESIRED_BUILD_TYPE=$(echo "$CONFIG" | jq -r '.pages.build_type // "workflow"')
          if [ "$PAGES_ENABLED" = "true" ]; then
            PAGES_HTTP_CODE=$(http_status "repos/${OWNER}/${REPO}/pages") || true
            PAGES_JSON=$(jq -n --arg bt "$DESIRED_BUILD_TYPE" '{"build_type": $bt, "source": {"branch": "main", "path": "/"}}')
            if [ -z "$PAGES_HTTP_CODE" ]; then
              echo "[WARN] Pages status unknown -- skipping Pages phase rather than guessing between create and update"
            elif [ "$PAGES_HTTP_CODE" = "404" ]; then
              echo "[INFO] Enabling GitHub Pages with ${DESIRED_BUILD_TYPE} source..."
              require_current_source_main
              retry_current_json 3 "$PAGES_JSON" "repos/${OWNER}/${REPO}/pages" --method POST >/dev/null 2>&1
              echo "[OK] Pages enabled with build_type=${DESIRED_BUILD_TYPE}"
            else
              PAGES_RESPONSE=$(retry 3 gh api "repos/${OWNER}/${REPO}/pages")
              if ! echo "$PAGES_RESPONSE" | jq -e '
                type == "object" and (.build_type | type == "string" and length > 0)
              ' >/dev/null; then
                echo "[ERROR] Pages API returned an invalid response" >&2
                exit 1
              fi
              CURRENT_BUILD_TYPE=$(echo "$PAGES_RESPONSE" | jq -r '.build_type')
              if [ "$CURRENT_BUILD_TYPE" != "$DESIRED_BUILD_TYPE" ]; then
                echo "[WARN] Drift in pages.build_type: current=$CURRENT_BUILD_TYPE desired=$DESIRED_BUILD_TYPE"
                echo "[INFO] Updating Pages build_type to ${DESIRED_BUILD_TYPE}..."
                require_current_source_main
                retry_current_json 3 "$PAGES_JSON" "repos/${OWNER}/${REPO}/pages" --method PUT >/dev/null 2>&1
                echo "[OK] Pages build_type updated to ${DESIRED_BUILD_TYPE}"
              else
                echo "[OK] Pages build_type matches (${CURRENT_BUILD_TYPE}) -- no changes needed"
              fi
            fi
          else
            echo "[SKIP] Pages not enabled in config"
          fi

          # --- Phase 7: Enforce secrets -----------------------------------------
          echo ""
          echo "=== Phase 7: Enforce secrets ==="

          SECRETS_MANIFEST=$(echo "$CONFIG" | jq -c '.secrets_manifest // empty')

          if [ -z "$SECRETS_MANIFEST" ] || [ "$SECRETS_MANIFEST" = "null" ]; then
            echo "[SKIP] No secrets_manifest in config"
          else
            # Resolve roles for this repo
            REPO_ROLES=$(echo "$SECRETS_MANIFEST" | jq -r \
              --arg repo "$REPO" \
              'if .repo_roles[$repo] then .repo_roles[$repo][]
               else .repo_roles["_default"][]
               end')

            # Build expected secrets set from roles
            EXPECTED_SECRETS=""
            for role in $REPO_ROLES; do
              ROLE_SECRETS=$(echo "$SECRETS_MANIFEST" | jq -r \
                --arg r "$role" '.roles[$r] // [] | .[]')
              EXPECTED_SECRETS=$(printf '%s\n%s' "$EXPECTED_SECRETS" "$ROLE_SECRETS")
            done
            EXPECTED_SECRETS=$(echo "$EXPECTED_SECRETS" | sort -u | grep -v '^$')

            if [ -z "$EXPECTED_SECRETS" ]; then
              echo "[SKIP] No secrets expected for ${REPO}"
            else
              echo "[INFO] Expected secrets for ${REPO}: $(echo "$EXPECTED_SECRETS" | tr '\n' ', ' | sed 's/,$//')"

              # List current secrets
              SECRETS_RECEIPT=$(mktemp)
              if ! retry 3 gh api \
                "repos/${OWNER}/${REPO}/actions/secrets?per_page=100" \
                --paginate --slurp >"$SECRETS_RECEIPT"; then
                echo "[ERROR] Could not inventory repository secrets" >&2
                rm -f "$SECRETS_RECEIPT"
                exit 1
              fi
              if ! jq -e '
                type == "array" and length > 0 and
                all(.[]; type == "object" and
                  (.total_count | type == "number" and floor == . and . >= 0) and
                  (.secrets | type == "array") and
                  all(.secrets[]; .name | type == "string" and length > 0)) and
                ([.[].total_count] | unique | length == 1) and
                ([.[].secrets[].name] | length) ==
                  ([.[].secrets[].name] | unique | length) and
                .[0].total_count == ([.[].secrets[].name] | length)
              ' "$SECRETS_RECEIPT" >/dev/null; then
                echo "[ERROR] Repository secret inventory is incomplete or invalid" >&2
                rm -f "$SECRETS_RECEIPT"
                exit 1
              fi
              CURRENT_SECRETS=$(jq -r '[.[].secrets[].name] | sort | .[]' "$SECRETS_RECEIPT")
              rm -f "$SECRETS_RECEIPT"

              # Detect missing
              MISSING=0
              while IFS= read -r secret; do
                [ -z "$secret" ] && continue
                if ! echo "$CURRENT_SECRETS" | grep -qxF "$secret"; then
                  echo "[WARN] Missing ${secret}"
                  MISSING=$((MISSING + 1))
                fi
              done <<< "$EXPECTED_SECRETS"

              # Detect unexpected
              UNEXPECTED=0
              while IFS= read -r secret; do
                [ -z "$secret" ] && continue
                if ! echo "$EXPECTED_SECRETS" | grep -qxF "$secret"; then
                  echo "[INFO] Unexpected secret: ${secret} (not in assigned roles)"
                  UNEXPECTED=$((UNEXPECTED + 1))
                fi
              done <<< "$CURRENT_SECRETS"

              if [ "$MISSING" -gt 0 ]; then
                echo "[ERROR] Missing required repository secret(s): ${MISSING}" >&2
                exit 1
              fi
              echo "[OK] Secrets audit: missing=0, unexpected=${UNEXPECTED}"
            fi
          fi

          # --- Phase 8: Verify --------------------------------------------------
          echo ""
          echo "=== Phase 8: Verify ==="

          VERIFY_FAILED=false

          VERIFY_REPO=$(retry 3 gh api "repos/${OWNER}/${REPO}")
          for key in $(echo "$DESIRED_REPO" | jq -r 'keys[]'); do
            desired_val=$(echo "$DESIRED_REPO" | jq -c ".[\"$key\"]")
            actual_val=$(echo "$VERIFY_REPO" | jq -c ".[\"$key\"]")
            if [ "$desired_val" != "$actual_val" ]; then
              echo "[FAIL] repo.$key: expected=$desired_val actual=$actual_val"
              VERIFY_FAILED=true
            fi
          done

          if [ -n "$DESIRED_ACTIONS" ]; then
            VERIFY_ACTIONS=$(retry 3 gh api "repos/${OWNER}/${REPO}/actions/permissions/workflow")
            for key in $(echo "$DESIRED_ACTIONS" | jq -r 'keys[]'); do
              desired_val=$(echo "$DESIRED_ACTIONS" | jq -c ".[\"$key\"]")
              actual_val=$(echo "$VERIFY_ACTIONS" | jq -c ".[\"$key\"]")
              if [ "$desired_val" != "$actual_val" ]; then
                echo "[FAIL] actions.$key: expected=$desired_val actual=$actual_val"
                VERIFY_FAILED=true
              fi
            done
          fi

          if [ -n "$DESIRED_FORK_APPROVAL" ]; then
            VERIFY_FORK=$(retry 3 gh api "repos/${OWNER}/${REPO}/actions/permissions/fork-pr-contributor-approval")
            desired_policy=$(echo "$DESIRED_FORK_APPROVAL" | jq -r '.approval_policy')
            actual_policy=$(echo "$VERIFY_FORK" | jq -r '.approval_policy // empty')
            if [ "$desired_policy" != "$actual_policy" ]; then
              echo "[FAIL] fork_pr_approval: expected=$desired_policy actual=$actual_policy"
              VERIFY_FAILED=true
            fi
          fi

          for i in $(seq 0 $((BRANCH_COUNT - 1))); do
            BRANCH=$(echo "$CONFIG" | jq -r ".branch_protection[$i].branch")
            DESIRED_PAYLOAD=$(echo "$CONFIG" | jq -c ".branch_protection[$i] | del(.branch)")

            # self_contexts override (same as Phase 4)
            if [ "$IS_SELF" = true ]; then
              SELF_CTX=$(echo "$DESIRED_PAYLOAD" | jq -c '.required_status_checks.self_contexts // empty')
              if [ -n "$SELF_CTX" ] && [ "$SELF_CTX" != "null" ]; then
                DESIRED_PAYLOAD=$(echo "$DESIRED_PAYLOAD" | jq -c \
                  '.required_status_checks.contexts = .required_status_checks.self_contexts')
              fi
            fi
            DESIRED_PAYLOAD=$(echo "$DESIRED_PAYLOAD" | jq -c \
              'if .required_status_checks then
                .required_status_checks |= del(.self_contexts)
              else . end')

            # Merge per-repo additional contexts (same as Phase 4)
            REPO_OVERRIDES=$(echo "$CONFIG" | jq -c ".repo_overrides[\"${REPO}\"] // empty")
            if [ -n "$REPO_OVERRIDES" ] && [ "$REPO_OVERRIDES" != "null" ]; then
              if [ "$IS_SELF" = true ]; then
                EXTRA_CTX=$(echo "$REPO_OVERRIDES" | jq -c '.additional_self_contexts // []')
              else
                EXTRA_CTX=$(echo "$REPO_OVERRIDES" | jq -c '.additional_contexts // []')
              fi
              if [ "$EXTRA_CTX" != "[]" ]; then
                DESIRED_PAYLOAD=$(echo "$DESIRED_PAYLOAD" | jq -c \
                  --argjson extra "$EXTRA_CTX" \
                  '.required_status_checks.contexts = (.required_status_checks.contexts + $extra | unique)')
              fi

              # Subtract per-repo excluded_required_contexts (same as Phase 4)
              EXCLUDED_CTX=$(echo "$REPO_OVERRIDES" | jq -c '.excluded_required_contexts // []')
              if [ "$EXCLUDED_CTX" != "[]" ]; then
                DESIRED_PAYLOAD=$(echo "$DESIRED_PAYLOAD" | jq -c \
                  --argjson excluded "$EXCLUDED_CTX" \
                  '.required_status_checks.contexts = (.required_status_checks.contexts - $excluded)')
              fi
            fi

            VERIFY_PROTECTION=$(retry 3 gh api \
              "repos/${OWNER}/${REPO}/branches/${BRANCH}/protection")

            if [ -z "$VERIFY_PROTECTION" ]; then
              echo "[FAIL] Branch protection for $BRANCH not found after apply"
              VERIFY_FAILED=true
              continue
            fi

            DESIRED_PROTECTION_STATE=$(echo "$DESIRED_PAYLOAD" | normalize_desired_protection)
            VERIFIED_PROTECTION_STATE=$(echo "$VERIFY_PROTECTION" | normalize_current_protection)
            if [ "$DESIRED_PROTECTION_STATE" != "$VERIFIED_PROTECTION_STATE" ]; then
              echo "[FAIL] Branch protection failed exact verification for $BRANCH"
              VERIFY_FAILED=true
            fi
          done

          if [ "$PAGES_ENABLED" = "true" ]; then
            VERIFY_PAGES_CODE=$(http_status "repos/${OWNER}/${REPO}/pages") || true
            if [ -z "$VERIFY_PAGES_CODE" ]; then
              echo "[FAIL] Pages status could not be determined -- state is unverified, not confirmed"
              VERIFY_FAILED=true
            elif [ "$VERIFY_PAGES_CODE" = "404" ]; then
              echo "[FAIL] Pages not found after apply"
              VERIFY_FAILED=true
            else
              VERIFY_PAGES=$(retry 3 gh api "repos/${OWNER}/${REPO}/pages")
              if ! echo "$VERIFY_PAGES" | jq -e '
                type == "object" and (.build_type | type == "string" and length > 0)
              ' >/dev/null; then
                echo "[FAIL] Pages API returned an invalid verification response"
                VERIFY_FAILED=true
              else
                ACTUAL_BUILD_TYPE=$(echo "$VERIFY_PAGES" | jq -r '.build_type')
                if [ "$ACTUAL_BUILD_TYPE" != "$DESIRED_BUILD_TYPE" ]; then
                  echo "[FAIL] pages.build_type: expected=$DESIRED_BUILD_TYPE actual=$ACTUAL_BUILD_TYPE"
                  VERIFY_FAILED=true
                fi
              fi
            fi
          fi

          if [ "$VERIFY_FAILED" = true ]; then
            echo ""
            echo "[ERROR] Verification failed -- settings do not match desired state"
            exit 1
          fi

          require_current_source_main
          echo "[OK] All settings verified successfully"
