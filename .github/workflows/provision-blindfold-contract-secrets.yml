---
name: Provision Blindfold Contract Governance Secrets
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provision-blindfold-contract-governance-secrets
  cancel-in-progress: false
jobs:
  provision:
    environment: repository-settings
    runs-on: managed-socketless
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision the exact governance-role secret set
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          REPO_SETTINGS_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          REPO_SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = "f5-sales-demo/blindfold-contract"
          name = repository.split("/")[1]
          config = Path(".github/config")
          inventory = json.loads((config / "downstream-repos.json").read_text())
          settings = json.loads((config / "repo-settings.json").read_text())
          manifest = settings["secrets_manifest"]
          roles = manifest["repo_roles"].get(name)
          if name not in inventory or roles != ["governance"]:
              raise SystemExit("target must be the enrolled Blindfold Contract governance repository")
          names = manifest["roles"]["governance"]
          if names != ["REPO_SETTINGS_TOKEN", "REPO_SYNC_TOKEN"]:
              raise SystemExit("unexpected governance secret set")
          for secret in names:
              value = os.environ.get(secret, "")
              if not value:
                  raise SystemExit("required canonical governance credential is unavailable")
              subprocess.run(
                  ["gh", "secret", "set", secret, "--repo", repository],
                  input=value, text=True, check=True, capture_output=True,
              )
              print("Provisioned " + secret + " for " + repository)
          PY
