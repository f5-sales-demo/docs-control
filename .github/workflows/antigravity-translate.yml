name: Antigravity Language Translation

on:
  workflow_call:
    secrets:
      ANTIGRAVITY_TOKEN:
        required: true
      GCP_PROJECT_ID:
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - "**"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  antigravity-translate:
    # Security: restrict execution to trusted same-repo PR heads (exclude external forks)
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR Head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse Translation Triggers and Conventional Commits
        id: parse_trigger
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Fetch changed files in the branch
          git diff --name-only origin/main...HEAD > changed_files.txt || git diff --name-only HEAD~1 > changed_files.txt || touch changed_files.txt
          
          # Execute the trigger parser script
          bash scripts/parse-translation-trigger.sh "$PR_TITLE" changed_files.txt "$EVENT_NAME"

      - name: Install System Dependencies for Headless Keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 libsecret-1-0 gnome-keyring python3-pip python3-keyring

      - name: Install Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Keyring and Execute Antigravity AI Translator
        if: steps.parse_trigger.outputs.should_run == 'true'
        env:
          ANTIGRAVITY_TOKEN: ${{ secrets.ANTIGRAVITY_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          FORCE_RECONCILE: ${{ steps.parse_trigger.outputs.force_reconcile }}
        run: |
          dbus-run-session -- bash -c '
            # 1. Unlock gnome-keyring in headless session
            eval "$(echo "" | gnome-keyring-daemon --unlock --daemonize)"
            export SSH_AUTH_SOCK
            export GNOME_KEYRING_CONTROL
            export GNOME_KEYRING_PID
            
            # 2. Extract clean raw JSON from macOS keychain base64-encoded token
            RAW_TOKEN_JSON=$(echo "$ANTIGRAVITY_TOKEN" | sed "s/^go-keyring-base64://" | base64 -d)
            
            # 3. Store raw JSON in standard DBus Secret Service
            python3 -c "import keyring; keyring.set_password('\''gemini'\'', '\''antigravity'\'', \"\"\"$RAW_TOKEN_JSON\"\"\")"
            
            # 4. Automate workspace trust with Gemini 3.6 Flash (High) and global endpoint
            mkdir -p ~/.gemini/antigravity-cli
            echo "{\"gcp\": {\"project\": \"$GCP_PROJECT_ID\", \"location\": \"global\"}, \"model\": \"Gemini 3.6 Flash (High)\", \"trustedWorkspaces\": [\"/home/runner/work/$REPOSITORY_NAME/$REPOSITORY_NAME\"]}" > ~/.gemini/antigravity-cli/settings.json
            
            # 5. Configure git identity for automated translation commits
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # 6. Build the dynamic Antigravity Agentic Language Translator prompt
            PROMPT_INSTRUCTION="You are Antigravity, an elite agentic AI coding assistant and language translator. Your task is to maintain language translations for documentation under '\''docs/en/'\'' or '\''src/content/docs/en/'\'' across all 12 ecosystem target locales (fr, es, de, pt-br, ja, ko, zh-cn, zh-tw, ar, it, hi, th). Read .agents/skills/i18n-translate/SKILL.md for instructions."

            if [ "$FORCE_RECONCILE" == "true" ]; then
              PROMPT_INSTRUCTION="$PROMPT_INSTRUCTION FIRST, PERFORM A FULL RECONCILIATION: force re-translation of all English documentation from scratch, completely overwriting all target locale translation files and ignoring any existing i18n.sourceHash matches."
            else
              PROMPT_INSTRUCTION="$PROMPT_INSTRUCTION FIRST, identify any created, modified, or deleted English documentation. For each created or modified file, check if target locale files exist and translate or update them. For each deleted English file under '\''docs/en/'\'' or '\''src/content/docs/en/'\'', identify and delete its corresponding target translation files under all 12 target locales."
            fi

            PROMPT_INSTRUCTION="$PROMPT_INSTRUCTION Finally, stage all updated and deleted files, commit them with '\''chore(i18n): update translations via Antigravity [skip ci]'\'' and push them back to the PR branch."

            # 7. Run the Antigravity Agentic Language Translator using --dangerously-skip-permissions
            /home/runner/.local/bin/agy --project "$GCP_PROJECT_ID" --dangerously-skip-permissions --print-timeout 25m --print "$PROMPT_INSTRUCTION"
          '
