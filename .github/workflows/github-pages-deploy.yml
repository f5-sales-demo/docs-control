---
name: Build and Deploy Docs
on:
  workflow_call:
    inputs:
      content-ref:
        description: 'Exact 40-character commit SHA to build from the content repo'
        required: true
        type: string
      content-path:
        description: 'Path to content directory in the calling repo'
        required: false
        default: 'docs'
        type: string
      builder-image:
        description: 'Approved builder Docker image selector (latest or immutable digest)'
        required: false
        default: 'ghcr.io/f5-sales-demo/docs-builder:latest'
        type: string
      shared-mode:
        description: 'auto selects root publishing or ecosystem consuming; local is explicit development mode'
        required: false
        default: 'auto'
        type: string
      snapshot-tag:
        description: 'Exact immutable content-* release tag for a machine corpus'
        required: false
        default: ''
        type: string
      publication-sha256:
        description: 'Expected SHA-256 digest of the snapshot publication.json receipt'
        required: false
        default: ''
        type: string
      snapshot-verifier-ref:
        description: 'Exact docs-control commit SHA containing the snapshot verifier'
        required: false
        default: ''
        type: string
      docs-title:
        description: 'Documentation site title (overrides frontmatter)'
        required: false
        type: string
      docs-site:
        description: 'Documentation site URL'
        required: false
        default: 'https://f5-sales-demo.github.io'
        type: string
      docs-base:
        description: 'Site base path; empty uses the builder repository default'
        required: false
        default: ''
        type: string
      socketless_runner_label:
        description: 'Policy-approved repository-scoped ARC socketless label'
        required: false
        default: ''
        type: string
      container_build_runner_label:
        description: 'Policy-approved repository-scoped ARC container-build label'
        required: false
        default: ''
        type: string
permissions: {}

concurrency:
  group: pages-${{ github.repository }}
  # Queue Pages deployments; never cancel an in-flight deploy. Cancelling mid-
  # deploy leaves the Pages backend with a superseded deployment and the next
  # run fails with "Deployment failed, try again later" (see actions/deploy-pages).
  cancel-in-progress: false

jobs:
  trust-gate:
    name: Verify trusted Pages invocation
    runs-on: ${{ inputs.socketless_runner_label || fromJSON(format('["self-hosted","Linux","X64","{0}","ubuntu-24.04"]', github.event.repository.name)) }}
    steps:
      - name: Reject untrusted invocations
        run: |
          set -euo pipefail
          if [[ -z "$SOCKETLESS_RUNNER_LABEL" && -z "$CONTAINER_BUILD_RUNNER_LABEL" ]]; then
            : # Legacy caller: retain the canonical five-label routes.
          elif [[ -z "$SOCKETLESS_RUNNER_LABEL" || -z "$CONTAINER_BUILD_RUNNER_LABEL" ]]; then
            echo "::error::socketless_runner_label and container_build_runner_label must be supplied together"
            exit 1
          elif [[ ! "$SOCKETLESS_RUNNER_LABEL" =~ ^[a-z0-9][a-z0-9.-]*$ ]] ||
            [[ ! "$CONTAINER_BUILD_RUNNER_LABEL" =~ ^[a-z0-9][a-z0-9.-]*$ ]] ||
            [[ "$SOCKETLESS_RUNNER_LABEL" == "$CONTAINER_BUILD_RUNNER_LABEL" ]]; then
            echo "::error::ARC runner labels must be distinct safe scalar labels"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then exit 0; fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then exit 0; fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if [[ -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
              exit 0
            fi
            echo "::error::Docker-capable docs builds are forbidden for fork pull requests."
            exit 1
          fi
          echo "::error::unsupported event or non-default branch"
          exit 1
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONTAINER_BUILD_RUNNER_LABEL: ${{ inputs.container_build_runner_label }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          SOCKETLESS_RUNNER_LABEL: ${{ inputs.socketless_runner_label }}

  build:
    name: Build Documentation
    needs: trust-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ inputs.container_build_runner_label || fromJSON(format('["self-hosted","Linux","X64","{0}","container-build"]', github.event.repository.name)) }}
    permissions:
      contents: read # checkout the documentation source
      packages: read # authenticate and resolve the latest builder image from GHCR
    outputs:
      build-status: ${{ job.status }}
    steps:
      - name: Resolve immutable content commit
        id: content
        env:
          REQUESTED_REF: ${{ inputs.content-ref }}
        run: |
          set -euo pipefail
          CONTENT_REF="$REQUESTED_REF"
          if [[ ! "$CONTENT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::content-ref must be a full lowercase 40-character commit SHA"
            exit 1
          fi
          echo "content_ref=$CONTENT_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout content repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.content.outputs.content_ref }}
          persist-credentials: false

      - name: Verify checked-out content commit
        env:
          CONTENT_REF: ${{ steps.content.outputs.content_ref }}
          CONTENT_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
        run: |
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if [ "$CHECKED_OUT_SHA" != "$CONTENT_REF" ]; then
            echo "::error::Checked-out commit does not match content-ref"
            exit 1
          fi
          if [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "::error::Pages publication requires protected main"
            exit 1
          fi
          gh auth setup-git
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          PROTECTED_MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          if [[ ! "$PROTECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::protected-main commit is invalid"
            exit 1
          fi
          if [ "$PROTECTED_MAIN_SHA" != "$CONTENT_REF" ]; then
            if [[ ! "$SNAPSHOT_TAG" =~ ^content-[0-9]{8}T[0-9]{6}Z$ ]]; then
              echo "::error::historical content-ref requires an exact immutable snapshot tag"
              exit 1
            fi
            relation=$(gh api \
              "repos/${CONTENT_REPOSITORY}/compare/${CONTENT_REF}...${PROTECTED_MAIN_SHA}" \
              --jq .status)
            if [ "$relation" != ahead ]; then
              echo "::error::historical content-ref is not an ancestor of current protected main"
              exit 1
            fi
          fi

      - name: Validate immutable snapshot request
        id: snapshot
        env:
          PUBLICATION_SHA256: ${{ inputs.publication-sha256 }}
          REPOSITORY: ${{ github.repository }}
          CONTENT_REPOSITORY: ${{ github.repository }}
          SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
          SNAPSHOT_VERIFIER_REF: ${{ inputs.snapshot-verifier-ref }}
        run: |
          set -euo pipefail
          if [[ "$CONTENT_REPOSITORY" == "f5-sales-demo/html-to-markdown" ]] &&
            { [[ -z "$SNAPSHOT_TAG" ]] || [[ -z "$PUBLICATION_SHA256" ]] ||
              [[ -z "$SNAPSHOT_VERIFIER_REF" ]]; }; then
            echo "::error::html-to-markdown Pages builds require snapshot-tag, publication-sha256, and snapshot-verifier-ref"
            exit 1
          fi
          if [[ -z "$SNAPSHOT_TAG" && -z "$PUBLICATION_SHA256" &&
            -z "$SNAPSHOT_VERIFIER_REF" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$SNAPSHOT_TAG" =~ ^content-[0-9]{8}T[0-9]{6}Z$ ]] ||
            [[ ! "$PUBLICATION_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
            [[ ! "$SNAPSHOT_VERIFIER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::snapshot-tag, publication-sha256, and snapshot-verifier-ref must be exact immutable identities"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable snapshot verifier
        if: steps.snapshot.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: f5-sales-demo/docs-control
          ref: ${{ inputs.snapshot-verifier-ref }}
          path: .docs-control-policy
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve approved documentation builder
        id: builder
        env:
          REQUESTED_IMAGE: ${{ github.repository == 'f5-sales-demo/terraform-provider-xcsh' && 'ghcr.io/f5-sales-demo/docs-builder@sha256:049219671eb53fb884af5a529ab638ba01894492ac6918da76bc17a069607e72' || inputs.builder-image }}
          SNAPSHOT_ENABLED: ${{ steps.snapshot.outputs.enabled }}
        run: |
          if [[ ! "$REQUESTED_IMAGE" =~ ^ghcr\.io/f5-sales-demo/docs-builder(:latest|@sha256:[0-9a-f]{64})$ ]]; then
            echo "::error::builder-image must be ghcr.io/f5-sales-demo/docs-builder:latest or an approved immutable digest"
            exit 1
          fi
          if [[ "$SNAPSHOT_ENABLED" == "true" && "$REQUESTED_IMAGE" != *@sha256:* ]]; then
            echo "::error::snapshot builds require an immutable builder digest"
            exit 1
          fi

          docker pull "$REQUESTED_IMAGE"
          RESOLVED_BUILDER_IMAGE=$(
            docker image inspect "$REQUESTED_IMAGE" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}'
          )
          if [[ ! "$RESOLVED_BUILDER_IMAGE" =~ ^ghcr\.io/f5-sales-demo/docs-builder@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::builder-image did not resolve to exactly one approved repository digest"
            exit 1
          fi
          if [[ "$REQUESTED_IMAGE" == *@sha256:* && "$RESOLVED_BUILDER_IMAGE" != "$REQUESTED_IMAGE" ]]; then
            echo "::error::builder-image resolved to a digest other than the requested immutable identity"
            exit 1
          fi
          echo "builder_image=$RESOLVED_BUILDER_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download and verify exact snapshot
        id: snapshot-files
        if: steps.snapshot.outputs.enabled == 'true'
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.builder_image }}
          CONTENT_REF: ${{ steps.content.outputs.content_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_SHA256: ${{ inputs.publication-sha256 }}
          REPOSITORY: ${{ github.repository }}
          SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/snapshot-release"
          corpus_dir="$RUNNER_TEMP/machine-corpus"
          metadata="$RUNNER_TEMP/snapshot-release.json"
          mkdir -p "$release_dir"
          gh api "repos/$REPOSITORY/releases/tags/$SNAPSHOT_TAG" > "$metadata"
          jq -e --arg tag "$SNAPSHOT_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$metadata" >/dev/null
          git fetch --no-tags origin "refs/tags/$SNAPSHOT_TAG:refs/tags/$SNAPSHOT_TAG"
          source_commit=$(git rev-parse "$SNAPSHOT_TAG^{commit}")
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::snapshot tag does not resolve to a commit"
            exit 1
          fi
          gh release download "$SNAPSHOT_TAG" --repo "$REPOSITORY" --dir "$release_dir"
          python3 .docs-control-policy/scripts/verify-snapshot.py --release-dir "$release_dir" --tag "$SNAPSHOT_TAG" --publication-sha256 "$PUBLICATION_SHA256" --source-commit "$source_commit" --output "$corpus_dir"
          jq -n --arg snapshot_tag "$SNAPSHOT_TAG" --arg publication_sha256 "$PUBLICATION_SHA256" --arg source_commit "$source_commit" --arg content_commit "$CONTENT_REF" --arg builder_image "$BUILDER_IMAGE" '{schema_version:1, snapshot_tag:$snapshot_tag, publication_sha256:$publication_sha256, source_commit:$source_commit, content_commit:$content_commit, builder_image:$builder_image}' > "$corpus_dir/snapshot-provenance.json"
          chmod -R a-w "$corpus_dir"
          echo "machine_corpus=$corpus_dir" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Stage imported files for documentation
        env:
          CONTENT_PATH: ${{ inputs.content-path || 'docs' }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTENT_PATH" =~ ^[A-Za-z0-9._/-]+$ ]] ||
            [[ "$CONTENT_PATH" == /* ]] || [[ "$CONTENT_PATH" == *..* ]]; then
            echo "::error::content-path must be a safe relative repository path"
            exit 1
          fi
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          safe_relative_file() {
            local path="$1" component
            [ -n "$path" ] && [[ "$path" != /* ]] && [[ "$path" != */ ]] || return 1
            IFS=/ read -r -a components <<<"$path"
            for component in "${components[@]}"; do
              [ -n "$component" ] && [ "$component" != "." ] && [ "$component" != ".." ] || return 1
            done
          }
          IMPORTS="${CONTENT_PATH}/_imports"
          DATA_DIR="${CONTENT_PATH}/_data"
          if [ -f "$IMPORTS" ]; then
            mkdir -p "$DATA_DIR"
            while IFS= read -r line || [ -n "$line" ]; do
              line=$(trim "$line")
              if [ -z "$line" ] || [[ "$line" == "#"* ]]; then
                continue
              fi
              if [[ "$line" == *"->"* ]]; then
                source_path=$(trim "${line%%->*}")
                destination=$(trim "${line#*->}")
                if [[ "$destination" == *"->"* ]]; then
                  echo "::error::docs/_imports entry has multiple -> delimiters: $line"
                  exit 1
                fi
              else
                source_path="$line"
                destination=$(basename -- "$source_path")
              fi
              if ! safe_relative_file "$source_path" || ! safe_relative_file "$destination"; then
                echo "::error::docs/_imports entry must use non-empty safe relative file paths: $line"
                exit 1
              fi
              [ -f "$source_path" ] || continue
              target="$DATA_DIR/$destination"
              if [ -e "$target" ]; then
                echo "::error::docs/_imports destination is duplicated: $destination"
                exit 1
              fi
              mkdir -p "$(dirname -- "$target")"
              cp -- "$source_path" "$target"
              echo "Staged: $source_path -> $destination"
            done < "$IMPORTS"
          fi

      - name: Prepare Custom Responses configuration snippets
        if: github.repository == 'f5-sales-demo/custom-responses'
        run: |
          set -euo pipefail
          python3 scripts/prepare_snippets.py

      - name: Build docs with container
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.builder_image }}
          CONTENT_PATH: ${{ inputs.content-path || 'docs' }}
          PUBLICATION_SITE: ${{ inputs.docs-site || format('https://{0}.github.io', github.repository_owner) }}
          DOCS_BASE: ${{ inputs.docs-base }}
          DOCS_TITLE: ${{ inputs.docs-title }}
          SHARED_MODE: ${{ inputs.shared-mode }}
          OUTPUT_DIR: ${{ runner.temp }}/docs-output
          REPOSITORY: ${{ github.repository }}
          MACHINE_CORPUS_DIR: ${{ steps.snapshot-files.outputs.machine_corpus }}
          SNAPSHOT_ENABLED: ${{ steps.snapshot.outputs.enabled }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          if [ "$REPOSITORY" = f5-sales-demo/terraform-provider-xcsh ]; then
            CONTENT_PATH="documentation"
          fi
          mkdir -p "$OUTPUT_DIR"
          chmod 777 "$OUTPUT_DIR"

          MOUNTS=()
          for dir in "$CONTENT_PATH"/*/; do
            [ -d "$dir" ] || continue
            [ "$REPOSITORY" != f5-sales-demo/terraform-provider-xcsh ] || continue
            directory_name=$(basename "$dir")
            if ! find "$dir" -maxdepth 1 \( -name '*.md' -o -name '*.mdx' \) | grep -q .; then
              MOUNTS+=(-v "$WORKSPACE/$dir:/app/public/$directory_name:ro")
              echo "Static asset directory: $directory_name"
            fi
          done

          TITLE_ARGS=()
          [ -z "$DOCS_TITLE" ] || TITLE_ARGS=(-e "DOCS_TITLE=$DOCS_TITLE")

          CORPUS_ARGS=()
          if [[ "$SNAPSHOT_ENABLED" == "true" ]]; then
            CORPUS_ARGS=(
              -v "$MACHINE_CORPUS_DIR:/content/machine-corpus:ro"
              -e MACHINE_CORPUS_DIR=/content/machine-corpus
            )
          fi

          if [ "$REPOSITORY" = f5-sales-demo/terraform-provider-xcsh ]; then
            expected_builder=ghcr.io/f5-sales-demo/docs-builder@sha256:049219671eb53fb884af5a529ab638ba01894492ac6918da76bc17a069607e72
            if [ "$BUILDER_IMAGE" != "$expected_builder" ]; then
              echo "::error::canonical provider requires the accepted immutable builder"
              exit 1
            fi

          fi

          SHARED_ARGS=(-e "DOCS_SHARED_MODE=$SHARED_MODE")
          if [ "$REPOSITORY" = f5-sales-demo/f5-sales-demo.github.io ]; then
            test -f "$WORKSPACE/shared/v1/current.json"
            DOCS_BASE=/
            SHARED_ARGS+=(
              -v "$WORKSPACE/shared:/content/shared:ro"
              -e SHARED_ASSETS_DIR=/content/shared
            )
          fi

          COLLECTION_ARGS=()
          if [ "$REPOSITORY" = f5-sales-demo/terraform-provider-xcsh ]; then
            DOCS_BASE=/terraform-provider-xcsh/
            COLLECTION_ARGS=(
              -e DOCS_PROFILE=canonical-provider
              -e DOCUMENTATION_LABEL="Current"
              -e "DOCUMENTATION_SOURCE_COMMIT=${GITHUB_SHA}"
              -e "BUILDER_DIGEST=$BUILDER_IMAGE"
            )
          fi

          # shellcheck disable=SC2153
          docker run --rm --pull=never \
            --name docs-builder \
            "${COLLECTION_ARGS[@]}" \
            "${SHARED_ARGS[@]}" \
            -v "$WORKSPACE/$CONTENT_PATH:/content/docs:ro" \
            "${MOUNTS[@]}" \
            "${CORPUS_ARGS[@]}" \
            -v "$OUTPUT_DIR:/output" \
            -e CONTENT_DIR=/content/docs \
            -e OUTPUT_DIR=/output \
            -e "DOCS_SITE=$PUBLICATION_SITE" \
            -e "DOCS_BASE=$DOCS_BASE" \
            -e "GITHUB_REPOSITORY=$REPOSITORY" \
            "${TITLE_ARGS[@]}" \
            "$BUILDER_IMAGE"


          if [ "$REPOSITORY" = f5-sales-demo/terraform-provider-xcsh ]; then
            test -f "$CONTENT_PATH/generated-manifest.json"
            test -f "$CONTENT_PATH/terraform-llms-index.json"
            # verify_canonical_hierarchy.py contract, embedded at the exact workflow revision.
            python3 - "$CONTENT_PATH" "$OUTPUT_DIR" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          source, output = map(Path, sys.argv[1:])
          receipt = json.loads((output / "llms-hierarchy-receipt.json").read_text())
          manifest_bytes = (source / "generated-manifest.json").read_bytes()
          expected = "sha256:" + hashlib.sha256(manifest_bytes).hexdigest()
          if receipt["sourceManifestSha256"] != expected or not receipt["linksVerified"]:
              message = "canonical hierarchy source or discovery verification mismatch"
              raise ValueError(message)
          pages = set()
          for name in json.loads(manifest_bytes)["files"]:
              if name.startswith("documentation/") and name.endswith(".md") and "/_data/" not in name:
                  text = (source / name.removeprefix("documentation/")).read_text()
                  line = next((line for line in text.splitlines() if line.startswith("xcsh_docs: ")), None)
                  pages.add(json.loads(line.removeprefix("xcsh_docs: "))["id"] if line else "xcsh-docs:path:" + name)
          leaves = receipt["leaves"]
          if {leaf["id"] for leaf in leaves} != pages or len(leaves) != len(pages):
              message = "canonical hierarchy page coverage mismatch"
              raise ValueError(message)
          for leaf in leaves:
              data = (output / leaf["route"]).read_bytes()
              if len(data) != leaf["bytes"] or "sha256:" + hashlib.sha256(data).hexdigest() != leaf["sha256"]:
                  message = "canonical leaf digest mismatch"
                  raise ValueError(message)
          for scope in receipt["scopes"]:
              directory = output / scope
              for name, limit in (("llms-small.txt", 4096), ("llms.txt", 16384), ("llms-full.txt", 16384)):
                  data = (directory / name).read_bytes()
                  if scope == "" and name == "llms-full.txt":
                      continue
                  if len(data) > limit:
                      message = "canonical index byte budget exceeded"
                      raise ValueError(message)
          print(f"Verified hierarchy: {len(pages)} complete canonical leaves")
          PY
            cmp "$CONTENT_PATH/terraform-llms-index.json" "$OUTPUT_DIR/terraform-llms-index.json"
            cmp "$CONTENT_PATH/generated-manifest.json" "$OUTPUT_DIR/generated-manifest.json"
          fi

          echo "✅ Build completed successfully"
          ls -lah "$OUTPUT_DIR/"

      - name: Publish retained root shell assets
        if: github.repository == 'f5-sales-demo/f5-sales-demo.github.io'
        env:
          WORKSPACE: ${{ github.workspace }}
          OUTPUT_DIR: ${{ runner.temp }}/docs-output
          BUILDER_IMAGE: ${{ steps.builder.outputs.builder_image }}
        run: |
          # The root can publish releases before the one-time consumer migration.
          docker run --rm --pull=never --entrypoint node \
            -v "$WORKSPACE:/content/root:ro" "$BUILDER_IMAGE" \
            /content/root/scripts/validate-shared.mjs /content/root/shared
          mkdir -p "$OUTPUT_DIR/shared"
          cp -R "$WORKSPACE/shared"/. "$OUTPUT_DIR/shared/"

      - name: Verify build output
        env:
          OUTPUT_DIR: ${{ runner.temp }}/docs-output
          SNAPSHOT_ENABLED: ${{ steps.snapshot.outputs.enabled }}
        run: |
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A "$OUTPUT_DIR")" ]; then
            echo "❌ Build output is empty"
            exit 1
          fi
          if [[ "$SNAPSHOT_ENABLED" == "true" ]]; then
            for required in llms.txt llms-full.txt snapshot/manifest.json snapshot/SHA256SUMS snapshot/snapshot-provenance.json; do
              if [[ ! -f "$OUTPUT_DIR/$required" ]]; then
                echo "❌ Snapshot build output is missing $required"
                exit 1
              fi
            done
            if [[ -e "$OUTPUT_DIR/llms-small.txt" ]]; then
              echo "❌ Progressive corpus must not publish llms-small.txt"
              exit 1
            fi
          fi

          output_bytes=$(find "$OUTPUT_DIR" -type f -printf '%s\n' | awk '{sum += $1} END {printf "%.0f", sum}')
          echo "Assembled Pages artifact: $output_bytes bytes"
          if [ "$output_bytes" -ge 10000000000 ]; then
            echo "::error::assembled Pages artifact reaches the action 10 GB hard limit: $output_bytes bytes"
            exit 1
          fi

          echo "✅ Build output verified"
          echo "Files generated:"
          find "$OUTPUT_DIR" -type f | head -20

      - name: Stage governance assets for /api/
        env:
          CONTENT_REF: ${{ steps.content.outputs.content_ref }}
          BUILDER_IMAGE: ${{ steps.builder.outputs.builder_image }}
          OUTPUT_DIR: ${{ runner.temp }}/docs-output
          PUBLICATION_SHA256: ${{ inputs.publication-sha256 }}
          SNAPSHOT_SOURCE_COMMIT: ${{ steps.snapshot-files.outputs.source_commit }}
          SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
        run: |
          API_DIR="${OUTPUT_DIR}/api"
          mkdir -p "${API_DIR}/files"

          # Static config & templates
          for src in \
              .github/config/repo-settings.json \
              .github/config/managed-files-manifest.json \
              .github/config/docs-sites.json \
              README.md.tpl; do
            [ -f "$src" ] || continue
            dest="${API_DIR}/$(basename "$src")"
            cp "$src" "$dest"
            echo "Published: /api/$(basename "$src")"
          done

          # Per-file copies of every path listed in the managed-files manifest
          MANIFEST=".github/config/managed-files-manifest.json"
          if [ -f "$MANIFEST" ]; then
            mapfile -t FILES < <(jq -r '.files | keys[]' "$MANIFEST")
            for dest in "${FILES[@]}"; do
              if [ -f "$dest" ]; then
                target="${API_DIR}/files/${dest}"
                mkdir -p "$(dirname "$target")"
                cp "$dest" "$target"
                echo "Published: /api/files/${dest}"
              fi
            done
          fi

          # Deterministic publication identity: requested and resolved content.
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          jq -n \
            --arg content_ref "${CONTENT_REF}" \
            --arg commit "${CHECKED_OUT_SHA}" \
            --arg builder_image "${BUILDER_IMAGE}" \
            --arg snapshot_tag "${SNAPSHOT_TAG}" \
            --arg publication_sha256 "${PUBLICATION_SHA256}" \
            --arg snapshot_source_commit "${SNAPSHOT_SOURCE_COMMIT}" \
            '{content_ref:$content_ref, commit:$commit, builder_image:$builder_image, snapshot_tag:$snapshot_tag, publication_sha256:$publication_sha256, snapshot_source_commit:$snapshot_source_commit}' \
            > "${API_DIR}/revision.json"
          echo "Published: /api/revision.json"

          # Nudge Pages to not apply Jekyll to the api/ directory
          touch "${OUTPUT_DIR}/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/docs-output
          retention-days: 1

  deploy:
    name: Deploy Documentation
    needs: build
    runs-on: ${{ inputs.socketless_runner_label || fromJSON(format('["self-hosted","Linux","X64","{0}","ubuntu-24.04"]', github.event.repository.name)) }}
    if: success()
    permissions:
      pages: write # publish the verified Pages artifact
      id-token: write # authenticate the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
